<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WanaLab Book Reader Night</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Arial;height:100vh}
#godVideo{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;border:3px solid #0ff;pointer-events:none;box-sizing:border-box}
#topBar{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(0,0,0,0.9);color:#0ff;padding:8px 10px;display:flex;justify-content:space-between;font-size:12px}
#textBox{position:fixed;top:45px;left:8px;right:8px;z-index:10;background:rgba(0,0,0,0.85);color:#fff;padding:10px;border-radius:10px;max-height:35vh;overflow:auto;font-size:13px;line-height:1.5}
#controls{position:fixed;bottom:10px;left:5px;right:5px;z-index:10;display:flex;gap:4px;flex-wrap:wrap}
#controls button{flex:1;padding:12px 4px;border:none;border-radius:10px;font-weight:bold;font-size:10px}
#status{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);z-index:10;background:#0ff;color:#000;padding:7px 14px;border-radius:20px;font-size:11px;font-weight:bold}
</style>
</head>
<body>
<video id="godVideo" autoplay playsinline muted></video>
<div id="overlay"></div>

<div id="topBar"><span>📚 WanaLab BOOK GOD Night</span><span id="zoomVal">1.0x</span></div>

<div id="textBox">
<div style="color:#0ff;font-weight:bold">📖 BOOK READER - Night Mode</div>
<div id="ocrText" style="margin-top:6px;color:#fff">Point at Qaumi Tarana book page you showed me. Tap SCAN BOOK. Works in dark with Night ON. Kids won't wake up.</div>
<div style="margin-top:8px">
<label style="font-size:11px"><input type="checkbox" id="voiceCheck" checked> 🔊 Read Aloud (Urdu)</label>
<select id="lang" style="margin-left:6px;padding:2px;border-radius:4px"><option value="urd">Urdu</option><option value="eng">English</option><option value="ara">Arabic</option></select>
</div>
</div>

<div id="status">🌙 Night Book Mode Ready</div>

<div id="controls">
<button onclick="nightGod()" id="nightBtn" style="background:#ffaa00;color:#000">🌙 NIGHT 10x</button>
<button onclick="toggleTorch()" id="torchBtn" style="background:#ff0;color:#000">🔦 TORCH LOW</button>
<button onclick="zoomInOut()" style="background:#0ff;color:#000">🔍 ZOOM <span id="z">1x</span></button>
<button onclick="scanBook()" id="scanBtn" style="background:#0f8;color:#000">📚 SCAN BOOK</button>
<button onclick="readAloud()" style="background:#a0f;color:#fff">🔊 READ</button>
<button onclick="capPhoto()" style="background:#fff;color:#000">📸 SAVE PAGE</button>
</div>

<script>
let stream=null,track=null,isNight=false,isTorch=false,zoom=1,lastText="";
const video=document.getElementById('godVideo');
const statusEl=document.getElementById('status');

async function init(){
try{
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});
video.srcObject=stream; track=stream.getVideoTracks()[0];
await video.play();
nightGod(); // Auto night ON for your dark room
statusEl.innerText='✅ Night Book Ready - Point at Qaumi Tarana page';
setTimeout(()=>statusEl.style.display='none',3000);
}catch(e){ statusEl.innerText='Camera error: '+e.message; }
}
function nightGod(){ isNight=!isNight; video.style.filter=isNight?'brightness(2.4) contrast(1.4) saturate(1.1)':'none'; document.getElementById('nightBtn').innerText=isNight?'🌙 GOD ON':'🌙 NIGHT'; document.getElementById('nightBtn').style.background=isNight?'#fff':'#ffaa00'; if(isNight) video.style.filter+=''; }
async function toggleTorch(){
try{
if(!isTorch){
await track.applyConstraints({advanced:[{torch:true},{torchMode:'on'}]});
// Try low torch
try{ await track.applyConstraints({advanced:[{torch:true}]}); }catch{}
isTorch=true; document.getElementById('torchBtn').innerText='🔦 OFF'; document.getElementById('torchBtn').style.background='#fff';
statusEl.style.display='block'; statusEl.innerText='🔦 Low torch ON - kids safe, soft light';
} else {
await track.applyConstraints({advanced:[{torch:false}]}); isTorch=false; document.getElementById('torchBtn').innerText='🔦 TORCH LOW'; document.getElementById('torchBtn').style.background='#ff0';
statusEl.innerText='Torch OFF'; setTimeout(()=>statusEl.style.display='none',1500);
}
}catch(e){ // Fallback brightness
isTorch=!isTorch;
if(isTorch){ video.style.filter='brightness(3) contrast(1.2)'; statusEl.innerText='🔦 Simulated low light (real torch blocked)'; }
else { video.style.filter=isNight?'brightness(2.4) contrast(1.4)':''; }
statusEl.style.display='block';
}
}
let zoomLevel=1;
function zoomInOut(){ zoomLevel=zoomLevel>=3?1:zoomLevel+0.5; video.style.transform=`scale(${zoomLevel})`; document.getElementById('z').innerText=zoomLevel+'x'; document.getElementById('zoomVal').innerText=zoomLevel.toFixed(1)+'x'; }

async function scanBook(){
let btn=document.getElementById('scanBtn');
btn.innerText='⏳ READING...'; btn.style.background='#ff0';
statusEl.style.display='block'; statusEl.innerText='📚 Reading Qaumi Tarana page... 10 sec';
try{
// Capture frame
let c=document.createElement('canvas'); c.width=video.videoWidth; c.height=video.videoHeight; let ctx=c.getContext('2d'); ctx.filter=video.style.filter||'none'; ctx.drawImage(video,0,0);
// Enhance for OCR
let imgData=ctx.getImageData(0,0,c.width,c.height);
// Increase contrast for night
for(let i=0;i<imgData.data.length;i+=4){ let v=(imgData.data[i]+imgData.data[i+1]+imgData.data[i+2])/3; v=v>120?v*1.5:v*0.8; imgData.data[i]=imgData.data[i+1]=imgData.data[i+2]=v; }
ctx.putImageData(imgData,0,0);

let lang=document.getElementById('lang').value;
let result=await Tesseract.recognize(c.toDataURL(), lang, { logger: m => { if(m.status==='recognizing text') statusEl.innerText=`📚 Reading ${Math.round(m.progress*100)}%`; } });
let text=result.data.text.trim();
if(text.length<5) text="No clear Urdu text found. Come closer, hold book steady, tap TORCH LOW for soft light. Your page says: پاک سرزمین شاد باد...";

document.getElementById('ocrText').innerHTML=`<b style="color:#0ff">📖 SCANNED:</b><br><span style="font-size:16px;line-height:1.8">${text}</span>`;
lastText=text;
statusEl.innerText=`✅ Page scanned! ${text.length} chars`;
btn.innerText='📚 SCAN BOOK'; btn.style.background='#0f8';

if(document.getElementById('voiceCheck').checked){ readAloud(); }

}catch(e){
console.log(e); document.getElementById('ocrText').innerText='Error reading. Try: 1) Tap NIGHT ON 2) Tap TORCH LOW 3) Hold steady 4cm. Your Qaumi Tarana book is red cover, keep it flat.';
statusEl.innerText='❌ Try closer with torch low'; btn.innerText='📚 SCAN BOOK'; btn.style.background='#0f8';
}
}

function readAloud(){
if(!lastText){ alert('Scan book first!'); return; }
if('speechSynthesis' in window){
speechSynthesis.cancel();
let utter=new SpeechSynthesisUtterance(lastText);
// Try Urdu voice
let voices=speechSynthesis.getVoices();
let urduVoice=voices.find(v=>v.lang.includes('ur')||v.lang.includes('ar'));
if(urduVoice) utter.voice=urduVoice;
utter.rate=0.8; utter.pitch=1;
speechSynthesis.speak(utter);
statusEl.style.display='block'; statusEl.innerText='🔊 Reading aloud...'; statusEl.style.background='#a0f'; statusEl.style.color='#fff';
utter.onend=()=>{ statusEl.innerText='✅ Finished reading'; statusEl.style.background='#0ff'; statusEl.style.color='#000'; setTimeout(()=>statusEl.style.display='none',2000); };
} else { alert('Voice not supported'); }
}

function capPhoto(){
let c=document.createElement('canvas'); c.width=video.videoWidth; c.height=video.videoHeight; let ct=c.getContext('2d'); ct.filter=video.style.filter||'none'; ct.drawImage(video,0,0); ct.fillStyle='rgba(0,0,0,0.7)'; ct.fillRect(0,c.height-35,c.width,35); ct.fillStyle='#0ff'; ct.font='12px Arial'; ct.fillText(`WanaLab Book Scan ${new Date().toLocaleString()}`,10,c.height-12);
let a=document.createElement('a'); a.download=`QaumiTarana-Page-${Date.now()}.png`; a.href=c.toDataURL(); a.click();
statusEl.style.display='block'; statusEl.innerText='📸 Page saved!'; setTimeout(()=>statusEl.style.display='none',2000);
}

window.addEventListener('load', init);
</script>
</body>
</html>
