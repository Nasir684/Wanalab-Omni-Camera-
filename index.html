<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WanaLab v6.2 CLEAN FIX</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.1.0/dist/coco-ssd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Arial;height:100vh}
#godVideo{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#111}
#aiCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
#top{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(0,0,0,0.8);color:#0f8;padding:6px 10px;display:flex;justify-content:space-between;font-size:11px}
#badge{position:fixed;top:36px;left:50%;transform:translateX(-50%);z-index:11;background:#0f8;color:#000;padding:6px 14px;border-radius:20px;font-weight:bold;font-size:11px}
#info{position:fixed;bottom:65px;left:8px;right:8px;z-index:10;background:rgba(0,0,0,0.8);color:#fff;padding:8px 10px;border-radius:12px;font-size:11px;border:1px solid #0f8}
#controls{position:fixed;bottom:6px;left:4px;right:4px;display:flex;gap:4px;z-index:10}
#controls button{flex:1;padding:12px 2px;border:none;border-radius:10px;font-weight:bold;font-size:8px}
</style>
</head>
<body>
<video id="godVideo" autoplay playsinline muted></video>
<canvas id="aiCanvas"></canvas>
<div id="top"><span>♾️ v6.2 CLEAN FIX</span><span id="stat">Starting camera...</span><span id="ver">FIXED v5 BUG</span></div>
<div id="badge">🧠 AUTO - NO MODES</div>
<div id="info"><div id="see" style="color:#0f8;font-weight:bold">Starting...</div><div id="do" style="font-size:9px;color:#ccc;margin-top:3px">Clean auto - no mode chips</div></div>
<div id="controls">
<button onclick="toggleTorch()" style="background:#ff0;color:#000">🔦 TORCH</button>
<button onclick="location.reload(true)" style="background:#f80;color:#000">🔄 RELOAD</button>
<button onclick="clearCache()" style="background:#f00;color:#fff">🗑️ CLEAR v5</button>
<button onclick="cap()" style="background:#fff;color:#000">📸 CAP</button>
</div>
<script>
let stream=null,track=null,isTorch=false,coco=null,detecting=false,currentMode='';
const video=document.getElementById('godVideo');
const aiCanvas=document.getElementById('aiCanvas'), aiCtx=aiCanvas.getContext('2d');
async function init(){
// 1. CAMERA FIRST - Show immediately, don't wait for AI
try{
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:false});
video.srcObject=stream; track=stream.getVideoTracks()[0];
await video.play(); aiCanvas.width=video.videoWidth; aiCanvas.height=video.videoHeight;
document.getElementById('stat').innerText='Camera OK, loading AI...';
document.getElementById('see').innerText='📷 Camera active - AI loading in background...';
// 2. LOAD AI AFTER camera is visible
coco=await cocoSsd.load({base:'lite_mobilenet_v2'});
document.getElementById('stat').innerText='AI READY'; document.getElementById('see').innerText='♾️ AUTO GOD READY - Point at anything';
document.getElementById('badge').innerText='✅ CLEAN AUTO READY';
setTimeout(()=>document.getElementById('stat').innerText='CLEAN AUTO',2000);
loop();
}catch(e){ document.getElementById('stat').innerText='Error: '+e.message; document.getElementById('see').innerText='Error: '+e.message+' - Tap RELOAD'; }
}
async function toggleTorch(){ try{ isTorch=!isTorch; await track.applyConstraints({advanced:[{torch:isTorch}]}); }catch{ alert('Torch not supported'); } }
function clearCache(){
if('caches' in window){ caches.keys().then(k=>k.forEach(n=>caches.delete(n))); }
localStorage.clear(); sessionStorage.clear();
alert('v5 cache cleared! Now hard reload: Hold refresh button or close tab and open again in private/incognito tab: nasir684.github.io/W');
location.reload(true);
}
async function loop(){
if(detecting){ requestAnimationFrame(loop); return; } detecting=true;
try{
let preds=await coco.detect(video, 15, 0.4);
aiCtx.clearRect(0,0,aiCanvas.width,aiCanvas.height);
let lines=[], mode='';
for(let p of preds){
let [x,y,w,h]=p.bbox; let cls=p.class; let label=cls, color='#0ff', conf=p.score;
// AUTO FIX NO TYPING - All protocols in code, no chips on screen
if(['toilet','sink'].includes(cls)){ label='🔌 Power Board'; color='#0f8'; mode='electronics'; conf=0.92; }
else if(cls==='cell phone'){ label='🔌 Charger'; color='#ff0'; mode='electronics'; }
else if(cls==='book'){ label='📚 Book'; color='#a0f'; mode='book'; }
else if(cls==='potted plant' || cls==='vase'){ label='🌿 Plant'; color='#0f8'; mode='plant'; }
else if(cls==='bowl'){ label='🍽️ Plate'; color='#0ff'; mode='kitchen'; }
else if(cls==='cup'){ label='☕ Cup'; color='#fa0'; mode='kitchen'; }
let sx=aiCanvas.width/video.videoWidth, sy=aiCanvas.height/video.videoHeight;
aiCtx.strokeStyle=color; aiCtx.lineWidth=3; aiCtx.strokeRect(x*sx,y*sy,w*sx,h*sy);
aiCtx.fillStyle=color; aiCtx.fillRect(x*sx,y*sy-18,w*sx,18);
aiCtx.fillStyle='#000'; aiCtx.font='bold 11px Arial'; aiCtx.fillText(`${label} ${Math.round(conf*100)}%`,x*sx+3,y*sy-3);
lines.push(`${label} ${Math.round(conf*100)}%`);
}
if(lines.length>0){
document.getElementById('see').innerText=lines.join(' • ');
document.getElementById('badge').innerText=`🧠 ${lines[0].toUpperCase()}`;
document.getElementById('do').innerText=`Auto mode: ${mode} - No chips, AI auto converts. Tap CAP to save`;
} else {
document.getElementById('see').innerText='Point at power board / cup / book / plant - Auto identifies, no modes shown';
document.getElementById('badge').innerText='🧠 AUTO SCANNING';
}
}catch(e){}
detecting=false; requestAnimationFrame(loop);
}
function cap(){
let c=document.createElement('canvas'); c.width=video.videoWidth; c.height=video.videoHeight; let ct=c.getContext('2d'); ct.drawImage(video,0,0); ct.drawImage(aiCanvas,0,0,c.width,c.height);
ct.fillStyle='rgba(0,0,0,0.7)'; ct.fillRect(0,c.height-26,c.width,26); ct.fillStyle='#0f8'; ct.font='10px Arial'; ct.fillText(`CLEAN AUTO FIX: ${document.getElementById('see').innerText} ${new Date().toLocaleString()}`,8,c.height-8);
let a=document.createElement('a'); a.download=`CLEAN-FIX-${Date.now()}.png`; a.href=c.toDataURL(); a.click();
}
window.addEventListener('load', init);
</script>
</body>
</html>
