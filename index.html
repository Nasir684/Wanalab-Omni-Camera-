#sliders.show{display:flex}
.sliderRow{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800}
.sliderRow label{width:70px;color:#0f8}.sliderRow input{flex:1}
#shutter{position:fixed;bottom:118px;left:50%;transform:translateX(-50%);z-index:12;width:76px;height:76px;border-radius:50%;background:#fff;border:4px solid #00ff88;box-shadow:0 0 15px #00ff88;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer}
#info{position:fixed;bottom:192px;left:6px;right:6px;z-index:10;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);padding:6px 8px;border-radius:10px;font-size:9px;border:1px solid rgba(0,255,136,.4);max-height:16vh;overflow:auto}
