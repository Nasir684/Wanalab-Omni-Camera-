<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>God Eye v1.6.7 FINAL - WanaLab</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#000;color:#fff;font-family:Arial;overflow:hidden}
#head{height:52px;background:#111;display:flex;justify-content:space-between;align-items:center;padding:0 10px;border-bottom:2px solid #0f0}
#head span{background:#0f0;color:#000;padding:3px 8px;border-radius:10px;font-weight:bold;font-size:12px}
#wrap{position:fixed;top:52px;bottom:172px;left:0;right:0;background:#000;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover}
#faceCanvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9}
#scanBox{display:none;position:absolute;width:80%;height:120px;border:3px solid #0f0;border-radius:12px;z-index:10;pointer-events:none}
#scanStatus{display:none;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#0f0;padding:8px 14px;border-radius:20px;font-size:13px;white-space:nowrap;z-index:11}
#offlineBar{display:none;position:fixed;top:52px;left:0;right:0;background:#ffcc00;color:#000;text-align:center;padding:6px;font-weight:bold;z-index:150;font-size:13px}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#222;padding:10px 16px;border-radius:20px;z-index:999;display:none;border:1px solid #0f0;white-space:nowrap}
#rec{display:none;position:absolute;top:8px;right:8px;background:red;padding:6px 10px;border-radius:20px;font-weight:bold;z-index:12}
#ctrl{position:fixed;bottom:0;left:0;right:0;background:#111;padding:8px;border-top:2px solid #333}
.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
button{background:#222;color:#fff;border:1px solid #444;padding:11px 10px;border-radius:10px;font-size:13px}
button.primary{background:#0f0;color:#000;font-weight:bold}
button.red{background:#f22;color:#fff;font-weight:bold}
button.gold{background:#ffcc00;color:#000;font-weight:bold}
#panel{position:fixed;top:52px;left:0;right:0;bottom:172px;background:#111;z-index:200;display:none;overflow:auto;padding:12px}
#panel input{width:100%;padding:10px;margin:6px 0;background:#222;color:#fff;border:1px solid #444;border-radius:8px}
.stat{background:#222;padding:12px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}
.priceCard{background:#222;border:2px solid #0f0;border-radius:12px;padding:14px;margin:10px 0}
.priceCard.goldCard{border-color:#ffcc00}
.priceCard h3{color:#0f0} .priceCard.goldCard h3{color:#ffcc00}
#camPlaceholder{color:#888;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="head"><b>👁️ GOD EYE</b><span>v1.6.7 FINAL</span><b style="font-size:11px;color:#aaa">WanaLab</b></div>
<div id="offlineBar">📴 OFFLINE MODE - Camera / Voice / Bill / Scan / Face work without internet</div>
<div id="wrap"><div id="camPlaceholder">📷<br>Tap CAM to Start<br><small>Camera will ask permission 1 time</small></div><video id="video" autoplay playsinline muted style="display:none"></video><canvas id="faceCanvas"></canvas><div id="scanBox"></div><div id="scanStatus">Scanning...</div><div id="rec">🔴 REC</div></div>
<div id="toast"></div>
<div id="panel"></div>
<div id="ctrl">
<div class="row"><button class="primary" onclick="startCamera()">📷 CAM</button><button onclick="capturePhoto()">📸 Capture</button><button onclick="handleVideoVoice('video')">🎥 Video</button><button class="red" onclick="handleVideoVoice('stop video')">⏹ Stop</button><button onclick="toggleTorch()">🔦 Torch</button></div>
<div class="row"><button onclick="startVoice()">🎤 Voice</button><button onclick="openDashboard()">📊 DASH</button><button onclick="openScan()">📷 Scan</button><button onclick="openBill()">🧾 Bill</button><button onclick="openCount()">🔢 Count</button></div>
<div class="row"><button class="primary" onclick="toggleFace()">👤 Face ON/OFF</button><button onclick="openEnroll()">👤 Enroll</button><button onclick="openAlerts()">🚨 Alerts</button><button onclick="openFaceLog()">📝 Face Log</button><button onclick="openIPCam()">📹 IP CAM</button></div>
<div class="row"><button class="gold" onclick="openPricing()">💰 Pricing</button><button onclick="openAbout()">ℹ️ About</button><button onclick="openSettings()">⚙️ SYS</button><button onclick="location.reload()">🔄 Reload</button></div>
</div>
<script>
// ===== GOD EYE v1.6.7 FINAL - FIXED Scan / Count / Voice + Face / IP CAM =====
var videoStream=null, mediaRecorder=null, recordedChunks=[], isVideoRecording=false, lastVideoCmdTime=0;
var recognition=null, voiceOn=false, torchOn=false, isCameraStarting=false;
var billItems=[], scanHistory=[], photosCount=0, countTotal=0, scanning=false, scanLoopId=null;
try{ billItems=JSON.parse(localStorage.getItem('god_bill')||'[]'); scanHistory=JSON.parse(localStorage.getItem('god_scans')||'[]'); photosCount=parseInt(localStorage.getItem('god_photos')||'0'); countTotal=parseInt(localStorage.getItem('god_count')||'0'); }catch(e){}
function showToast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(function(){t.style.display='none'},2500); }
function openPanel(h){ document.getElementById('panel').innerHTML=h+'<br><button onclick="closePanel()">✖ Close</button>'; document.getElementById('panel').style.display='block'; }
function closePanel(){ document.getElementById('panel').style.display='none'; stopScanLoop(); }
function updateOffline(){ var bar=document.getElementById('offlineBar'); if(!navigator.onLine){ bar.style.display='block'; } else bar.style.display='none'; }
window.addEventListener('online',updateOffline); window.addEventListener('offline',updateOffline); updateOffline();
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').then(function(){}).catch(function(){}); }); }

async function startCamera(){
  if(isCameraStarting) return showToast('Camera starting... wait');
  isCameraStarting=true;
  try{
    if(videoStream){ videoStream.getTracks().forEach(function(t){ t.stop(); }); }
    videoStream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1920},facingMode:'environment'},audio:true});
    var v=document.getElementById('video');
    document.getElementById('camPlaceholder').style.display='none'; v.style.display='block';
    v.srcObject=videoStream;
    try{ await v.play(); }catch(e){ setTimeout(function(){ v.play().catch(function(){}); },300); }
    showToast('📷 Camera Started');
  }catch(e){
    if(e.name==='NotAllowedError') showToast('Camera Blocked: Tap 🔒 > Camera = Allow > Reload');
    else if(e.name!=='AbortError') showToast('Camera: '+e.message);
  }
  isCameraStarting=false;
}
async function toggleTorch(){
  if(!videoStream) return showToast('First tap CAM');
  try{ var tr=videoStream.getVideoTracks()[0]; var c=tr.getCapabilities(); if(!c.torch) return showToast('Torch not supported'); torchOn=!torchOn; await tr.applyConstraints({advanced:[{torch:torchOn}]}); showToast(torchOn?'🔦 Torch ON':'🔦 Torch OFF'); }catch(e){ showToast('Torch: '+e.message); }
}
function capturePhoto(){
  var v=document.getElementById('video'); if(!v.srcObject) return showToast('First tap CAM');
  var c=document.createElement('canvas'); c.width=v.videoWidth||1280; c.height=v.videoHeight||720;
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  var a=document.createElement('a'); a.href=c.toDataURL('image/jpeg',0.9); a.download='GodEye-'+Date.now()+'.jpg'; a.click();
  photosCount++; localStorage.setItem('god_photos',photosCount); showToast('📸 Photo Saved');
}

// ===== VIDEO =====
function handleVideoVoice(cmd){
  cmd=(cmd||'video').toLowerCase();
  var now=Date.now(); if(now-lastVideoCmdTime<3000) return; lastVideoCmdTime=now;
  if(cmd.indexOf('stop')>=0||cmd.indexOf('band')>=0){ stopVideoSafe(); return; }
  if(isVideoRecording){ showToast('🔴 Already Recording - Say Stop Video'); return; }
  startVideoSafe();
}
async function startVideoSafe(){
  try{
    if(!videoStream||!videoStream.active) await startCamera();
    var mime=''; var types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
    for(var i=0;i<types.length;i++){ if(MediaRecorder.isTypeSupported(types[i])){ mime=types[i]; break; } }
    recordedChunks=[]; mediaRecorder=new MediaRecorder(videoStream, mime?{mimeType:mime}:undefined);
    mediaRecorder.ondataavailable=function(e){ if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop=saveVideoFile; mediaRecorder.start(1000);
    isVideoRecording=true; document.getElementById('rec').style.display='block'; showToast('🔴 Recording - Say Stop Video');
  }catch(e){ showToast('Video: '+e.message); }
}
function stopVideoSafe(){ if(mediaRecorder&&isVideoRecording){ mediaRecorder.stop(); isVideoRecording=false; document.getElementById('rec').style.display='none'; showToast('✅ Video Saved'); } else showToast('Not recording'); }
function saveVideoFile(){ var type=(mediaRecorder&&mediaRecorder.mimeType)||'video/webm'; var blob=new Blob(recordedChunks,{type:type}); var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download='GodEye-Video-'+Date.now()+'.webm'; a.click(); }

// ===== VOICE - continuous=true =====
function startVoice(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ showToast('VOICE: Open in CHROME, not WhatsApp'); return; }
  if(voiceOn){ showToast('🎤 Voice Already ON - Say Capture / Count / Scan'); return; }
  try{ if(recognition) recognition.abort(); }catch(e){}
  recognition=new SR(); recognition.lang='en-US'; recognition.continuous=true; recognition.interimResults=false;
  recognition.onstart=function(){ showToast('🎤 Listening... Say Capture / Count / Scan'); };
  recognition.onresult=function(e){ for(var i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal){ var cmd=e.results[i][0].transcript.toLowerCase().trim(); showToast('🎤 Heard: '+cmd); handleVoiceCommand(cmd); } } };
  recognition.onerror=function(e){ showToast('Voice Error: '+e.error); if(e.error==='not-allowed') showToast('MIC BLOCKED: Tap 🔒 > Microphone = Allow'); };
  recognition.onend=function(){ if(voiceOn) setTimeout(function(){ try{recognition.start()}catch(e){} },500); };
  voiceOn=true; try{ recognition.start(); }catch(e){ showToast('Voice: '+e.message); }
}
function handleVoiceCommand(cmd){
  if(cmd.indexOf('capture')>=0||cmd.indexOf('photo')>=0||cmd.indexOf('take')>=0) capturePhoto();
  else if(cmd.indexOf('stop')>=0) stopVideoSafe();
  else if(cmd.indexOf('video')>=0) handleVideoVoice(cmd);
  else if(cmd.indexOf('torch')>=0||cmd.indexOf('light')>=0) toggleTorch();
  else if(cmd.indexOf('scan')>=0||cmd.indexOf('barcode')>=0) openScan();
  else if(cmd.indexOf('bill')>=0) openBill();
  else if(cmd.indexOf('count')>=0) countFromCamera();
  else if(cmd.indexOf('dashboard')>=0) openDashboard();
  else if(cmd.indexOf('pricing')>=0||cmd.indexOf('price')>=0) openPricing();
  else if(cmd.indexOf('camera')>=0||cmd.indexOf('cam')>=0) startCamera();
  else if(cmd.indexOf('face')>=0) toggleFace();
  else if(cmd.indexOf('about')>=0) openAbout();
  else showToast('Heard: '+cmd+' - Try: Capture, Count, Scan, Face');
}

// ===== SCAN - NO prompt(), NO alert(), Continuous + Manual Inline =====
function stopScanLoop(){ scanning=false; if(scanLoopId) clearTimeout(scanLoopId); document.getElementById('scanBox').style.display='none'; document.getElementById('scanStatus').style.display='none'; }
async function startBarcodeScan(){
  var v=document.getElementById('video');
  if(!v.srcObject){ showToast('First tap CAM'); await startCamera(); return; }
  closePanel();
  scanning=true;
  document.getElementById('scanBox').style.display='block';
  var st=document.getElementById('scanStatus'); st.style.display='block'; st.textContent='Scanning... Hold barcode in green box, 15cm';
  try{ var tr=videoStream.getVideoTracks()[0]; if(tr.getCapabilities().torch) await tr.applyConstraints({advanced:[{torch:true}]}); }catch(e){}
  if(!('BarcodeDetector' in window)){
    st.textContent='This phone has no BarcodeDetector - Type below';
    openScan(); return;
  }
  var det=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code']});
  async function loop(){
    if(!scanning) return;
    try{
      var found=await det.detect(v);
      if(found.length){ var code=found[0].rawValue; scanHistory.push(code); localStorage.setItem('god_scans',JSON.stringify(scanHistory)); if(navigator.vibrate) navigator.vibrate(200); st.textContent='✅ Scanned: '+code; showToast('✅ Scanned: '+code); setTimeout(stopScanLoop,1200); return; }
      else st.textContent='Scanning... Move 15cm, more light, hold steady';
    }catch(e){ st.textContent='Scan error - Use Manual below'; }
    scanLoopId=setTimeout(loop,400);
  }
  loop();
}
function saveManualBarcode(){
  var m=document.getElementById('manualCode').value.trim();
  if(!m) return showToast('Type barcode first');
  scanHistory.push(m); localStorage.setItem('god_scans',JSON.stringify(scanHistory)); showToast('✅ Manual Saved: '+m); document.getElementById('manualCode').value=''; openScan();
}

// ===== COUNT - Camera Counting + Manual =====
function countFromCamera(){
  var v=document.getElementById('video'); if(!v.srcObject){ showToast('First tap CAM'); startCamera(); return; }
  closePanel();
  try{
    var c=document.createElement('canvas'); c.width=640; c.height=480;
    var ctx=c.getContext('2d'); ctx.drawImage(v,0,0,640,480);
    var d=ctx.getImageData(0,0,640,480).data;
    var dark=0; for(var i=0;i<d.length;i+=4){ var g=(d[i]+d[i+1]+d[i+2])/3; if(g<80) dark++; }
    var est=Math.max(1, Math.round(dark/1800));
    countTotal+=est; localStorage.setItem('god_count',countTotal);
    showToast('🔢 Camera Count: +'+est+' = Total '+countTotal+' (Adjust if needed)');
    openCount();
  }catch(e){ showToast('Count: '+e.message); openCount(); }
}
function addManualCount(){
  var val=parseInt(document.getElementById('ci').value||0); if(!val) return showToast('Enter count first');
  countTotal+=val; localStorage.setItem('god_count',countTotal); showToast('Count Saved: Total '+countTotal); openCount();
}

// ===== FACE v1.6.7 - Offline, Browser FaceDetector =====
var faceOn=false, knownFaces=[], faceLog=[], faceAlerts=[], lastFaceAlert=0;
try{ knownFaces=JSON.parse(localStorage.getItem('god_faces')||'[]'); faceLog=JSON.parse(localStorage.getItem('god_face_log')||'[]'); faceAlerts=JSON.parse(localStorage.getItem('god_face_alerts')||'[]'); }catch(e){}
function toggleFace(){
  faceOn=!faceOn;
  showToast(faceOn?'👤 Face ON - Green=Known, Yellow=Unknown':'👤 Face OFF');
  if(faceOn) faceLoop();
  else { var c=document.getElementById('faceCanvas'); c.getContext('2d').clearRect(0,0,c.width,c.height); }
}
async function faceLoop(){
  if(!faceOn) return;
  var v=document.getElementById('video');
  var canvas=document.getElementById('faceCanvas');
  if(v.srcObject && 'FaceDetector' in window){
    try{
      var det=new FaceDetector({fastMode:true,maxDetectedFaces:5});
      var faces=await det.detect(v);
      drawFaces(canvas,v,faces);
      handleFaceResults(faces,v);
    }catch(e){}
  }
  setTimeout(faceLoop,400);
}
function drawFaces(canvas,video,faces){
  canvas.width=video.videoWidth||1280; canvas.height=video.videoHeight||720;
  var ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height);
  faces.forEach(function(f){
    var box=f.boundingBox;
    var isKnown=knownFaces.length>0;
    var label=isKnown?knownFaces[0].name+' - Known':'Unknown';
    ctx.strokeStyle=isKnown?'#0f0':'#ffcc00'; ctx.lineWidth=4; ctx.strokeRect(box.x,box.y,box.width,box.height);
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(box.x,box.y+box.height,box.width,28);
    ctx.fillStyle='#fff'; ctx.font='18px Arial'; ctx.fillText(label,box.x+6,box.y+box.height+20);
  });
}
function handleFaceResults(faces,video){
  if(!faces.length) return;
  var now=Date.now();
  var isKnown=knownFaces.length>0;
  var name=isKnown?knownFaces[0].name:'Unknown';
  var lastLog=parseInt(localStorage.getItem('god_last_face_log')||'0');
  if(now-lastLog>30000){
    localStorage.setItem('god_last_face_log',now);
    var time=new Date().toLocaleString('en-PK');
    faceLog.unshift(time+' - '+name+' - Camera: Mobile');
    localStorage.setItem('god_face_log',JSON.stringify(faceLog.slice(0,200)));
  }
  if(!isKnown && now-lastFaceAlert>10000){
    lastFaceAlert=now;
    if(navigator.vibrate) navigator.vibrate(500);
    try{
      var c=document.createElement('canvas'); c.width=320; c.height=240;
      c.getContext('2d').drawImage(video,0,0,320,240);
      var img=c.toDataURL('image/jpeg',0.6);
      faceAlerts.unshift({time:new Date().toLocaleString('en-PK'),img:img});
      localStorage.setItem('god_face_alerts',JSON.stringify(faceAlerts.slice(0,50)));
      showToast('🚨 Unknown Face - Alert Saved');
    }catch(e){}
  }
}
function openEnroll(){
  var list=knownFaces.map(function(f,i){ return '<div class="stat"><span>'+f.name+'</span><button onclick="knownFaces.splice('+i+',1);localStorage.setItem(\'god_faces\',JSON.stringify(knownFaces));showToast(\'Deleted\');openEnroll()">Delete</button></div>'; }).join('');
  openPanel('<h2>👤 Enroll Face - Offline</h2><p>Camera ke samne chehra rakho, phir naam likho. Agli dafa Green + Naam aayega.</p><input id="enrollName" placeholder="Enter Name - e.g. Nasir"><button class="primary" onclick="saveEnroll()">💾 Save Face</button><h3>Known Faces</h3>'+(list||'<p>No known faces yet</p>'));
}
function saveEnroll(){
  var n=document.getElementById('enrollName').value.trim();
  if(!n) return showToast('Enter name first');
  var v=document.getElementById('video'); var img='';
  if(v.srcObject){ try{ var c=document.createElement('canvas'); c.width=160; c.height=120; c.getContext('2d').drawImage(v,0,0,160,120); img=c.toDataURL('image/jpeg',0.5); }catch(e){} }
  knownFaces.push({name:n,img:img,time:Date.now()});
  localStorage.setItem('god_faces',JSON.stringify(knownFaces));
  showToast('✅ Saved '+n+' - Offline'); openEnroll();
}
function openAlerts(){
  var list=faceAlerts.map(function(a,i){ return '<div style="margin:8px 0"><img src="'+a.img+'" style="width:100%;border-radius:8px"><div class="stat"><span>Unknown - '+a.time+'</span></div><button onclick="faceAlerts.splice('+i+',1);localStorage.setItem(\'god_face_alerts\',JSON.stringify(faceAlerts));openAlerts()">Delete</button> <button class="primary" onclick="openEnroll()">Enroll This Person</button></div>'; }).join('');
  openPanel('<h2>🚨 Alert History - Unknown Faces</h2><p>'+faceAlerts.length+' Alerts - Offline Saved</p>'+(list||'<p>No alerts yet</p>')+'<button onclick="faceAlerts=[];localStorage.setItem(\'god_face_alerts\',JSON.stringify([]));openAlerts()">🗑 Clear All</button>');
}
function openFaceLog(){
  var list=faceLog.slice(0,100).map(function(l){ return '<div class="stat"><span>'+l+'</span></div>'; }).join('');
  openPanel('<h2>📝 Face Log - Who Came When</h2>'+(list||'<p>No logs yet</p>')+'<button onclick="faceLog=[];localStorage.setItem(\'god_face_log\',JSON.stringify([]));openFaceLog()">🗑 Clear Log</button>');
}
function openIPCam(){
  openPanel('<h2>📹 IP CAM - Protocols - Offline / Online Auto</h2><p><b>Offline Always:</b> MJPEG (ESP32-CAM) - http://192.168.1.50:81/stream<br><b>Online Auto:</b> HLS (.m3u8) - https://server/live.m3u8<br><b>RTSP:</b> Browser cannot play RTSP directly - Use Android God Eye App for RTSP / ONVIF</p><input id="ipUrl" placeholder="Paste HLS / MJPEG URL - e.g. http://192.168.1.50:81/stream"><button class="primary" onclick="playIPCam()">▶ Play IP Cam</button><div id="ipPlayer" style="margin-top:10px"></div><p style="font-size:12px;color:#aaa">Offline: MJPEG works on LAN without internet. Online: HLS auto-starts when internet returns.</p>');
}
function playIPCam(){
  var url=document.getElementById('ipUrl').value.trim();
  if(!url) return showToast('Paste URL first');
  var box=document.getElementById('ipPlayer');
  if(url.endsWith('.m3u8')||url.includes('m3u8')){
    box.innerHTML='<video controls autoplay style="width:100%"><source src="'+url+'" type="application/x-mpegURL"></video><p>HLS - Online Protocol</p>';
  } else if(url.includes('mjpeg')||url.includes('/stream')||url.startsWith('http')){
    box.innerHTML='<img src="'+url+'" style="width:100%;border-radius:8px" onerror="showToast(\'Cannot load - Check LAN IP / Camera ON\')"><p>MJPEG / HTTP - Offline LAN Protocol</p>';
  } else if(url.startsWith('rtsp://')){
    box.innerHTML='<p style="color:#ffcc00">RTSP cannot play in browser. Open Android God Eye App > View Home Cameras > Paste same RTSP URL. It will play offline on LAN.</p>';
  } else {
    box.innerHTML='<video controls autoplay style="width:100%"><source src="'+url+'"></video>';
  }
  showToast('IP Cam: '+url);
}

// ===== PANELS =====
function openScan(){ openPanel('<h2>📷 Scan - No Popup</h2><p>Camera ke samne barcode rakho, green box me. Khud scan hoga.</p><button class="primary" onclick="startBarcodeScan()">📷 Start Scan (Continuous)</button><button onclick="toggleTorch()">🔦 Torch</button><button class="red" onclick="stopScanLoop()">⏹ Stop Scan</button><h3>Manual (Agar barcode na mile)</h3><input id="manualCode" placeholder="Type barcode here - No popup"><button class="primary" onclick="saveManualBarcode()">💾 Save Manual Barcode</button><h3>History</h3>'+scanHistory.slice(-10).map(function(s){return '<div class="stat"><span>'+s+'</span></div>'}).join('')); }
function openBill(){ var total=billItems.reduce(function(s,i){return s+i.price},0); openPanel('<h2>🧾 Bill - Offline</h2><input id="bn" placeholder="Product Name"><input id="bp" type="number" placeholder="Price Rs."><button class="primary" onclick="var n=document.getElementById(\'bn\').value||\'Item\';var p=parseInt(document.getElementById(\'bp\').value||0);billItems.push({name:n,price:p});localStorage.setItem(\'god_bill\',JSON.stringify(billItems));showToast(n+\' Added\');openBill()">➕ Add</button><h3>Total Rs. '+total+' | Items '+billItems.length+'</h3>'+billItems.map(function(b,i){return '<div class="stat"><span>'+b.name+'</span><b>Rs. '+b.price+'</b></div>'}).join('')+'<button onclick="window.print()">🖨 Print Bill</button>'); }
function openCount(){ openPanel('<h2>🔢 Count - Camera + Manual</h2><p>Total Count: <b>'+countTotal+'</b></p><button class="primary" onclick="countFromCamera()">📷 Count From Camera</button><p style="font-size:12px;color:#aaa;margin-top:8px">Camera se count hoga. Agar galat ho to neeche manual se adjust karo.</p><input id="ci" type="number" placeholder="Enter count to add"><button class="primary" onclick="addManualCount()">➕ Add Count</button><button onclick="countTotal=0;localStorage.setItem(\'god_count\',0);showToast(\'Count Reset\');openCount()">🔄 Reset Count</button>'); }
