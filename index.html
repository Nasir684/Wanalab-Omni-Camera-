<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WanaLab God Eye PRO v1.2</title>
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{background:#000;overflow:hidden;font-family:Arial,sans-serif;height:100vh;width:100vw}
 #godVideo{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:1}
 #topBar{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(0,0,0,0.7);color:#0f0;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
 #zoomBar{position:fixed;top:50px;right:10px;z-index:1000;background:rgba(0,0,0,0.7);padding:12px;border-radius:12px;color:#fff;backdrop-filter:blur(5px)}
 #zoomBar input{width:110px;accent-color:#0ff}
 #proBar{position:fixed;bottom:12px;left:8px;right:8px;display:flex;gap:6px;z-index:1000;flex-wrap:wrap}
 #proBar button{flex:1;padding:13px 4px;border:none;border-radius:10px;font-weight:bold;font-size:11px;min-width:55px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.5)}
 #status{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);z-index:1000;background:rgba(0,0,0,0.7);color:#0ff;padding:6px 14px;border-radius:20px;font-size:11px}
</style>
</head>
<body>

<video id="godVideo" autoplay playsinline muted></video>

<div id="topBar">
  <span>🔭 WanaLab God Eye PRO v1.2</span>
  <span id="resInfo">1920x1080</span>
</div>

<div id="zoomBar">
  <div style="text-align:center;font-size:10px;margin-bottom:5px">ZOOM <span id="zoomVal">1.0x</span></div>
  <input type="range" id="zoomSlider" min="1" max="10" value="1" step="0.1">
</div>

<div id="status">📡 Initializing Fusion Camera...</div>

<div id="proBar">
  <button onclick="nightGod()" id="nightBtn" style="background:#ffaa00;color:#000">🌙 NIGHT</button>
  <button onclick="toggleTorch()" id="torchBtn" style="background:#ffff00;color:#000">🔦 TORCH</button>
  <button onclick="thermalMode()" id="thermalBtn" style="background:#ff0044;color:#fff">🔥 THERMAL</button>
  <button onclick="aiDetect()" style="background:#00ff88;color:#000">🤖 AI</button>
  <button onclick="capturePhoto()" style="background:#00e5ff;color:#000">📸 CAPTURE</button>
</div>

<script>
let stream=null, track=null, isNight=false, isThermal=false, isTorch=false, zoomCaps=null;

const video=document.getElementById('godVideo');
const statusEl=document.getElementById('status');
const zoomSlider=document.getElementById('zoomSlider');
const zoomValEl=document.getElementById('zoomVal');

async function initCamera(){
  statusEl.innerText='📡 Requesting Camera...';
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}},
      audio:false
    });
    video.srcObject=stream;
    track=stream.getVideoTracks()[0];
    const caps=track.getCapabilities();
    const settings=track.getSettings();
    
    if(caps.zoom){
      zoomCaps=caps.zoom;
      zoomSlider.min=caps.zoom.min;
      zoomSlider.max=Math.min(caps.zoom.max,10);
      zoomSlider.step=caps.zoom.step||0.1;
    }
    if(!caps.torch){
      document.getElementById('torchBtn').innerHTML='🔦 NO TORCH';
      document.getElementById('torchBtn').style.opacity='0.6';
    }
    
    await video.play();
    document.getElementById('resInfo').innerText=`${settings.width}x${settings.height}`;
    statusEl.innerText='✅ LIVE - Tap NIGHT + TORCH in dark';
    setTimeout(()=>statusEl.style.display='none',3000);
    
  }catch(e){
    statusEl.innerText='❌ '+e.message;
    statusEl.style.color='#f44';
    alert('Camera Error: '+e.message+'\n\nTap address bar -> Site Settings -> Camera Allow');
  }
}

function updateFilter(){
  let f='';
  if(isNight) f+='brightness(1.9) contrast(1.25) ';
  if(isThermal) f+='sepia(1) hue-rotate(-30deg) saturate(3) contrast(1.5) brightness(1.3) ';
  video.style.filter=f.trim()||'none';
}

function nightGod(){
  isNight=!isNight;
  document.getElementById('nightBtn').style.background=isNight?'#fff':'#ffaa00';
  document.getElementById('nightBtn').innerHTML=isNight?'🌙 ON':'🌙 NIGHT';
  updateFilter();
}

function thermalMode(){
  isThermal=!isThermal;
  document.getElementById('thermalBtn').style.background=isThermal?'#fff':'#ff0044';
  document.getElementById('thermalBtn').style.color=isThermal?'#ff0044':'#fff';
  updateFilter();
}

async function toggleTorch(){
  if(!track){ alert('Camera not ready'); return; }
  try{
    isTorch=!isTorch;
    await track.applyConstraints({advanced:[{torch:isTorch}]});
    const btn=document.getElementById('torchBtn');
    btn.innerHTML=isTorch?'🔦 OFF':'🔦 TORCH';
    btn.style.background=isTorch?'#ffffff':'#ffff00';
  }catch(e){
    alert('Torch not supported on this lens. Switch to back camera. '+e.message);
  }
}

function capturePhoto(){
  const c=document.createElement('canvas');
  c.width=video.videoWidth; c.height=video.videoHeight;
  const ctx=c.getContext('2d');
  ctx.filter=video.style.filter||'none';
  ctx.drawImage(video,0,0);
  const a=document.createElement('a');
  a.download='WanaLab-GodEye-'+Date.now()+'.png';
  a.href=c.toDataURL('image/png');
  a.click();
  statusEl.style.display='block';
  statusEl.innerText='📸 Captured!';
  setTimeout(()=>statusEl.style.display='none',2000);
}

function aiDetect(){
  statusEl.style.display='block';
  statusEl.innerText='🤖 AI Scanning... (TFJS v1.3)';
  setTimeout(()=>{statusEl.innerText='✅ AI: No motion - Dark room';},1500);
}

zoomSlider.addEventListener('input', async (e)=>{
  const z=parseFloat(e.target.value);
  zoomValEl.innerText=z.toFixed(1)+'x';
  if(track && zoomCaps){
    try{ await track.applyConstraints({advanced:[{zoom:z}]}); }
    catch(err){ video.style.transform=`scale(${z})`; }
  } else {
    video.style.transform=`scale(${z})`;
    video.style.transformOrigin='center center';
  }
});

window.addEventListener('load', initCamera);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && (!stream || !stream.active)) initCamera(); });
</script>

</body>
</html>
