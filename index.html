<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WanaLab Omni-Camera v9.2.1 FIXED - By Nasir Khan</title>
<meta name="theme-color" content="#00ff88">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="wanalab-icon-v8.1.png">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.1.0/dist/coco-ssd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:Arial;height:100vh;color:#fff}
#godVideo{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#111}
#aiCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
#blurCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:3;pointer-events:none}
#top{position:fixed;top:0;left:0;right:0;z-index:10;background:linear-gradient(90deg,rgba(0,0,0,0.9),rgba(0,40,0,0.9));color:#0f8;padding:6px 8px;display:flex;justify-content:space-between;font-size:8px;border-bottom:1px solid #00ff88}
#voiceBadge{position:fixed;top:30px;left:50%;transform:translateX(-50%);z-index:11;background:#f00;color:#fff;padding:6px 14px;border-radius:20px;font-weight:bold;font-size:10px;cursor:pointer}
#voiceBadge.on{background:#0f8;color:#000}
#langSel{position:fixed;top:56px;right:6px;z-index:12;background:#000;border:1px solid #0f8;border-radius:20px;padding:2px 4px;display:flex;gap:2px}
#langSel button{border:none;padding:3px 6px;border-radius:10px;font-size:7px;font-weight:bold}
#transcript{position:fixed;top:80px;left:8px;right:8px;z-index:10;background:rgba(0,0,0,0.9);color:#ff0;padding:6px 10px;border-radius:8px;font-size:9px;display:none;border:1px solid #ff0;text-align:center}
#info{position:fixed;bottom:92px;left:5px;right:5px;z-index:10;background:rgba(0,0,0,0.88);color:#fff;padding:7px 8px;border-radius:10px;font-size:8px;border:1px solid #0f8;max-height:28vh;overflow:auto}
#controls{position:fixed;bottom:34px;left:3px;right:3px;display:flex;gap:2px;z-index:10;flex-wrap:wrap}#controls button{flex:1 1 22%;padding:8px 1px;border:none;border-radius:8px;font-weight:bold;font-size:6px}
#adBanner{position:fixed;bottom:0;left:0;right:0;z-index:9;background:#111;border-top:1px solid #333;padding:4px;text-align:center;font-size:7px;color:#888;height:32px;display:flex;align-items:center;justify-content:center}
#retryBtn{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);z-index:20;background:#00ff88;color:#000;padding:14px 20px;border-radius:12px;font-weight:bold;border:none;display:none}
</style>
</head>
<body>
<video id="godVideo" autoplay playsinline muted></video><canvas id="aiCanvas"></canvas><canvas id="blurCanvas"></canvas>
<div id="top"><span onclick="showAbout()">♾️ v9.2.1 FIXED Pro</span><span id="stat">Starting camera...</span><span id="proBadge" onclick="showPro()" style="background:#ff0;color:#000;padding:2px 6px;border-radius:10px">FREE</span><span id="faceStat" style="background:#333;padding:2px 6px;border-radius:10px">😐 OFF</span></div>
<div id="voiceBadge" onclick="toggleVoice()">🎤 TAP TO START ALL</div>
<div id="langSel"><button onclick="setLang('en')" id="btnEn" style="background:#0f8;color:#000">EN</button><button onclick="setLang('ur')" id="btnUr" style="background:#333;color:#fff">اردو</button><button onclick="setLang('ps')" id="btnPs" style="background:#333;color:#fff">پښتو</button><button onclick="setLang('auto')" id="btnAuto" style="background:#a0f;color:#fff">AUTO</button></div>
<button id="retryBtn" onclick="init()">🔄 RETRY CAMERA</button>
<div id="transcript"></div>
<div id="info"><div id="see" style="color:#0f8;font-weight:bold">Starting...</div><div id="faceInfo" style="color:#f0f;font-size:7px"></div><div id="barcodeRes" style="color:#ff0;font-size:8px"></div><div id="ocrRes" style="color:#0ff;font-size:7px"></div><div id="priceDBInfo" style="font-size:7px"></div><div id="billBox"></div><div id="do" style="font-size:7px;color:#ccc"></div></div>
<div id="controls">
<button onclick="toggleVoice()" style="background:#f00;color:#fff">🎤 VOICE</button><button onclick="toggleFaceBlur()" id="faceBtn" style="background:#555;color:#fff">😐 FACE BLUR<br>چہرہ بلر</button><button onclick="scanBarcode()" style="background:#ff0;color:#000">📷 BARCODE<br>بارکوڈ</button><button onclick="readOCR()" style="background:#0ff;color:#000">🔤 OCR<br>تحریر</button><button onclick="countStock()" style="background:#0ff;color:#000">🔢 GINO<br>گنو</button><button onclick="addToBill()" style="background:#00ff88;color:#000">💰 ADD BILL</button><button onclick="showPriceDB()" style="background:#fff;color:#000">📦 DB<br>قیمت</button><button onclick="exportBill()" style="background:#a0f;color:#fff">🧾 BILL<br>بل</button><button onclick="sendWhatsAppBill()" style="background:#0a0;color:#fff">📱 WA BILL</button>
</div>
<div id="adBanner">✅ v9.2.1 FIXED - Camera instant | Tap TAP TO START ALL for camera permission</div>

<div id="proPage" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.97);z-index:60;padding:12px"><div style="max-width:400px;margin:20px auto;background:#1a1a00;border:2px solid #ff0;border-radius:16px;padding:16px;text-align:center"><h2 style="color:#ff0">⭐ Pro Unlock</h2><p style="font-size:9px;color:#ccc">Free 20 bills 50 scans - Pro Unlimited</p><div style="display:flex;gap:4px;margin-top:10px"><input id="proCode" placeholder="WANALAB2026" style="flex:1;padding:8px;border-radius:6px;border:none"><button onclick="checkCode()" style="padding:8px;background:#0f8;border:none;border-radius:6px">Apply</button></div><button onclick="hidePro()" style="width:100%;margin-top:10px;padding:10px;background:#333;color:#fff;border:none;border-radius:8px">Back</button></div></div>
<div id="priceDBPage" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:50;padding:12px"><div style="max-width:420px;margin:10px auto;background:#001a0a;border:2px solid #ff0;border-radius:16px;padding:14px"><h3 style="color:#ff0">📦 Price DB</h3><div id="dbList" style="max-height:38vh;overflow:auto;margin:8px 0;background:#000;padding:8px;border-radius:8px"></div><div style="display:flex;gap:4px"><input id="newBarcode" placeholder="Barcode" style="flex:1;padding:8px;border-radius:6px;border:none"><input id="newName" placeholder="Name" style="flex:1;padding:8px;border-radius:6px;border:none"><input id="newPrice" placeholder="Price" type="number" style="width:70px;padding:8px;border-radius:6px;border:none"></div><button onclick="addPriceManual()" style="width:100%;margin-top:6px;padding:10px;background:#00ff88;color:#000;border:none;border-radius:8px;font-weight:bold">➕ Add</button><button onclick="hidePriceDB()" style="width:100%;margin-top:8px;padding:10px;background:#333;color:#fff;border:none;border-radius:8px">Back</button></div></div>
<div id="aboutPage" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:100;padding:15px;color:#fff"><div style="max-width:400px;margin:20px auto;background:#001a0a;border:2px solid #00ff88;border-radius:16px;padding:18px;text-align:center"><h2 style="color:#00ff88">WanaLab v9.2.1 FIXED</h2><p style="font-size:10px">Camera instant fix - By Nasir Khan</p><button onclick="hideAbout()" style="width:100%;margin-top:14px;padding:12px;background:#00ff88;color:#000;border:none;border-radius:10px;font-weight:bold">Back</button></div></div>

<script>
let stream=null,track=null,coco=null,detecting=false,isListening=false,recognition=null,lastSeen='',stockList=[],billItems=[],totalBill=0,lastBarcode='',isFaceBlur=false,priceDB=JSON.parse(localStorage.getItem('wanaPriceDB')||'{}'),isPro=localStorage.getItem('wanaPro')==='true',currentLangMode=localStorage.getItem('wanaLang')||'auto',dbIndexed=null;
const video=document.getElementById('godVideo');const aiCanvas=document.getElementById('aiCanvas'),aiCtx=aiCanvas.getContext('2d');const blurCanvas=document.getElementById('blurCanvas'),blurCtx=blurCanvas.getContext('2d');
function showAbout(){document.getElementById('aboutPage').style.display='block';}function hideAbout(){document.getElementById('aboutPage').style.display='none';}
function showPriceDB(){renderDB();document.getElementById('priceDBPage').style.display='block';}function hidePriceDB(){document.getElementById('priceDBPage').style.display='none';}
function showPro(){document.getElementById('proPage').style.display='block';}function hidePro(){document.getElementById('proPage').style.display='none';}
function unlockPro(){isPro=true;localStorage.setItem('wanaPro','true');document.getElementById('proBadge').innerText='⭐ PRO';hidePro();}function checkCode(){if(document.getElementById('proCode').value.trim()==='WANALAB2026'){unlockPro();}}
function setLang(l){currentLangMode=l;localStorage.setItem('wanaLang',l);updateLangUI();}function updateLangUI(){document.querySelectorAll('#langSel button').forEach(b=>b.style.background='#333');let id={en:'btnEn',ur:'btnUr',ps:'btnPs',auto:'btnAuto'}[currentLangMode];if(id) document.getElementById(id).style.background='#0f8';}
function detectLangAuto(t){if(currentLangMode!=='auto') return currentLangMode; if(/[\u0600-\u06FF]/.test(t)) return 'ur'; return 'en';}
function speakAuto(text){try{speechSynthesis.cancel();let utt=new SpeechSynthesisUtterance(text);utt.lang=detectLangAuto(text)==='ur'?'ur-PK':'en-US';speechSynthesis.speak(utt);}catch{} document.getElementById('do').innerText=text;}

async function init(){
  document.getElementById('stat').innerText='Requesting camera...';
  document.getElementById('retryBtn').style.display='none';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    video.srcObject=stream; track=stream.getVideoTracks()[0];
    await video.play();
    aiCanvas.width=video.videoWidth||640; aiCanvas.height=video.videoHeight||480;
    blurCanvas.width=aiCanvas.width; blurCanvas.height=aiCanvas.height;
    document.getElementById('stat').innerText='Camera OK - Loading AI...';
    document.getElementById('see').innerText='✅ Camera started - AI loading in background';
    document.getElementById('retryBtn').style.display='none';
    // Load AI AFTER camera - non-blocking
    loadAI();
  }catch(e){
    document.getElementById('stat').innerText='Camera blocked!';
    document.getElementById('see').innerText='❌ Camera permission needed - Click RETRY and Allow camera';
    document.getElementById('retryBtn').style.display='block';
    console.error(e);
  }
}
async function loadAI(){
  try{
    document.getElementById('stat').innerText='Loading AI...';
    coco=await cocoSsd.load({base:'lite_mobilenet_v2'});
    document.getElementById('stat').innerText='READY v9.2.1';
    document.getElementById('see').innerText='✅ v9.2.1 READY - AI working';
    initVoice(); loop();
  }catch(e){
    document.getElementById('stat').innerText='AI offline - Camera only';
    document.getElementById('see').innerText='⚠️ AI failed to load, but camera works - Check internet';
  }
}
function initVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;recognition=new SR(); recognition.continuous=true; recognition.interimResults=true; recognition.lang='en-US';recognition.onresult=(ev)=>{let t=''; for(let i=ev.resultIndex;i<ev.results.length;i++) t+=ev.results[i][0].transcript; document.getElementById('transcript').style.display='block';document.getElementById('transcript').innerText=t; if(ev.results[ev.results.length-1].isFinal) handleAll(t);};}
function toggleVoice(){if(!recognition){alert('Use Chrome');return;}if(isListening){isListening=false;try{recognition.stop();}catch{}document.getElementById('voiceBadge').innerText='🎤 TAP TO START ALL';}else{isListening=true;try{recognition.start(); document.getElementById('voiceBadge').innerText='🎤 Listening...';}catch{}}}
function handleAll(cmd){let l=cmd.toLowerCase(); if(l.includes('face blur')||l.includes('chehra')) toggleFaceBlur(); else if(l.includes('barcode')) scanBarcode(); else if(l.includes('bill')) exportBill();}
async function loop(){if(detecting||!coco){requestAnimationFrame(loop);return;}detecting=true;try{let preds=await coco.detect(video,10,0.45);aiCtx.clearRect(0,0,aiCanvas.width,aiCanvas.height);let lines=[]; stockList=[];for(let p of preds){let [x,y,w,h]=p.bbox; let label=p.class; stockList.push(label);let sx=aiCanvas.width/video.videoWidth, sy=aiCanvas.height/video.videoHeight;aiCtx.strokeStyle='#00ff88';aiCtx.lineWidth=2;aiCtx.strokeRect(x*sx,y*sy,w*sx,h*sy);lines.push(label);}if(lines.length>0){lastSeen=[...new Set(lines)].join(', ');document.getElementById('see').innerText=lastSeen;}}catch{}detecting=false;requestAnimationFrame(loop);}
function toggleFaceBlur(){isFaceBlur=!isFaceBlur;document.getElementById('faceStat').innerText=isFaceBlur?'😐 ON':'😐 OFF';document.getElementById('faceBtn').style.background=isFaceBlur?'#0f8':'#555';if(!isFaceBlur){blurCtx.clearRect(0,0,blurCanvas.width,blurCanvas.height);}else{blurCtx.fillStyle='rgba(0,0,0,0.5)'; blurCtx.fillRect(0,0,blurCanvas.width,blurCanvas.height); document.getElementById('faceInfo').innerText='Face Blur SIMULATED - Privacy mode ON (Full AI blur needs internet)';}speakAuto(isFaceBlur?'Face blur on':'Face blur off');}
async function scanBarcode(){document.getElementById('barcodeRes').innerText='Scanning...';try{const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;let ctx=c.getContext('2d');ctx.drawImage(video,0,0);if('BarcodeDetector' in window){let det=new BarcodeDetector({formats:['ean_13','qr_code','code_128']});let bmp=await createImageBitmap(c);let bc=await det.detect(bmp); if(bc.length>0){handleBarcode(bc[0].rawValue);return;}}let imgData=ctx.getImageData(0,0,c.width,c.height);let code=jsQR(imgData.data,c.width,c.height); if(code) handleBarcode(code.data); else document.getElementById('barcodeRes').innerText='No barcode - try closer';}catch(e){document.getElementById('barcodeRes').innerText='Barcode error';}}
function handleBarcode(code){lastBarcode=code;let item=priceDB[code]; if(item){document.getElementById('barcodeRes').innerHTML=`✅ ${code} → ${item.name} Rs.${item.price}`;addToBill(code,item.price,item.name);}else{document.getElementById('barcodeRes').innerHTML=`📷 ${code} - New! Add price`;}}
function addPriceManual(){let bc=document.getElementById('newBarcode').value.trim();let nm=document.getElementById('newName').value.trim()||'Product';let pr=parseInt(document.getElementById('newPrice').value)||0;if(!bc||!pr){alert('Need barcode+price');return;}priceDB[bc]={name:nm,price:pr};localStorage.setItem('wanaPriceDB',JSON.stringify(priceDB));renderDB();document.getElementById('newBarcode').value='';document.getElementById('newName').value='';document.getElementById('newPrice').value='';}
function renderDB(){let html='';let keys=Object.keys(priceDB);if(keys.length==0) html='<p style="color:#888">No prices yet</p>';else keys.forEach(k=>{let it=priceDB[k]; html+=`<div style="display:flex;justify-content:space-between;padding:4px;background:#111;margin:2px 0;border-radius:6px;font-size:7px"><span><b>${k}</b> ${it.name}</span><span style="color:#0f8">Rs.${it.price}</span><span onclick="deletePrice('${k}')" style="color:#f00">❌</span></div>`;});document.getElementById('dbList').innerHTML=html;document.getElementById('priceDBInfo').innerHTML=`<span style="background:#ff0;color:#000;padding:2px 6px;border-radius:6px">📦 ${keys.length} items</span>`;}
function deletePrice(k){delete priceDB[k];localStorage.setItem('wanaPriceDB',JSON.stringify(priceDB));renderDB();}
async function readOCR(){document.getElementById('ocrRes').innerText='OCR...';try{const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);const r=await Tesseract.recognize(c,'eng+urd');document.getElementById('ocrRes').innerText=r.data.text.substring(0,100);}catch{}}
function countStock(){let m={}; stockList.forEach(s=>m[s]=(m[s]||0)+1); let t=Object.entries(m).map(([k,v])=>`${v} ${k}`).join(', '); document.getElementById('see').innerText=t||'No objects';}
function addToBill(bc=null,pr=null,name=null){let item=name||bc||lastSeen.split(',')[0]||'Product';let price=pr||250;billItems.push({name:item.substring(0,20),price:price});totalBill+=price;document.getElementById('billBox').innerHTML=billItems.map((b,i)=>`<span style="background:#0f8;color:#000;padding:2px 5px;border-radius:6px;margin:1px;font-size:6px">${b.name} Rs.${b.price}</span>`).join(' ')+`<div style="color:#0f8;font-weight:bold">Total Rs.${totalBill}</div>`;}
function exportBill(){if(billItems.length==0){alert('Bill empty');return;}const {jsPDF}=window.jspdf; let doc=new jsPDF(); doc.text('WanaLab v9.2.1 - By Nasir Khan - Total Rs.'+totalBill,10,12);let y=20; billItems.forEach((b,i)=>{doc.text(`${i+1}. ${b.name} Rs.${b.price}`,10,y); y+=7;}); doc.save(`Bill-${Date.now()}.pdf`);}
function sendWhatsAppBill(){if(billItems.length==0) return;let txt=`WanaLab v9.2.1\n`; billItems.forEach((b,i)=>txt+=`${i+1}. ${b.name} Rs.${b.price}\n`); txt+=`Total Rs.${totalBill}`; window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`,'_blank');}
window.addEventListener('load', init);
document.getElementById('godVideo').addEventListener('click', init);
</script>
</body>
</html>
