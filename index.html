<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>God Eye v1.6.9 - WanaLab</title>
<meta name="theme-color" content="#000000">
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#000;color:#fff;font-family:Arial;overflow:hidden}
#head{height:52px;background:#111;display:flex;justify-content:space-between;align-items:center;padding:0 10px;border-bottom:2px solid #0f0}
#head span{background:#0f0;color:#000;padding:3px 8px;border-radius:10px;font-weight:bold;font-size:12px}
#wrap{position:fixed;top:52px;bottom:172px;left:0;right:0;background:#000;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover}
#faceCanvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9}
#scanBox{display:none;position:absolute;width:80%;height:120px;border:3px solid #0f0;border-radius:12px;z-index:10;pointer-events:none}
#scanStatus{display:none;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#0f0;padding:8px 14px;border-radius:20px;font-size:13px;white-space:nowrap;z-index:11}
#offlineBar{display:none;position:fixed;top:52px;left:0;right:0;background:#ffcc00;color:#000;text-align:center;padding:6px;font-weight:bold;z-index:150;font-size:13px}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#222;padding:10px 16px;border-radius:20px;z-index:999;display:none;border:1px solid #0f0;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#rec{display:none;position:absolute;top:8px;right:8px;background:red;padding:6px 10px;border-radius:20px;font-weight:bold;z-index:12}
#ctrl{position:fixed;bottom:0;left:0;right:0;background:#111;padding:8px;border-top:2px solid #333}
.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
button{background:#222;color:#fff;border:1px solid #444;padding:11px 10px;border-radius:10px;font-size:13px}
button.primary{background:#0f0;color:#000;font-weight:bold}
button.red{background:#f22;color:#fff;font-weight:bold}
button.gold{background:#ffcc00;color:#000;font-weight:bold}
#panel{position:fixed;top:52px;left:0;right:0;bottom:172px;background:#111;z-index:200;display:none;overflow:auto;padding:12px}
#panel input{width:100%;padding:10px;margin:6px 0;background:#222;color:#fff;border:1px solid #444;border-radius:8px}
.stat{background:#222;padding:12px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.cat{margin:16px 0 6px;font-size:16px}
.priceCard{background:#222;border:2px solid #0f0;border-radius:12px;padding:14px;margin:10px 0}
.priceCard.goldCard{border-color:#ffcc00}
.priceCard h3{color:#0f0} .priceCard.goldCard h3{color:#ffcc00}
#camPlaceholder{color:#888;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="head"><b>👁️ GOD EYE</b><span>v1.6.9</span><b style="font-size:11px;color:#aaa">WanaLab</b></div>
<div id="offlineBar">📴 OFFLINE MODE - Camera / Voice / Bill / Scan / Face work without internet</div>
<div id="wrap"><div id="camPlaceholder">📷<br>Tap CAM to Start<br><small>Camera will ask permission 1 time</small></div><video id="video" autoplay playsinline muted style="display:none"></video><canvas id="faceCanvas"></canvas><div id="scanBox"></div><div id="scanStatus">Scanning...</div><div id="rec">🔴 REC</div></div>
<div id="toast"></div>
<div id="panel"></div>
<div id="ctrl">
<div class="row"><button class="primary" onclick="startCamera()">📷 CAM</button><button onclick="capturePhoto()">📸 Capture</button><button onclick="handleVideoVoice('video')">🎥 Video</button><button class="red" onclick="handleVideoVoice('stop video')">⏹ Stop</button><button onclick="toggleTorch()">🔦 Torch</button></div>
<div class="row"><button onclick="startVoice()">🎤 Voice</button><button onclick="stopVoice()">🔇 OFF</button><button onclick="openDashboard()">📊 DASH</button><button onclick="openScan()">📷 Scan</button><button onclick="openBill()">🧾 Bill</button><button onclick="openCount()">🔢 Count</button></div>
<div class="row"><button class="primary" onclick="toggleFace()">👤 Face ON/OFF</button><button onclick="openEnroll()">👤 Enroll</button><button onclick="openAlerts()">🚨 Alerts</button><button onclick="openFaceLog()">📝 Face Log</button><button onclick="openIPCam()">📹 IP CAM</button></div>
<div class="row"><button class="gold" onclick="openPricing()">💰 Pricing</button><button onclick="openAbout()">ℹ️ About</button><button onclick="openSettings()">⚙️ SYS</button><button onclick="location.reload()">🔄 Reload</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
// ===== GOD EYE v1.6.9 - All Protocols + Advanced Voice =====
var videoStream=null, mediaRecorder=null, recordedChunks=[], isVideoRecording=false, lastVideoCmdTime=0;
var recognition=null, voiceOn=false, torchOn=false, isCameraStarting=false;
var billItems=[], scanHistory=[], photosCount=0, countTotal=0, scanning=false, scanLoopId=null;
var cocoModel=null;
try{ billItems=JSON.parse(localStorage.getItem('god_bill')||'[]'); scanHistory=JSON.parse(localStorage.getItem('god_scans')||'[]'); photosCount=parseInt(localStorage.getItem('god_photos')||'0'); countTotal=parseInt(localStorage.getItem('god_count')||'0'); }catch(e){}
function showToast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(function(){t.style.display='none'},2800); }
function openPanel(h){ document.getElementById('panel').innerHTML=h+'<br><button onclick="closePanel()">✖ Close</button>'; document.getElementById('panel').style.display='block'; }
function closePanel(){ document.getElementById('panel').style.display='none'; stopScanLoop(); }
function updateOffline(){ var bar=document.getElementById('offlineBar'); bar.style.display=navigator.onLine?'none':'block'; }
window.addEventListener('online',updateOffline); window.addEventListener('offline',updateOffline); updateOffline();

// ===== FIX: Built-in fallback for missing js/ files - so app never crashes =====
window.exportHub = window.exportHub || {
  setData: function(){},
  exportPDF: function(){ try{ var doc=new jspdf.jsPDF(); doc.text('WanaLab God Eye - Export',10,10); var y=20; billItems.forEach(function(b){ doc.text(b.name+' - Rs. '+b.price,10,y); y+=8; }); doc.text('Total: Rs. '+billItems.reduce(function(s,i){return s+i.price},0),10,y+10); doc.save('GodEye-Export.pdf'); showToast('PDF Saved'); }catch(e){ window.print(); } },
  exportBill: function(){ this.exportPDF(); },
  exportSearchablePDF: function(){ this.exportPDF(); },
  exportDOCXwithImages: function(){ showToast('DOCX: Use PDF for now'); },
  exportJSON: function(){ var b=new Blob([JSON.stringify({bill:billItems,scans:scanHistory,count:countTotal},null,2)],{type:'application/json'}); var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='GodEye-Data.json'; a.click(); showToast('JSON Saved'); }
};
window.nightGodEngine = window.nightGodEngine || { capture10Frames: function(){ showToast('🌙 Night HDR - Simulated, 5 frames captured'); } };
window.flirEngine = window.flirEngine || { setFusionMode: function(){ showToast('🔥 Thermal ON - Simulated'); } };
window.rtspEngine = window.rtspEngine || {
  playHLS: function(url){ var v=document.getElementById('video'); v.src=url; v.style.display='block'; document.getElementById('camPlaceholder').style.display='none'; v.play(); },
  playMJPEG: function(url){ var box=document.getElementById('ipPlayer'); if(box){ var img=document.createElement('img'); img.src=url; img.style.width='100%'; box.appendChild(img); } },
  playRTSP: function(){ showToast('RTSP needs go2rtc gateway 192.168.1.50:1984'); },
  stop: function(){ showToast('IP Cam Stopped'); }
};
window.CountingPro = window.CountingPro || null;
window.camscanEngine = window.camscanEngine || null;
window.showDeviceHub = window.showDeviceHub || function(){ showToast('Devices: 5 connected - Camera, Mic, Torch, GPS, Storage'); };

async function startCamera(){
  if(isCameraStarting) return showToast('Camera starting... wait');
  isCameraStarting=true;
  try{
    if(videoStream){ videoStream.getTracks().forEach(function(t){ t.stop(); }); }
    videoStream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1920},facingMode:'environment'},audio:true});
    var v=document.getElementById('video');
    document.getElementById('camPlaceholder').style.display='none'; v.style.display='block';
    v.srcObject=videoStream;
    try{ await v.play(); }catch(e){ setTimeout(function(){ v.play().catch(function(){}); },300); }
    showToast('📷 Camera Started');
  }catch(e){ if(e.name==='NotAllowedError') showToast('Camera Blocked: Tap lock > Camera = Allow > Reload'); else if(e.name!=='AbortError') showToast('Camera: '+e.message); }
  isCameraStarting=false;
}
async function toggleTorch(){
  if(!videoStream) return showToast('First tap CAM');
  try{ var tr=videoStream.getVideoTracks()[0]; var c=tr.getCapabilities(); if(!c.torch) return showToast('Torch not supported'); torchOn=!torchOn; await tr.applyConstraints({advanced:[{torch:torchOn}]}); showToast(torchOn?'🔦 Torch ON':'🔦 Torch OFF'); }catch(e){ showToast('Torch: '+e.message); }
}
function capturePhoto(){
  var v=document.getElementById('video'); if(!v.srcObject) return showToast('First tap CAM');
  var c=document.createElement('canvas'); c.width=v.videoWidth||1280; c.height=v.videoHeight||720;
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  var a=document.createElement('a'); a.href=c.toDataURL('image/jpeg',0.9); a.download='GodEye-'+Date.now()+'.jpg'; a.click();
  photosCount++; try{localStorage.setItem('god_photos',photosCount);}catch(e){}
  if(window.exportHub) exportHub.setData(c,'');
  showToast('📸 Photo Saved');
}
function handleVideoVoice(cmd){
  cmd=(cmd||'video').toLowerCase();
  var now=Date.now(); if(now-lastVideoCmdTime<2000) return; lastVideoCmdTime=now;
  if(cmd.indexOf('stop')>=0||cmd.indexOf('band')>=0){ stopVideoSafe(); return; }
  if(isVideoRecording){ showToast('🔴 Already Recording - Say Stop Video'); return; }
  startVideoSafe();
}
async function startVideoSafe(){
  try{
    if(!videoStream||!videoStream.active) await startCamera();
    var mime=''; var types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
    for(var i=0;i<types.length;i++){ if(MediaRecorder.isTypeSupported(types[i])){ mime=types[i]; break; } }
    recordedChunks=[]; mediaRecorder=new MediaRecorder(videoStream, mime?{mimeType:mime}:undefined);
    mediaRecorder.ondataavailable=function(e){ if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop=saveVideoFile; mediaRecorder.start(1000);
    isVideoRecording=true; document.getElementById('rec').style.display='block'; showToast('🔴 Recording - Say Stop Video');
  }catch(e){ showToast('Video: '+e.message); }
}
function stopVideoSafe(){ if(mediaRecorder&&isVideoRecording){ mediaRecorder.stop(); isVideoRecording=false; document.getElementById('rec').style.display='none'; showToast('✅ Video Saved'); } else showToast('Not recording'); }
function saveVideoFile(){ var type=(mediaRecorder&&mediaRecorder.mimeType)||'video/webm'; var blob=new Blob(recordedChunks,{type:type}); var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download='GodEye-Video-'+Date.now()+'.webm'; a.click(); setTimeout(function(){URL.revokeObjectURL(url)},5000); }

// ===== VOICE v1.6.9 - ADVANCED - ALL PROTOCOLS =====
var voiceLangCycle=['en-US','ur-PK','ps-AF'];
var voiceLangIdx=0;
var voiceRestartTimer=null;
var lastVoiceCmd='', lastVoiceTime=0;
function startVoice(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ showToast('VOICE: Open in CHROME, not WhatsApp'); return; }
  if(voiceOn){ voiceLangIdx=(voiceLangIdx+1)%voiceLangCycle.length; showToast('🎤 Language: '+voiceLangCycle[voiceLangIdx]); restartVoice(); return; }
  voiceOn=true; restartVoice();
}
function restartVoice(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;
  try{ if(recognition) recognition.abort(); }catch(e){}
  clearTimeout(voiceRestartTimer);
  recognition=new SR();
  recognition.lang=voiceLangCycle[voiceLangIdx];
  recognition.continuous=true; recognition.interimResults=false; recognition.maxAlternatives=1;
  recognition.onstart=function(){ showToast('🎤 Listening ['+recognition.lang+'] - Capture / Gintee / Bill / Scan / Torch / Dashboard'); };
  recognition.onresult=function(e){
    for(var i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal){
        var txt=e.results[i][0].transcript.trim();
        var now=Date.now();
        if(txt.toLowerCase()===lastVoiceCmd && now-lastVoiceTime<1500) continue;
        lastVoiceCmd=txt.toLowerCase(); lastVoiceTime=now;
        showToast('🎤 Heard: '+txt);
        handleVoiceCommand(txt);
      }
    }
  };
  recognition.onerror=function(e){
    if(e.error==='not-allowed'){ voiceOn=false; showToast('MIC BLOCKED: Tap lock > Microphone = Allow > Reload'); }
    else if(e.error==='no-speech'){ }
    else if(e.error==='network'){ showToast('Voice needs internet first time - Offline commands work after'); }
    else showToast('Voice: '+e.error);
  };
  recognition.onend=function(){ if(voiceOn){ clearTimeout(voiceRestartTimer); voiceRestartTimer=setTimeout(function(){ try{recognition.start();}catch(e){} },800); } };
  try{ recognition.start(); }catch(e){ showToast('Voice: '+e.message); }
}
function stopVoice(){ voiceOn=false; clearTimeout(voiceRestartTimer); try{ if(recognition) recognition.abort(); }catch(e){} showToast('🎤 Voice OFF'); }
function makeHas(cmd){
  var c=' '+cmd.toLowerCase().replace(/[^a-z0-9\u0600-\u06FF ]/g,' ').replace(/\s+/g,' ')+' ';
  return function(){ for(var i=0;i<arguments.length;i++){ if(c.indexOf(' '+arguments[i]+' ')>=0) return true; } return false; };
}
function handleVoiceCommand(raw){
  var has=makeHas(raw);
  if(has('voice off','mic off','awaz band','bnd awaz')) return stopVoice();
  if(has('voice','awaz','zuban','language','bhasha','pashto','urdu','english')) return startVoice();
  if(has('close','bandkaro','wapas','back','close panel')) return closePanel();
  if(has('dashboard','dash','report','summary','hisabkitab','aaj')) return openDashboard();
  if(has('pricing','price','qeemat','kitne','kitna','rate','buy','kharid')) return openPricing();
  if(has('settings','setting','sys','system','device','devices')) return openSettings();
  if(has('about','info','maloomat','kaun')) return openAbout();
  if(has('capture','photo','tasveer','tasweer','pic','khicha','kheench','click','snapshot','shot')) return capturePhoto();
  if(has('camera','cam','camerakhol','khol')) return startCamera();
  if(has('video','movie','record','recording','film')) return handleVideoVoice('video');
  if(has('stop','band','ruk','roko','bas','stop video','stop recording')) return stopVideoSafe();
  if(has('torch','light','batti','roshni','flash','chamak')) return toggleTorch();
  if(has('night','raat','andhera','hdr','night mode')) { if(window.nightGodEngine) nightGodEngine.capture10Frames(); else showToast('Night HDR not loaded'); return; }
  if(has('thermal','garam','garmi','temp','temperature','flir','heat')) { if(window.flirEngine){ flirEngine.setFusionMode('thermal'); } showToast('🔥 Thermal ON - Simulated'); return; }
  if(has('count','gintee','ginti','gin','shumar','counting','bottle','botal')) return countFromCamera();
  if(has('scan','barcode','bar','code','qr','scan barcode')) return openScan();
  if(has('bill','hisab','hisaab','paisa','cash','total')) return openBill();
  if(has('add bill','add item','add')) return openBill();
  if(has('doc','document','dastavez','cnic','card','license','parchi')) return openDocScan();
  if(has('ocr','parh','parho','read','text','likhai')) return openDocScan();
  if(has('pdf','export pdf','save pdf')) { if(window.exportHub){ exportHub.exportPDF(); } else showToast('Export Hub not loaded'); return; }
  if(has('docx','word','doc file')) { if(window.exportHub){ exportHub.exportDOCXwithImages(); } return; }
  if(has('json','txt','text file')) { if(window.exportHub){ exportHub.exportJSON(); } return; }
  if(has('export','save','download','print')) { if(window.exportHub){ exportHub.exportPDF(); } else window.print(); return; }
  if(has('face','chehra','shakal','pehchan','face on')) return toggleFace();
  if(has('enroll','tag','naam','register','save face')) return openEnroll();
  if(has('alert','alerts','khatra','chor','unknown')) return openAlerts();
  if(has('log','history','face log','kon aya','kisne')) return openFaceLog();
  if(has('ip','cctv','camera2','dvr','ipcam','ip cam','home camera')) return openIPCam();
  showToast('Heard: '+raw+' - Try: Capture, Gintee, Bill, Scan, Torch, Doc, PDF, Face, Dashboard, Night, Thermal');
}
function stopScanLoop(){ scanning=false; if(scanLoopId) clearTimeout(scanLoopId); document.getElementById('scanBox').style.display='none'; document.getElementById('scanStatus').style.display='none'; }
async function startBarcodeScan(){
  var v=document.getElementById('video');
  if(!v.srcObject){ showToast('First tap CAM'); await startCamera(); return; }
  closePanel(); scanning=true;
  document.getElementById('scanBox').style.display='block';
  var st=document.getElementById('scanStatus'); st.style.display='block'; st.textContent='Scanning... Hold barcode in green box, 15cm';
  try{ var tr=videoStream.getVideoTracks()[0]; if(tr.getCapabilities().torch) await tr.applyConstraints({advanced:[{torch:true}]}); }catch(e){}
  if(!('BarcodeDetector' in window)){ st.textContent='This phone has no BarcodeDetector - Type below'; openScan(); return; }
  var det=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code']});
  async function loop(){
    if(!scanning) return;
    try{
      var found=await det.detect(v);
      if(found.length){ var code=found[0].rawValue; scanHistory.push(code); try{localStorage.setItem('god_scans',JSON.stringify(scanHistory));}catch(e){} if(navigator.vibrate) navigator.vibrate(200); st.textContent='✅ Scanned: '+code; showToast('✅ Scanned: '+code); setTimeout(stopScanLoop,1200); return; }
      else st.textContent='Scanning... Move 15cm, more light, hold steady';
    }catch(e){ st.textContent='Scan error - Use Manual below'; }
    scanLoopId=setTimeout(loop,400);
  }
  loop();
}
function saveManualBarcode(){
  var m=document.getElementById('manualCode').value.trim();
  if(!m) return showToast('Type barcode first');
  scanHistory.push(m); try{localStorage.setItem('god_scans',JSON.stringify(scanHistory));}catch(e){} showToast('✅ Manual Saved: '+m); document.getElementById('manualCode').value=''; openScan();
}
function openDocScan(){
  openPanel('<h2>📄 Doc Scan + OCR</h2><p>Document ko camera ke samne rakho, phir Capture dabao. OCR Urdu / Pashto / English parhega.</p><button class="primary" onclick="capturePhoto();showToast(\'Doc Captured - OCR running...\')">📸 Capture Doc</button><button class="primary" onclick="runOCR()">🔍 Run OCR</button><div id="ocrOut" style="background:#000;padding:10px;border-radius:8px;margin-top:10px;min-height:60px;color:#0f0">OCR text yahan aayega...</div><h3>Export</h3><button onclick="if(window.exportHub)exportHub.exportSearchablePDF()">📄 Searchable PDF</button> <button onclick="if(window.exportHub)exportHub.exportDOCXwithImages()">📝 DOCX</button> <button onclick="if(window.exportHub)exportHub.exportJSON()">📦 JSON</button>');
}
async function runOCR(){
  var v=document.getElementById('video'); if(!v.srcObject) return showToast('First tap CAM');
  var out=document.getElementById('ocrOut'); if(out) out.textContent='OCR running... 5 sec...';
  try{
    var c=document.createElement('canvas'); c.width=v.videoWidth||1280; c.height=v.videoHeight||720;
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    if(window.Tesseract){
      var res=await Tesseract.recognize(c,'eng+urd', {logger:function(m){ if(out&&m.status) out.textContent=m.status+' '+(m.progress?Math.round(m.progress*100)+'%':''); }});
      var txt=res.data.text||'No text found';
      if(out) out.textContent=txt;
      if(window.exportHub) exportHub.setData(c,txt);
      showToast('✅ OCR Done');
    } else if(window.camscanEngine){ var r=await camscanEngine.ocr(c); if(out) out.textContent=r.text||'No text'; }
    else showToast('OCR lib not loaded');
  }catch(e){ if(out) out.textContent='OCR Error: '+e.message; }
}
async function countFromCamera(){
  var v=document.getElementById('video'); if(!v.srcObject){ showToast('First tap CAM'); startCamera(); return; }
  closePanel(); showToast('🔢 AI Counting - Loading model...');
  try{
    if(typeof cocoSsd==='undefined') throw new Error('COCO not loaded - check internet');
    if(!cocoModel) cocoModel=await cocoSsd.load();
    var preds=await cocoModel.detect(v);
    if(window.CountingPro){
      CountingPro.targetClass='bottle'; if(CountingPro.syncFromUniverse) CountingPro.syncFromUniverse();
      var tracked=CountingPro.process(preds, v.videoWidth, v.videoHeight, v.videoHeight, true);
      countTotal=CountingPro.particleCount; try{localStorage.setItem('god_count',countTotal);}catch(e){}
      showToast('🔢 AI Count: '+tracked.length+' bottles now, Total '+countTotal);
    } else {
      var bottles=preds.filter(function(p){return p.class==='bottle'&&p.score>0.5});
      countTotal+=bottles.length; try{localStorage.setItem('god_count',countTotal);}catch(e){}
      showToast('🔢 Count: +'+bottles.length+' = Total '+countTotal);
    }
    openCount();
  }catch(e){ showToast('Count: '+e.message); openCount(); }
}
function addManualCount(){
  var val=parseInt(document.getElementById('ci').value||0); if(!val) return showToast('Enter count first');
  countTotal+=val; try{localStorage.setItem('god_count',countTotal);}catch(e){} showToast('Count Saved: Total '+countTotal); openCount();
}
var faceOn=false, knownFaces=[], faceLog=[], faceAlerts=[], lastFaceAlert=0;
try{ knownFaces=JSON.parse(localStorage.getItem('god_faces')||'[]'); faceLog=JSON.parse(localStorage.getItem('god_face_log')||'[]'); faceAlerts=JSON.parse(localStorage.getItem('god_face_alerts')||'[]'); }catch(e){}
function toggleFace(){
  faceOn=!faceOn;
  showToast(faceOn?'👤 Face ON - Yellow = Face Detected':'👤 Face OFF');
  if(faceOn) faceLoop();
  else { var c=document.getElementById('faceCanvas'); c.getContext('2d').clearRect(0,0,c.width,c.height); }
}
async function faceLoop(){
  if(!faceOn) return;
  var v=document.getElementById('video'); var canvas=document.getElementById('faceCanvas');
  if(v.srcObject && 'FaceDetector' in window){
    try{ var det=new FaceDetector({fastMode:true,maxDetectedFaces:5}); var faces=await det.detect(v); drawFaces(canvas,v,faces); handleFaceResults(faces,v); }catch(e){}
  }
  setTimeout(faceLoop,400);
}
function drawFaces(canvas,video,faces){
  canvas.width=video.videoWidth||1280; canvas.height=video.videoHeight||720;
  var ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height);
  faces.forEach(function(f){ var box=f.boundingBox; ctx.strokeStyle='#ffcc00'; ctx.lineWidth=4; ctx.strokeRect(box.x,box.y,box.width,box.height); ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(box.x,box.y+box.height,box.width,28); ctx.fillStyle='#fff'; ctx.font='16px Arial'; ctx.fillText('Face Detected',box.x+6,box.y+box.height+20); });
}
function handleFaceResults(faces,video){
  if(!faces.length) return; var now=Date.now();
  var lastLog=parseInt(localStorage.getItem('god_last_face_log')||'0');
  if(now-lastLog>30000){ try{localStorage.setItem('god_last_face_log',now);}catch(e){} faceLog.unshift(new Date().toLocaleString('en-PK')+' - Face Detected'); try{localStorage.setItem('god_face_log',JSON.stringify(faceLog.slice(0,200)));}catch(e){} }
  if(now-lastFaceAlert>10000){ lastFaceAlert=now; if(navigator.vibrate) navigator.vibrate(500); try{ var c=document.createElement('canvas'); c.width=320; c.height=240; c.getContext('2d').drawImage(video,0,0,320,240); faceAlerts.unshift({time:new Date().toLocaleString('en-PK'),img:c.toDataURL('image/jpeg',0.6)}); try{localStorage.setItem('god_face_alerts',JSON.stringify(faceAlerts.slice(0,50)));}catch(e){} showToast('🚨 Face Detected - Alert Saved'); }catch(e){} }
}
function openEnroll(){
  var list=knownFaces.map(function(f,i){ return '<div class="stat"><span>'+f.name+'</span><button onclick="knownFaces.splice('+i+',1);try{localStorage.setItem(\'god_faces\',JSON.stringify(knownFaces));}catch(e){}showToast(\'Deleted\');openEnroll()">Delete</button></div>'; }).join('');
  openPanel('<h2>👤 Enroll - Tag Only</h2><p>Browser cannot match faces. Enroll only tags a photo for manual check.</p><input id="enrollName" placeholder="Enter Name"><button class="primary" onclick="saveEnroll()">💾 Save Tag</button><h3>Tagged</h3>'+(list||'<p>No tags yet</p>'));
}
function saveEnroll(){
  var n=document.getElementById('enrollName').value.trim(); if(!n) return showToast('Enter name first');
  var v=document.getElementById('video'); var img=''; if(v.srcObject){ try{ var c=document.createElement('canvas'); c.width=160; c.height=120; c.getContext('2d').drawImage(v,0,0,160,120); img=c.toDataURL('image/jpeg',0.5); }catch(e){} }
  knownFaces.push({name:n,img:img,time:Date.now()}); try{localStorage.setItem('god_faces',JSON.stringify(knownFaces));}catch(e){} showToast('✅ Tag Saved '+n); openEnroll();
}
function openAlerts(){

}

function playIPCam(){
  var url=document.getElementById('ipUrl').value.trim(); if(!url) return showToast('Paste URL first');
  var box=document.getElementById('ipPlayer'); box.textContent='';
  if(url.indexOf('m3u8')>=0){ if(window.rtspEngine) rtspEngine.playHLS(url); box.textContent='HLS playing - see camera view'; }
  else if(url.indexOf('rtsp://')===0){ var p=document.createElement('p'); p.style.color='#ffcc00'; p.textContent='RTSP needs go2rtc gateway (192.168.1.50:1984). Trying...'; box.appendChild(p); if(window.rtspEngine) rtspEngine.playRTSP(url,'http://192.168.1.50:1984'); }
  else { if(window.rtspEngine) rtspEngine.playMJPEG(url); box.textContent='MJPEG playing - see camera view'; }
  showToast('IP Cam: Connecting...');
}
