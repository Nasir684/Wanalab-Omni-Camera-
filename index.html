<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WanaLab God Eye PRO v1.4</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.1.0/dist/coco-ssd.min.js"></script>
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{background:#000;overflow:hidden;font-family:Arial,sans-serif;height:100vh;width:100vw}
 #godVideo{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:1}
 #aiCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
 #topBar{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(0,0,0,0.8);color:#0f0;padding:8px 10px;display:flex;justify-content:space-between;font-size:11px}
 #countBar{position:fixed;top:48px;left:10px;z-index:1000;background:rgba(0,0,0,0.7);padding:10px;border-radius:12px;color:#fff;font-size:11px;min-width:120px}
 #zoomBar{position:fixed;top:48px;right:10px;z-index:1000;background:rgba(0,0,0,0.7);padding:10px;border-radius:12px;color:#fff}
 #zoomBar input{width:90px;accent-color:#0ff}
 #proBar{position:fixed;bottom:10px;left:5px;right:5px;display:flex;gap:4px;z-index:1000;flex-wrap:wrap}
 #proBar button{flex:1;padding:11px 2px;border:none;border-radius:9px;font-weight:bold;font-size:9px;min-width:48px}
 #status{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:1000;background:rgba(0,0,0,0.8);color:#0ff;padding:6px 14px;border-radius:20px;font-size:11px}
</style>
</head>
<body>

<video id="godVideo" autoplay playsinline muted></video>
<canvas id="aiCanvas"></canvas>

<div id="topBar">
 <span>🔭 WanaLab v1.4 VOICE</span>
 <span id="aiStatus">AI Loading...</span>
</div>

<div id="countBar">
 <div>📦 COUNT:</div>
 <div id="countList" style="color:#0ff;margin-top:4px">Scanning...</div>
 <div style="margin-top:6px"><label><input type="checkbox" id="voiceCheck" checked> 🔊 Voice</label></div>
</div>

<div id="zoomBar">
 <div style="font-size:9px;text-align:center">ZOOM <span id="zoomVal">1.0x</span></div>
 <input type="range" id="zoomSlider" min="1" max="10" value="1" step="0.1">
</div>

<div id="status">🤖 Loading AI v1.4...</div>

<div id="proBar">
 <button onclick="nightGod()" style="background:#ffaa00;color:#000">🌙 NIGHT</button>
 <button onclick="toggleTorch()" id="torchBtn" style="background:#ffff00;color:#000">🔦 TORCH</button>
 <button onclick="thermalMode()" style="background:#ff0044;color:#fff">🔥 THERMAL</button>
 <button onclick="toggleAI()" id="aiBtn" style="background:#00ff88;color:#000">🤖 AI</button>
 <button onclick="toggleRecord()" id="recBtn" style="background:#f00;color:#fff">● REC</button>
 <button onclick="capturePhoto()" style="background:#00e5ff;color:#000">📸 CAP</button>
</div>

<script>
let stream=null, track=null, isNight=false, isThermal=false, isTorch=false, zoomCaps=null;
let model=null, aiEnabled=true, detecting=false, mediaRecorder=null, recordedChunks=[], isRecording=false;
let lastSpoken={}; let lastCountText="";

const video=document.getElementById('godVideo');
const canvas=document.getElementById('aiCanvas');
const ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status');

async function initCamera(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:true});
  video.srcObject=stream; track=stream.getVideoTracks()[0];
  const caps=track.getCapabilities();
  if(caps.zoom){ zoomCaps=caps.zoom; document.getElementById('zoomSlider').min=caps.zoom.min; document.getElementById('zoomSlider').max=Math.min(caps.zoom.max,10); }
  await video.play(); canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  loadAI();
 }catch(e){ statusEl.innerText='❌ '+e.message; }
}
async function loadAI(){
 try{ model=await cocoSsd.load({base:'lite_mobilenet_v2'}); document.getElementById('aiStatus').innerText='AI Ready'; statusEl.innerText='✅ AI Ready - Voice ON'; setTimeout(()=>statusEl.style.display='none',2000); detectFrame(); }catch(e){ statusEl.innerText='AI Failed'; }
}

function updateFilter(){ let f=''; if(isNight) f+='brightness(1.9) contrast(1.25) '; if(isThermal) f+='sepia(1) hue-rotate(-30deg) saturate(3) contrast(1.5) brightness(1.3) '; video.style.filter=f.trim()||'none'; }
function nightGod(){ isNight=!isNight; updateFilter(); }
function thermalMode(){ isThermal=!isThermal; updateFilter(); }
async function toggleTorch(){ if(!track) return; try{ isTorch=!isTorch; await track.applyConstraints({advanced:[{torch:isTorch}]}); document.getElementById('torchBtn').innerText=isTorch?'🔦 OFF':'🔦 TORCH'; }catch(e){ alert('Torch not supported on this lens'); } }
function toggleAI(){ aiEnabled=!aiEnabled; document.getElementById('aiBtn').style.background=aiEnabled?'#00ff88':'#555'; if(aiEnabled) detectFrame(); else ctx.clearRect(0,0,canvas.width,canvas.height); }

function speak(text){
 if(!document.getElementById('voiceCheck').checked) return;
 if(lastSpoken[text] && Date.now()-lastSpoken[text]<5000) return; // 5 sec cooldown
 lastSpoken[text]=Date.now();
 const utter=new SpeechSynthesisUtterance(text);
 utter.lang='en-US'; utter.rate=1.1;
 speechSynthesis.speak(utter);
}

function updateCount(predictions){
 const counts={};
 predictions.forEach(p=>{ if(p.score>0.5) counts[p.class]=(counts[p.class]||0)+1; });
 let html=""; let voiceText="";
 for(let k in counts){ html+=`${k}: ${counts[k]}<br>`; voiceText+=`${counts[k]} ${k} `; }
 if(html==="") html="No objects";
 document.getElementById('countList').innerHTML=html;
 // Voice if changed
 if(voiceText && voiceText!==lastCountText){
   lastCountText=voiceText;
   speak(voiceText+" detected");
 }
}

async function detectFrame(){
 if(!aiEnabled || !model || detecting){ if(aiEnabled) requestAnimationFrame(detectFrame); return; }
 detecting=true;
 try{
  const predictions=await model.detect(video);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const scaleX=canvas.width/video.videoWidth;
  const scaleY=canvas.height/video.videoHeight;
  predictions.forEach(p=>{
   if(p.score<0.4) return;
   const [x,y,w,h]=p.bbox;
   ctx.strokeStyle='#00ff88'; ctx.lineWidth=3; ctx.strokeRect(x*scaleX,y*scaleY,w*scaleX,h*scaleY);
   ctx.fillStyle='#00ff88'; ctx.font='14px Arial'; ctx.fillText(`${p.class} ${Math.round(p.score*100)}%`, x*scaleX, y*scaleY>15?y*scaleY-4:y*scaleY+14);
  });
  if(predictions.length>0){
   document.getElementById('aiStatus').innerText=`AI: ${predictions.length} obj`;
   updateCount(predictions);
  } else { document.getElementById('aiStatus').innerText='AI: Scanning...'; }
 }catch(e){}
 detecting=false;
 requestAnimationFrame(detectFrame);
}

function capturePhoto(){
 const c=document.createElement('canvas'); c.width=video.videoWidth; c.height=video.videoHeight;
 const ct=c.getContext('2d'); ct.filter=video.style.filter||'none'; ct.drawImage(video,0,0); ct.drawImage(canvas,0,0,c.width,c.height);
 const a=document.createElement('a'); a.download='WanaLab-v14-'+Date.now()+'.png'; a.href=c.toDataURL(); a.click();
 speak("Photo captured");
}

function toggleRecord(){
 if(!isRecording){
  recordedChunks=[];
  const canvasStream=canvas.captureStream(30);
  const combined=new MediaStream([...stream.getVideoTracks(), ...stream.getAudioTracks(), ...canvasStream.getVideoTracks()]);
  // Use video element stream + canvas overlay recording via main canvas
  const recCanvas=document.createElement('canvas'); recCanvas.width=video.videoWidth; recCanvas.height=video.videoHeight;
  const recCtx=recCanvas.getContext('2d');
  const recStream=recCanvas.captureStream(30);
  if(stream.getAudioTracks().length>0) recStream.addTrack(stream.getAudioTracks()[0]);
  
  function drawRec(){
   if(!isRecording) return;
   recCtx.filter=video.style.filter||'none'; recCtx.drawImage(video,0,0,recCanvas.width,recCanvas.height);
   recCtx.drawImage(canvas,0,0,recCanvas.width,recCanvas.height);
   requestAnimationFrame(drawRec);
  }
  drawRec();
  
  mediaRecorder=new MediaRecorder(recStream,{mimeType:'video/webm'});
  mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) recordedChunks.push(e.data); };
  mediaRecorder.onstop=()=>{
   const blob=new Blob(recordedChunks,{type:'video/webm'});
   const url=URL.createObjectURL(blob);
   const a=document.createElement('a'); a.href=url; a.download='WanaLab-v14-'+Date.now()+'.webm'; a.click();
   statusEl.style.display='block'; statusEl.innerText='✅ Video saved!'; setTimeout(()=>statusEl.style.display='none',2000);
  };
  mediaRecorder.start();
  isRecording=true;
  document.getElementById('recBtn').innerText='■ STOP'; document.getElementById('recBtn').style.background='#fff'; document.getElementById('recBtn').style.color='#f00';
  statusEl.style.display='block'; statusEl.innerText='● REC Recording with AI...';
  speak("Recording started");
 } else {
  mediaRecorder.stop(); isRecording=false;
  document.getElementById('recBtn').innerText='● REC'; document.getElementById('recBtn').style.background='#f00'; document.getElementById('recBtn').style.color='#fff';
  speak("Recording stopped");
 }
}

document.getElementById('zoomSlider').addEventListener('input', async e=>{
 const z=parseFloat(e.target.value); document.getElementById('zoomVal').innerText=z.toFixed(1)+'x';
 if(track && zoomCaps){ try{ await track.applyConstraints({advanced:[{zoom:z}]}); }catch{ video.style.transform=`scale(${z})`; } } else { video.style.transform=`scale(${z})`; }
});
window.addEventListener('load', initCamera);
</script>
</body>
</html>
