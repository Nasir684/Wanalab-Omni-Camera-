<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WanaLab God Eye v99.4 PRO FINAL - Nasir Khan</title>
<meta name="theme-color" content="#00ff88">
<link rel="manifest" href="./manifest.json?v=994">
<script>
// v99.4 PRO CACHE KILLER - FIXES ALL
(async()=>{ if('caches' in window){ const k=await caches.keys(); for(let c of k){ if(c.includes('wana')) await caches.delete(c);} } localStorage.setItem('wanaVersion','v99.4-994-PRO'); if(navigator.serviceWorker){ const r=await navigator.serviceWorker.getRegistrations(); for(let x of r) await x.unregister(); } console.log('v99.4 killer done'); })();
</script>
<script src="https://docs.opencv.org/4.8.0/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#e0ffe0;font-family:'Inter',system-ui;overflow:hidden;touch-action:none}
#video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:auto}
#ui{position:absolute;top:0;left:0;width:100%;z-index:10;padding:12px}
.glass{background:rgba(15,15,15,0.75);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(0,255,136,0.2);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
#stat{padding:10px 14px;font-size:11px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.btn{padding:9px 14px;border-radius:24px;font-size:11.5px;font-weight:600;cursor:pointer;transition:0.25s;border:1px solid rgba(0,255,136,0.3);background:rgba(0,0,0,0.6);color:#00ff88}
.btn.active{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#000;box-shadow:0 0 20px rgba(0,255,136,0.5);font-weight:700}
.btn-voice{background:linear-gradient(135deg,#00ff88,#00ffaa);color:#000;border:none;font-weight:800;padding:10px 18px}
.btn-voice.listening{background:linear-gradient(135deg,#ff3b30,#ff6b6b);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,0.7)}70%{box-shadow:0 0 0 10px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}
#see{padding:12px 16px;text-align:center;font-size:12px;font-weight:500;margin-top:4px;min-height:44px}
#bottom{position:absolute;bottom:0;left:0;width:100%;z-index:10;padding:12px}
.bottom-glass{display:flex;gap:8px;justify-content:space-between;padding:10px 14px;flex-wrap:wrap}
.badge{padding:6px 12px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(0,0,0,0.7);border:1px solid rgba(0,255,136,0.3)}
#sliderPanel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88%;max-width:380px;z-index:30;padding:20px;display:none}
#sliderPanel input{width:100%;margin:8px 0 16px;accent-color:#00ff88}
.logo{font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#00ff88,#00ffaa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:12px}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="aiCanvas"></canvas>
<canvas id="docCanvas"></canvas>
<canvas id="thermalCanvas" style="opacity:0"></canvas>
<canvas id="trackCanvas"></canvas>

<div id="ui">
<div id="stat" class="glass"><span class="logo">GOD EYE v99.4 PRO FINAL</span><span id="statText">Loading...</span></div>
<div class="row">
<button class="btn" id="devBtn" onclick="switchDevice()">📱 DEVICES (5)</button>
<button class="btn btn-voice" id="voiceBtn" onclick="toggleVoice()">🎤 TAP TO START VOICE</button>
<span id="voiceBadge" class="badge">🔇 OFF</span>
<span id="langBadge" class="badge">EN</span>
</div>
<div class="row">
<button class="btn mode-btn" data-mode="doc" onclick="setMode('doc')">📄 DOC SCAN</button>
<button class="btn mode-btn" data-mode="count" id="countBtn" onclick="setMode('count')">🔢 COUNT ROI</button>
<button class="btn mode-btn" data-mode="ocr" onclick="setMode('ocr')">🔤 OCR ROI</button>
<button class="btn mode-btn" data-mode="barcode" onclick="setMode('barcode')">📷 BARCODE</button>
</div>
<div class="row">
<button class="btn mode-btn" data-mode="track" onclick="setMode('track')">🎯 TRACK</button>
<button class="btn mode-btn" data-mode="bill" onclick="setMode('bill')">🧾 TAP BILL</button>
<button class="btn" id="torchBtn" onclick="toggleTorch()">🔦 TORCH</button>
<button class="btn" onclick="clearAll()">🧹 CLEAR</button>
</div>
<div class="row">
<button class="btn" onclick="openSliders()">🎛️ SLIDERS</button>
<button class="btn" style="background:#00ff88;color:#000;font-weight:800" onclick="capture()">📸 CAPTURE</button>
<button class="btn" onclick="location.href='./export.html?v=994'">💾 EXPORT</button>
<button class="btn" onclick="installPWA()">📲 INSTALL</button>
</div>
<div id="see" class="glass">✨ v99.4 PRO FINAL — All Protocols Active — Draw box for COUNT</div>
</div>

<div id="bottom"><div class="bottom-glass glass">
<span id="countInfo" class="badge">Count: 0</span>
<span id="billInfo" class="badge">Bill: Rs. 0 | 0 items</span>
<span id="deviceInfo" class="badge">Omni Cam</span>
</div></div>

<div id="sliderPanel" class="glass">
<h4><span>🎛️ PRO Sliders v99.4</span><span onclick="openSliders()" style="cursor:pointer;font-size:20px">✕</span></h4>
<label>Exposure <span id="expV">50</span></label><input type="range" id="exp" min="0" max="100" value="50">
<label>Night Boost <span id="nightV">0</span></label><input type="range" id="night" min="0" max="100" value="0">
<label>Thermal JET <span id="thermalV">0</span></label><input type="range" id="thermal" min="0" max="100" value="0">
<label>HDR <span id="hdrV">0</span></label><input type="range" id="hdr" min="0" max="100" value="0">
</div>

<script>
let video=document.getElementById('video'), aiCanvas=document.getElementById('aiCanvas'), docCanvas=document.getElementById('docCanvas'), thermalCanvas=document.getElementById('thermalCanvas'), trackCanvas=document.getElementById('trackCanvas');
let aiCtx=aiCanvas.getContext('2d'), docCtx=docCanvas.getContext('2d'), thermalCtx=thermalCanvas.getContext('2d'), trackCtx=trackCanvas.getContext('2d');
let stream=null,track=null,mode='none',isDrawing=false,startX=0,startY=0,currentROI=null,scannedPages=[],billItems=[],billTotal=0,torchOn=false,lang='en-US',voiceOn=false,recognition=null;
let devices=[{id:'wanalab-omni-cam',name:'WanaLab Omni'},{id:'dji-mini-4-pro',name:'DJI Mini 4 Pro'},{id:'flir-one-pro',name:'FLIR ONE Pro'},{id:'usb-doc-cam',name:'USB Doc Cam'},{id:'ip-camera',name:'IP Cam RTSP'}],currentDevice=0;

async function init(){
 document.getElementById('statText').innerText='Starting camera...';
 try{
  if(stream) stream.getTracks().forEach(t=>t.stop());
  const cons=[{video:{facingMode:'environment',width:{ideal:1920}},audio:true},{video:{facingMode:'environment'},audio:true},{video:true,audio:false}];
  for(let c of cons){ try{ stream=await navigator.mediaDevices.getUserMedia(c); if(stream) break; }catch(e){ console.log('cons fail',e.message); } }
  if(!stream) throw new Error('Allow Camera+Mic in Chrome 🔒');
  video.srcObject=stream; track=stream.getVideoTracks()[0]; await video.play();
  let w=video.videoWidth||1280,h=video.videoHeight||720; [aiCanvas,docCanvas,thermalCanvas,trackCanvas].forEach(c=>{ c.width=w; c.height=h; c.style.width='100%'; c.style.height='100%'; });
  document.getElementById('statText').innerText=`✅ Cam ON - v99.4 PRO - ${w}x${h} - Pages:${scannedPages.length}`;
  document.getElementById('see').innerText='✅ All systems active - Tap COUNT ROI then draw box';
  initVoice(); startThermalLoop(); loadDeviceHub();
 }catch(e){ document.getElementById('statText').innerText='❌ '+e.message; document.getElementById('see').innerText='❌ '+e.message+' - Open in Chrome https:// + Allow 🔒'; setTimeout(init,2500); }
}
async function loadDeviceHub(){ try{ let r=await fetch('./devices.json?v=994'); let d=await r.json(); if(d.length) devices=d; }catch{} try{ await fetch('./js/device-hub.js?v=994'); }catch{} }
function initVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ document.getElementById('see').innerText='Voice needs Chrome'; return; }
 recognition=new SR(); recognition.continuous=true; recognition.interimResults=false; recognition.lang=lang;
 recognition.onresult=(e)=>{ let t=e.results[e.results.length-1][0].transcript.toLowerCase().trim(); document.getElementById('see').innerText='🎤 '+t; handleVoice(t); };
 recognition.onerror=(e)=>{ console.log('voice err',e.error); if(voiceOn) setTimeout(()=>{ try{recognition.start()}catch{} },800); };
 recognition.onend=()=>{ if(voiceOn) try{recognition.start()}catch{} };
}
function toggleVoice(){
 if(!recognition) initVoice();
 if(voiceOn){ try{recognition.stop()}catch{}; voiceOn=false; document.getElementById('voiceBtn').classList.remove('listening'); document.getElementById('voiceBadge').innerText='🔇 OFF'; document.getElementById('voiceBtn').innerText='🎤 TAP TO START VOICE'; document.getElementById('see').innerText='🔇 Voice OFF'; }
 else{ try{ recognition.lang=lang; recognition.start(); voiceOn=true; document.getElementById('voiceBtn').classList.add('listening'); document.getElementById('voiceBadge').innerText='🔴 LISTENING'; document.getElementById('voiceBtn').innerText='🔴 STOP VOICE'; document.getElementById('see').innerText='🎤 Listening... Say COUNT / GINTI / BILL / DEVICES / CAPTURE'; }catch(e){ document.getElementById('see').innerText='❌ Mic blocked - Allow in 🔒'; } }
}
function handleVoice(t){
 if(t.includes('count')||t.includes('ginti')||t.includes('گنتی')||t.includes('shumar')||t.includes('شمار')){ setMode('count'); speak('Count mode'); }
 else if(t.includes('device')||t.includes('ڈیوائس')) switchDevice();
 else if(t.includes('capture')||t.includes('photo')||t.includes('تصویر')||t.includes('shutter')) capture();
 else if(t.includes('bill')||t.includes('بل')) setMode('bill');
 else if(t.includes('doc')||t.includes('scan')) setMode('doc');
 else if(t.includes('torch')||t.includes('ٹارچ')) toggleTorch();
 else if(t.includes('clear')||t.includes('صاف')) clearAll();
 else if(t.includes('urdu')){ lang='ur-PK'; document.getElementById('langBadge').innerText='UR'; if(recognition) recognition.lang=lang; }
 else if(t.includes('english')){ lang='en-US'; document.getElementById('langBadge').innerText='EN'; if(recognition) recognition.lang=lang; }
}
function speak(txt){ if('speechSynthesis' in window){ let u=new SpeechSynthesisUtterance(txt); u.lang=lang; speechSynthesis.speak(u); } }

// FIXED MODE LOGIC - ALL BUTTONS ACTIVE
function setMode(m){
 mode=m;
 document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
 let target=document.querySelector(`.mode-btn[data-mode="${m}"]`);
 if(target) target.classList.add('active');
 document.getElementById('see').innerText=`✅ Mode: ${m.toUpperCase()} — Draw box with finger on camera`;
 clearCanvas();
}
function clearCanvas(){ aiCtx.clearRect(0,0,aiCanvas.width,aiCanvas.height); docCtx.clearRect(0,0,docCanvas.width,docCanvas.height); trackCtx.clearRect(0,0,trackCanvas.width,trackCanvas.height); }
function clearAll(){ clearCanvas(); currentROI=null; billItems=[]; billTotal=0; document.getElementById('billInfo').innerText='Bill: Rs. 0 | 0 items'; document.getElementById('countInfo').innerText='Count: 0'; document.getElementById('see').innerText='✨ Cleared - All protocols active'; }

function getPos(e){
 let rect=aiCanvas.getBoundingClientRect();
 let clientX=e.touches ? e.touches[0].clientX : e.clientX;
 let clientY=e.touches ? e.touches[0].clientY : e.clientY;
 let x=(clientX-rect.left)*(aiCanvas.width/rect.width);
 let y=(clientY-rect.top)*(aiCanvas.height/rect.height);
 return {x,y};
}
aiCanvas.addEventListener('mousedown',e=>{ isDrawing=true; let p=getPos(e); startX=p.x; startY=p.y; });
aiCanvas.addEventListener('mousemove',e=>{ if(!isDrawing) return; let p=getPos(e); drawRect(startX,startY,p.x-startX,p.y-startY); });
aiCanvas.addEventListener('mouseup',e=>{ if(!isDrawing) return; isDrawing=false; let p=getPos(e); currentROI={x:Math.min(startX,p.x),y:Math.min(startY,p.y),w:Math.abs(p.x-startX),h:Math.abs(p.y-startY)}; onROI(); });
aiCanvas.addEventListener('touchstart',e=>{ isDrawing=true; let p=getPos(e); startX=p.x; startY=p.y; e.preventDefault(); },{passive:false});
aiCanvas.addEventListener('touchmove',e=>{ if(!isDrawing) return; let p=getPos(e); drawRect(startX,startY,p.x-startX,p.y-startY); e.preventDefault(); },{passive:false});
aiCanvas.addEventListener('touchend',e=>{ 
 if(!isDrawing) return; isDrawing=false; 
 let t=e.changedTouches[0]; 
 let rect=aiCanvas.getBoundingClientRect();
 let x=(t.clientX-rect.left)*(aiCanvas.width/rect.width);
 let y=(t.clientY-rect.top)*(aiCanvas.height/rect.height);
 currentROI={x:Math.min(startX,x),y:Math.min(startY,y),w:Math.abs(x-startX),h:Math.abs(y-startY)}; 
 onROI(); e.preventDefault(); 
},{passive:false});

function drawRect(x,y,w,h){ aiCtx.clearRect(0,0,aiCanvas.width,aiCanvas.height); aiCtx.strokeStyle='#00ff88'; aiCtx.lineWidth=3; aiCtx.setLineDash([10,6]); aiCtx.strokeRect(x,y,w,h); aiCtx.fillStyle='rgba(0,255,136,0.12)'; aiCtx.fillRect(x,y,w,h); aiCtx.setLineDash([]); aiCtx.fillStyle='#00ff88'; aiCtx.font='12px monospace'; aiCtx.fillText(`${Math.round(w)}x${Math.round(h)}`,x,y-5); }

async function onROI(){ 
 if(!currentROI||currentROI.w<20||currentROI.h<20){ document.getElementById('see').innerText='⚠️ Draw bigger box'; return; }
 if(mode==='count') await doCountROI(); 
 else if(mode==='ocr') await doOCRROI(); 
 else if(mode==='barcode') await doBarcodeROI(); 
 else if(mode==='doc'){ document.getElementById('see').innerText=`📄 Doc ROI ${Math.round(currentROI.w)}x${Math.round(currentROI.h)} - Tap CAPTURE`; capture(); }
 else if(mode==='track'){ trackCtx.strokeStyle='#ff3b30'; trackCtx.lineWidth=2; trackCtx.strokeRect(currentROI.x,currentROI.y,currentROI.w,currentROI.h); document.getElementById('see').innerText='🎯 Tracking locked'; }
 else if(mode==='bill'){ let price=prompt('Enter price Rs. for this item:','100'); if(price&&!isNaN(price)){ billItems.push({roi:currentROI,price:parseFloat(price)}); billTotal+=parseFloat(price); document.getElementById('billInfo').innerText=`Bill: Rs. ${billTotal} | ${billItems.length} items`; document.getElementById('see').innerText=`🧾 Added Rs.${price} — Total Rs.${billTotal} — Draw next item`; drawBillMarkers(); } }
 else { document.getElementById('see').innerText='Select mode first: COUNT, DOC, BILL, etc'; }
}
function drawBillMarkers(){ aiCtx.clearRect(0,0,aiCanvas.width,aiCanvas.height); billItems.forEach((item,i)=>{ aiCtx.strokeStyle='#ffcc00'; aiCtx.strokeRect(item.roi.x,item.roi.y,item.roi.w,item.roi.h); aiCtx.fillStyle='#ffcc00'; aiCtx.fillText(`Rs.${item.price}`,item.roi.x,item.roi.y-5); }); }

// COUNT v99.4 FIXED - WITH FALLBACK
async function doCountROI(){
 try{
  document.getElementById('see').innerText='🔢 Counting PRO...';
  let c=document.createElement('canvas'); c.width=currentROI.w; c.height=currentROI.h;
  let ctx=c.getContext('2d'); ctx.drawImage(video,currentROI.x,currentROI.y,currentROI.w,currentROI.h,0,0,currentROI.w,currentROI.h);
  // Wait for OpenCV
  let retries=0; while((typeof cv==='undefined'||!cv.Mat)&&retries<20){ await new Promise(r=>setTimeout(r,150)); retries++; }
  if(typeof cv!=='undefined' && cv.Mat){
   let src=cv.imread(c), gray=new cv.Mat(), blur=new cv.Mat(), thresh=new cv.Mat();
   cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY); cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);
   cv.threshold(blur,thresh,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU);
   let contours=new cv.MatVector(), hier=new cv.Mat();
   cv.findContours(thresh,contours,hier,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
   let cnt=0; for(let i=0;i<contours.size();i++){ let area=cv.contourArea(contours.get(i)); if(area>80 && area< (currentROI.w*currentROI.h*0.8)) cnt++; }
   document.getElementById('countInfo').innerText=`Count: ${cnt}`; document.getElementById('see').innerText=`🔢 PRO Count: ${cnt} objects in ROI ${Math.round(currentROI.w)}x${Math.round(currentROI.h)}`;
   src.delete(); gray.delete(); blur.delete(); thresh.delete(); contours.delete(); hier.delete();
  }else{
   // JS fallback
   let data=ctx.getImageData(0,0,c.width,c.height).data; let dark=0; for(let i=0;i<data.length;i+=16){ if(data[i]<120) dark++; }
   let est=Math.max(1,Math.floor(dark/30)); document.getElementById('countInfo').innerText=`Count: ~${est}`; document.getElementById('see').innerText=`🔢 Count ~${est} (JS fallback - OpenCV loading)`;
  }
 }catch(e){ document.getElementById('see').innerText='❌ Count error: '+e.message; console.error(e); }
}
async function doOCRROI(){ document.getElementById('see').innerText='🔤 OCR PRO scanning...'; let c=document.createElement('canvas'); c.width=currentROI.w; c.height=currentROI.h; c.getContext('2d').drawImage(video,currentROI.x,currentROI.y,currentROI.w,currentROI.h,0,0,currentROI.w,currentROI.h); try{ let r=await Tesseract.recognize(c,'eng'); document.getElementById('see').innerText='🔤 OCR: '+(r.data.text.trim().substring(0,120)||'No text'); }catch(e){ document.getElementById('see').innerText='OCR fail: '+e.message; } }
async function doBarcodeROI(){ document.getElementById('see').innerText='📷 Barcode scanning...'; if('BarcodeDetector' in window){ let c=document.createElement('canvas'); c.width=currentROI.w; c.height=currentROI.h; c.getContext('2d').drawImage(video,currentROI.x,currentROI.y,currentROI.w,currentROI.h,0,0,currentROI.w,currentROI.h); try{ let det=new BarcodeDetector({formats:['ean_13','ean_8','qr_code','code_128','upc_a']}); let codes=await det.detect(c); document.getElementById('see').innerText=codes.length?'📷 Barcode: '+codes[0].rawValue+' ('+codes[0].format+')':'No barcode found'; }catch(e){ document.getElementById('see').innerText='Barcode err: '+e.message; } }else document.getElementById('see').innerText='Barcode needs Chrome 94+'; }
function startThermalLoop(){ function loop(){ let tv=parseInt(document.getElementById('thermal').value)||0; if(tv>0){ try{ let tmp=document.createElement('canvas'); tmp.width=video.videoWidth; tmp.height=video.videoHeight; tmp.getContext('2d').drawImage(video,0,0); if(typeof cv!=='undefined'&&cv.Mat){ let src=cv.imread(tmp), dst=new cv.Mat(); cv.applyColorMap(src,dst,cv.COLORMAP_JET); cv.imshow('thermalCanvas',dst); src.delete(); dst.delete(); thermalCanvas.style.opacity=tv/100; } }catch{} }else thermalCanvas.style.opacity=0; requestAnimationFrame(loop); } loop(); }
function toggleTorch(){ if(track&&track.getCapabilities&&track.getCapabilities().torch){ track.applyConstraints({advanced:[{torch:!torchOn}]}).then(()=>{ torchOn=!torchOn; document.getElementById('torchBtn').classList.toggle('active',torchOn); document.getElementById('see').innerText=torchOn?'🔦 Torch ON':'🔦 Torch OFF'; }).catch(()=>{ document.getElementById('see').innerText='Torch failed'; }); }else document.getElementById('see').innerText='🔦 Torch not supported on this device'; }
function switchDevice(){ currentDevice=(currentDevice+1)%devices.length; let d=devices[currentDevice]; document.getElementById('deviceInfo').innerText=d.name; document.getElementById('see').innerText='📱 Switched to '+d.name+' — Caps: '+ (d.caps?d.caps.join(','):d.type); document.getElementById('devBtn').classList.add('active'); setTimeout(()=>document.getElementById('devBtn').classList.remove('active'),800); if(voiceOn) speak(d.name); }
function openSliders(){ let p=document.getElementById('sliderPanel'); p.style.display=p.style.display==='none'?'block':'none'; }
document.getElementById('exp').oninput=e=>{document.getElementById('expV').innerText=e.target.value;}; 
document.getElementById('night').oninput=e=>{document.getElementById('nightV').innerText=e.target.value; aiCanvas.style.filter=`brightness(${1+e.target.value/100}) contrast(${1+e.target.value/200})`;}; 
document.getElementById('thermal').oninput=e=>{document.getElementById('thermalV').innerText=e.target.value;}; 
document.getElementById('hdr').oninput=e=>{document.getElementById('hdrV').innerText=e.target.value; video.style.filter=`contrast(${1+e.target.value/100})`;};
function capture(){ if(!video.videoWidth){ document.getElementById('see').innerText='❌ Camera not ready'; return; } let c=document.createElement('canvas'); c.width=video.videoWidth; c.height=video.videoHeight; c.getContext('2d').drawImage(video,0,0); scannedPages.push(c.toDataURL('image/jpeg',0.9)); document.getElementById('statText').innerText=`✅ Cam ON - v99.4 PRO - Pages:${scannedPages.length}`; document.getElementById('see').innerText=`📸 Captured page ${scannedPages.length} — Go to EXPORT for PDF`; if(navigator.vibrate) navigator.vibrate(80); localStorage.setItem('wanaPages',JSON.stringify(scannedPages)); }
function installPWA(){ document.getElementById('see').innerText='📲 Chrome menu ⋮ → Install app / Add to Home Screen — v99.4 PRO'; }
window.onload=()=>{ init(); if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=994').then(r=>console.log('SW v99.4 registered',r.scope)).catch(e=>console.log('SW fail',e)); };
</script>
</body>
</html>
