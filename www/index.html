<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#0B0E11">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B0E11;color:#E8EDF2;font-family:system-ui,Arial;padding-bottom:24px}
button{font-family:inherit;cursor:pointer;border:0;background:#1C222B;color:#fff;padding:12px 10px;border-radius:12px;font-size:13px;font-weight:700;border:1px solid #262E39}
button:active{transform:scale(.97)}
button.primary{background:#00C853;color:#02150A;border-color:#00C853}
button.gold{background:#FFC107;color:#000;border-color:#FFC107}
button.red{background:#2A1414;color:#FF9A94;border-color:#4A1F1F}
#head{position:sticky;top:0;z-index:50;background:#0B0E11;border-bottom:1px solid #262E39;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}
#head b{font-size:19px}
#head small{display:block;font-size:10px;color:#8A94A3;letter-spacing:1px;text-transform:uppercase}
.badge{background:#12261A;border:1px solid #1E4D32;color:#7CFFB2;font-size:12px;font-weight:700;padding:7px 10px;border-radius:999px}
#wrap{max-width:1100px;margin:0 auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.card{background:#151A21;border:1px solid #262E39;border-radius:18px;overflow:hidden}
.gpsBox{background:#0B0E11;border:1px solid #00E676;padding:12px;border-radius:12px}
.credBox{background:#0B0E11;border:1px solid #FFC107;padding:10px;border-radius:12px;margin:8px 0}
#camBox{position:relative;background:#000;height:calc(100vh - 170px);min-height:380px;display:flex;align-items:center;justify-content:center;overflow:hidden}
video{width:100%;height:100%;object-fit:cover}
#camPlaceholder{color:#8A94A3;text-align:center;line-height:1.6}
.row{display:flex;gap:8px;flex-wrap:wrap;padding:12px}
.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px}
.tools button{display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-align:left;padding:14px;min-height:96px}
.tools button span{font-size:12px;color:#8A94A3;font-weight:500}
.tools button b{font-size:14px}
#panel{display:none;background:#151A21;border:1px solid #262E39;border-radius:18px;padding:16px}
#panel input,#panel select,#panel textarea{width:100%;padding:12px;margin:6px 0;background:#0B0E11;color:#fff;border:1px solid #262E39;border-radius:12px;font-size:14px}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#1C222B;padding:10px 16px;border-radius:20px;z-index:999;display:none;border:1px solid #00C853;max-width:92vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#voiceOverlay{display:none;position:fixed;bottom:0;left:0;right:0;background:#151A21;border-top:2px solid #00C853;padding:16px;z-index:1000}
.camIcon{position:absolute;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.65);border:1px solid #fff3;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:20;padding:0}
#drawer{display:none;position:fixed;bottom:0;left:0;right:0;max-height:75vh;overflow:auto;background:#151A21;border-top:2px solid #00C853;padding:16px;z-index:1000;border-radius:18px 18px 0 0}
#galleryBtn.active{background:#00C853}
@media(max-width:520px){.tools{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="head"><div><b>GODEYE</b><small>WanaLab • Nasir Khan</small></div><div class="badge" id="proBadge">FREE</div></div>
<div id="wrap">
<div id="toast"></div>
<div class="card" style="border:0">
  <div id="camBox">
    <div id="camPlaceholder">📷<br>Tap CAM to Start<br><small>Camera will ask permission 1 time</small></div>
    <video id="video" autoplay playsinline muted style="display:none"></video>
    <canvas id="faceCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9"></canvas>
    <button class="camIcon" style="top:12px;right:12px" onclick="toggleVoiceRecord()" title="Voice Record">🎤</button>
    <button class="camIcon" style="top:12px;left:12px" onclick="toggleVideoMode()" title="Photo/Video">🎬</button>
    <button class="camIcon" style="top:64px;right:12px" onclick="flipCamera()" title="Front/Back">🔄</button>
    <button class="camIcon" style="top:64px;left:12px" onclick="openDashboard()" title="Dashboard">📊</button>
    <button class="camIcon" style="bottom:96px;right:12px" onclick="openCamTools()" title="Cam Tools">🧰</button>
    <button class="camIcon active" id="galleryBtn" style="bottom:96px;left:12px" onclick="toggleGallerySave()" title="Save to Gallery">🖼️</button>
    <div id="gpsMini" style="position:absolute;bottom:8px;left:8px;right:8px;background:rgba(0,0,0,.65);padding:8px;border-radius:10px;font-size:11px;z-index:15"><span id="gpsLabel">📍 GPS: OFF - Tap Get GPS</span><br><span id="gpsStatus" style="color:#FFC107">Status: OFF</span></div>
    <div id="faceInfo" style="display:none;position:absolute;bottom:58px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#00E676;padding:6px 12px;border-radius:20px;font-size:12px;z-index:16;white-space:nowrap">Face: --</div>
  </div>
  <div class="row" style="justify-content:center;align-items:center">
    <button onclick="startCamera()" style="width:52px;height:52px;border-radius:50%;font-size:20px">📷</button>
    <button class="primary" onclick="capturePhoto()" id="captureBtn" style="width:72px;height:72px;border-radius:50%;font-size:26px;border:3px solid #fff">📸</button>
    <button onclick="openCamTools()" style="width:52px;height:52px;border-radius:50%;font-size:20px">🧰</button>
  </div>
  <div style="text-align:center;font-size:11px;color:#8A94A3;padding-bottom:10px"><span id="modeLabel">📸 Photo Mode</span> • <span id="camLabel">Back Camera</span> • <span id="galleryLabel">Gallery Save: ON</span></div>
</div>
<div id="panel"></div>
<div id="drawer"></div>
<div style="text-align:center;color:#5A6575;font-size:12px">By WanaLab • Nasir Khan • GodEye v3.1 FINAL</div>
</div>
<div id="voiceOverlay"><div style="display:flex;justify-content:space-between"><b>🎤 Say: Capture / Count / Bill / Scan / Face / GPS Share</b><button onclick="closeVoiceOverlay()">✖</button></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button onclick="voiceTap('capture')">📸 Capture</button><button onclick="voiceTap('count')">🔢 Count</button><button onclick="voiceTap('bill')">🧾 Bill</button><button onclick="voiceTap('gps share')">📍 GPS Share</button><button onclick="stopVoice()">🔇 Stop</button></div></div>
<script>
var isPro = localStorage.getItem('godeye_pro')==='1';
var currentGPS=null, gpsFake=false, gpsFakeReason='';
var camStream=null, camFacing='environment', camMode='photo', mediaRecorder=null, recordedChunks=[], gallerySave=true, voiceRecording=false;
var faceMesh=null, faceOn=false, faceCount=0;
function getCount(k){ return parseInt(localStorage.getItem(k)||'0'); }
function showToast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3000); }
function openPanel(html){ var p=document.getElementById('panel'); p.style.display='block'; p.innerHTML=html+'<br><button onclick="closePanel()">← Back</button>'; p.scrollIntoView({behavior:'smooth'}); }
function closePanel(){ document.getElementById('panel').style.display='none'; }
function updateBadge(){ var b=document.getElementById('proBadge'); if(b) b.textContent = isPro?'PRO ✅':'FREE'; }
// --- CAMERA ---
async function startCamera(){
  try{
    if(camStream) camStream.getTracks().forEach(t=>t.stop());
    var v=document.getElementById('video');
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:camFacing},audio:false});
    v.srcObject=camStream; v.style.display='block';
    document.getElementById('camPlaceholder').style.display='none';
    var cl=document.getElementById('camLabel'); if(cl) cl.textContent = camFacing==='user'?'Front Camera':'Back Camera';
    showToast('✅ Camera ON');
  }catch(e){ alert('Camera Permission Denied: '+e.message+'\nGo to App Settings > Permissions > Camera > Allow'); }
}
async function flipCamera(){ camFacing = camFacing==='environment'?'user':'environment'; await startCamera(); }
function toggleVideoMode(){
  if(camMode==='photo'){ camMode='video'; document.getElementById('modeLabel').textContent='🎬 Video Mode - Tap Capture to Start/Stop'; document.getElementById('captureBtn').textContent='🔴'; }
  else { camMode='photo'; document.getElementById('modeLabel').textContent='📸 Photo Mode'; document.getElementById('captureBtn').textContent='📸'; }
  showToast(camMode==='video'?'Video Mode ON':'Photo Mode ON');
}
function toggleGallerySave(){ gallerySave=!gallerySave; document.getElementById('galleryLabel').textContent='Gallery Save: '+(gallerySave?'ON':'OFF'); document.getElementById('galleryBtn').classList.toggle('active',gallerySave); showToast('Gallery Save '+(gallerySave?'ON':'OFF')); }
function toggleVoiceRecord(){ if(voiceRecording){ voiceRecording=false; showToast('🎤 Voice Stopped'); } else { voiceRecording=true; showToast('🎤 Voice Recording... Tap again to stop'); startVoice(); } }
function capturePhoto(){
  if(camMode==='video'){ toggleVideoRecord(); return; }
  var v=document.getElementById('video');
  if(!v.srcObject||v.videoWidth===0){ alert('Tap CAM first'); startCamera(); return; }
  var c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0);
  var img=c.toDataURL('image/jpeg',0.85); var n=savePage('Photo',img);
  if(gallerySave){ var a=document.createElement('a'); a.href=img; a.download='godeye-'+Date.now()+'.jpg'; a.click(); }
  showToast('✅ Captured - Gallery: '+(gallerySave?'Saved':'OFF')+' - Pages: '+n);
}
function toggleVideoRecord(){
  if(mediaRecorder && mediaRecorder.state==='recording'){ mediaRecorder.stop(); document.getElementById('captureBtn').textContent='🔴'; return; }
  recordedChunks=[]; try{ mediaRecorder=new MediaRecorder(camStream,{mimeType:'video/webm'}); }catch(e){ alert('Video not supported on this phone: '+e.message); return; }
  mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) recordedChunks.push(e.data); };
  mediaRecorder.onstop=()=>{ var blob=new Blob(recordedChunks,{type:'video/webm'}); var url=URL.createObjectURL(blob); if(gallerySave){ var a=document.createElement('a'); a.href=url; a.download='godeye-video-'+Date.now()+'.webm'; a.click(); } var n=savePage('Video',''); showToast('✅ Video Saved - Pages: '+n); };
  mediaRecorder.start(); document.getElementById('captureBtn').textContent='⏹️'; showToast('🔴 Recording Video - Tap again to Stop');
}
function savePage(type, img){
  var pages=JSON.parse(localStorage.getItem('godeye_pages')||'[]');
  pages.push({date:new Date().toLocaleString('en-GB'), gps:getGPSLine(), type:type, img:img||''});
  localStorage.setItem('godeye_pages', JSON.stringify(pages));
  return pages.length;
}
// --- GPS ---
function refreshGPS(){
  var gl=document.getElementById('gpsLabel'); if(gl) gl.innerText='📍 GPS: Getting...';
  navigator.geolocation.getCurrentPosition((pos)=>{
    var fake = pos.coords.isFromMockProvider ? true : false;
    gpsFake=fake; gpsFakeReason = fake ? 'Mock Provider ON - Fake GPS App Detected' : '';
    currentGPS={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy,time:new Date().toLocaleString('en-PK'),map:'https://maps.google.com/?q='+pos.coords.latitude+','+pos.coords.longitude};
    var gl2=document.getElementById('gpsLabel'), gs=document.getElementById('gpsStatus');
    if(fake){ if(gl2) gl2.innerText='📍 GPS: '+currentGPS.lat+','+currentGPS.lng; if(gs) gs.innerText='❌ Fake GPS - Blocked - '+gpsFakeReason; showToast('❌ Fake GPS Blocked'); }
    else { if(gl2) gl2.innerText='📍 GPS: '+currentGPS.lat+','+currentGPS.lng+' - '+currentGPS.time+' - Accuracy '+Math.round(currentGPS.acc)+'m'; if(gs) gs.innerText='✅ Real GPS - Timestamp Proof OK'; }
  },(e)=>{ var gl3=document.getElementById('gpsLabel'), gs2=document.getElementById('gpsStatus'); if(gl3) gl3.innerText='📍 GPS OFF - Tap Get GPS'; if(gs2) gs2.innerText='Status: OFF - Turn On Location'; },{enableHighAccuracy:true,timeout:10000});
}
function getGPSLine(){ if(!currentGPS) return 'GPS: Not Yet - Tap Get GPS'; return 'GPS: '+currentGPS.lat+','+currentGPS.lng+' - Acc '+Math.round(currentGPS.acc)+'m - '+currentGPS.time+' - Map: '+currentGPS.map; }
function gpsShare(){
  if(gpsFake){ showToast('❌ Fake GPS Blocked'); openAntiFake(); return; }
  if(!currentGPS){ refreshGPS(); showToast('Getting GPS - Tap GPS Share Again'); return; }
  var cred=JSON.parse(localStorage.getItem('godeye_cred')||'{"header":"Wana General Store - Nasir Khan"}');
  var text='📍 Location Shared - GodEye v3.1\n🏪 From: '+(cred.header||'')+'\n📍 '+getGPSLine()+'\n'+(isPro?'PRO':'Made By WanaLab - GodEye FREE');
  if(navigator.share) navigator.share({title:'GodEye GPS Share',text:text}).catch(()=>{});
  else window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}
// --- CREDENTIALS ---
function credentialsBlock(f){ return '<div class="credBox"><b>🏛️ Credentials</b><br><span>Profile: '+(JSON.parse(localStorage.getItem('godeye_cred')||'{"header":"Wana General Store - Nasir Khan"}').header)+'</span><br><button onclick="openCredentials(\''+f+'\')">✏️ Edit Credentials</button></div><div class="gpsBox"><b>📍 GPS For This Page</b><br>'+getGPSLine()+'</div>'; }
function openCredentials(f){ openPanel('<h2>✏️ Edit Credentials</h2><input id="credIn" placeholder="Shop / Office / Name - Phone"><button class="primary" onclick="localStorage.setItem(\'godeye_cred\',JSON.stringify({header:document.getElementById(\'credIn\').value}));showToast(\'Credentials Saved\');closePanel()">💾 Save</button>'); }
function openShopProfile(){ openPanel('<h2>🏪 Shop Profile</h2>'+credentialsBlock('global')+'<button class="primary" onclick="openCredentials(\'global\')">✏️ Edit Global Profile</button>'); }
// --- TOOLS DRAWER ---
function openCamTools(){
  var d=document.getElementById('drawer'); d.style.display='block';
  d.innerHTML='<div style="display:flex;justify-content:space-between"><b>🧰 Cam Tools</b><button onclick="document.getElementById(\'drawer\').style.display=\'none\'">✖</button></div><div class="tools">'
  +'<button onclick="openBill()">🧾<b>Bill PRO</b><span id="billLimit">FREE</span></button>'
  +'<button onclick="openDocScan()">📄<b>Doc Scan PRO</b><span id="scanLimit">FREE</span></button>'
  +'<button onclick="openCount()">🔢<b>Count PRO</b><span>FREE</span></button>'
  +'<button onclick="openFacePage()">👤<b>Face 468 Dots</b><span id="faceLimit">FREE</span></button>'
  +'<button onclick="refreshGPS()">📍<b>Get GPS</b><span>Timestamp</span></button>'
  +'<button onclick="gpsShare()">📍<b>GPS Share</b><span>Map</span></button>'
  +'<button onclick="openEffects()">✨<b>Effects</b><span>PRO</span></button>'
  +'<button onclick="openThumb()">👍<b>Thumb</b><span>PRO Only</span></button>'
  +'<button onclick="openAttendance()">📅<b>Attendance</b><span>PRO Only</span></button>'
  +'<button onclick="openAntiFake()">🛡️<b>Anti-Fake</b><span>Check</span></button>'
  +'<button onclick="openExportHub()">📤<b>Export Hub</b><span>Pages</span></button>'
  +'<button onclick="openPricing()">💰<b>PRO</b><span>Rs.2500/Yr</span></button>'
  +'<button onclick="openSystem()">⚙️<b>System</b><span>Test • Clear</span></button>'
  +'<button onclick="openManual()">📖<b>Manual</b><span>FREE</span></button>'
  +'<button onclick="openShopProfile()">🏪<b>Shop Profile</b><span>Credentials</span></button></div>'
  +'<div style="display:flex;gap:8px"><button class="gold" style="flex:1" onclick="openPricing()">💰 Upgrade PRO</button><button style="flex:1" onclick="openAbout()">ℹ️ About</button></div>';
  updateLimits();
}
function checkProAndOpen(p){ if(isPro) openPanel('<h2>External: '+p+' PRO</h2><p>Connect '+p+' hardware, then Add Device.</p><button class="primary" onclick="showToast(\'Add Device - PRO\')">+ Add Device</button>'); else openPricing('external-'+p); }
// --- FEATURES ---
function openBill(){
  if(!isPro && getCount('god_bill_count')>=5){ openPricing('bill'); return; }
  openPanel('<h2>🧾 Bill PRO</h2>'+credentialsBlock('bill')+'<input id="billItem" placeholder="Item Name"><input id="billPrice" type="number" placeholder="Price Rs."><input id="billQty" type="number" placeholder="Qty" value="1"><button class="primary" onclick="saveBill()">💾 Save Bill + Export</button><div id="billOut"></div>');
}
function saveBill(){
  var item=document.getElementById('billItem').value||'Item'; var pr=parseFloat(document.getElementById('billPrice').value||'0'); var q=parseInt(document.getElementById('billQty').value||'1');
  var total=pr*q; localStorage.setItem('god_bill_count', getCount('god_bill_count')+1);
  var n=savePage('Bill: '+item+' x'+q+' = Rs.'+total, '');
  document.getElementById('billOut').innerHTML='<p>✅ Bill Saved: '+item+' = Rs.'+total+'<br>Pages: '+n+'</p>';
  showToast('✅ Bill Saved - Pages: '+n); updateLimits();
}
function openDocScan(){
  if(!isPro && getCount('god_scan_count')>=5){ openPricing('scan'); return; }
  openPanel('<h2>📄 Doc Scan PRO - Real OCR</h2>'+credentialsBlock('doc')+'<p>Point camera at document, tap OCR. Reads English text.</p><button class="primary" onclick="runOCR()">📄 Scan + Read Text (OCR)</button><div id="ocrBox" style="display:none;background:#0B0E11;border:1px solid #00CCFF;padding:10px;border-radius:10px;margin-top:8px;white-space:pre-wrap"></div><br><button onclick="localStorage.setItem(\'god_scan_count\',getCount(\'god_scan_count\')+1);var n=savePage(\'Doc Scan\',\'\');showToast(\'✅ Doc Saved - Pages: \'+n);updateLimits()">💾 Save Doc Without OCR</button>');
}
async function runOCR(){
  var v=document.getElementById('video');
  if(!v.srcObject || v.videoWidth===0){ alert('Tap CAM first'); await startCamera(); return; }
  var c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0);
  var box=document.getElementById('ocrBox'); if(box){ box.style.display='block'; box.textContent='🔍 Reading Text... (5-10 sec, needs internet 1st time)'; }
  try{
    var result=await Tesseract.recognize(c.toDataURL('image/jpeg',0.9),'eng');
    var txt=result.data.text.trim() || '(No text found)';
    if(box) box.textContent='📄 OCR Result:\n'+txt;
    localStorage.setItem('god_scan_count',getCount('god_scan_count')+1);
    var n=savePage('Doc Scan OCR: '+txt.substring(0,80), c.toDataURL('image/jpeg',0.85));
    showToast('✅ OCR Saved - Pages: '+n); updateLimits();
  }catch(e){ if(box) box.textContent='OCR Failed: '+e.message; }
}
function openCount(){ openPanel('<h2>🔢 Count PRO</h2>'+credentialsBlock('count')+'<p>Point camera at items, count manually.</p><input id="cnt" type="number" placeholder="Count"><button class="primary" onclick="var n=savePage(\'Count: \'+document.getElementById(\'cnt\').value,\'\');showToast(\'✅ Count Saved - Pages: \'+n)">💾 Save Count</button>'); }
function openFacePage(){
  if(!isPro && getCount('god_face_count')>=2){ openPricing('face'); return; }
  openPanel('<h2>👤 Face PRO - 468 Dots REAL</h2>'+credentialsBlock('face')+'<p>Tap Start Face, point face in frame. Green dots = 468 live points.</p><button class="primary" onclick="startFaceMesh()">👤 Start Face Mesh - 468 Dots</button> <button onclick="stopFaceMesh()">⏹ Stop Face</button><br><br><button class="primary" onclick="localStorage.setItem(\'god_face_count\',getCount(\'god_face_count\')+1);var n=savePage(\'Face Scan - Dots: \'+faceCount,\'\');showToast(\'✅ Face Saved - Dots: \'+faceCount+\' - Pages: \'+n);updateLimits()">💾 Save Face</button>');
}
async function startFaceMesh(){
  await startCamera();
  if(faceMesh){ faceOn=true; document.getElementById('faceInfo').style.display='block'; showToast('✅ Face Mesh ON - 468 Dots'); return; }
  try{
    faceMesh = new FaceMesh({locateFile:(f)=>'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/'+f});
    faceMesh.setOptions({maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.5, minTrackingConfidence:0.5});
    faceMesh.onResults(onFaceResults); faceOn=true; document.getElementById('faceInfo').style.display='block'; showToast('✅ Face Mesh ON - Point face in frame');
    async function loop(){ if(!faceOn) return; var v=document.getElementById('video'); if(v && v.videoWidth>0) await faceMesh.send({image:v}); requestAnimationFrame(loop); }
    loop();
  }catch(e){ alert('Face Mesh failed: '+e.message+'\nNeed internet 1st time'); }
}
function onFaceResults(res){
  var canvas=document.getElementById('faceCanvas'); var ctx=canvas.getContext('2d'); var v=document.getElementById('video');
  canvas.width=v.videoWidth; canvas.height=v.videoHeight; ctx.clearRect(0,0,canvas.width,canvas.height);
  if(res.multiFaceLandmarks && res.multiFaceLandmarks.length>0){
    var lm=res.multiFaceLandmarks[0]; faceCount=lm.length; ctx.fillStyle='#00E676';
    lm.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x*canvas.width, p.y*canvas.height, 1.2, 0, 2*Math.PI); ctx.fill(); });
    document.getElementById('faceInfo').textContent='✅ Face Detected - Dots: '+lm.length+' / 468';
  } else { document.getElementById('faceInfo').textContent='🔍 No Face - Point face in frame'; }
}
function stopFaceMesh(){ faceOn=false; var c=document.getElementById('faceCanvas'); c.getContext('2d').clearRect(0,0,c.width,c.height); document.getElementById('faceInfo').style.display='none'; showToast('Face Mesh OFF'); }
function openThumb(){ if(!isPro){ openPricing('thumb'); return; } openPanel('<h2>👍 Thumb PRO</h2>'+credentialsBlock('thumb')+'<p>Put Right Thumb in frame - Capture on Camera.</p><button class="primary" onclick="showToast(\'Thumb Captured - Quality 92%\')">👍 Capture Thumb</button>'); }
function openAttendance(){ if(!isPro){ openPricing('attendance'); return; } if(gpsFake){ openPanel('<h2>❌ Fake GPS - Attendance Blocked</h2><p>'+gpsFakeReason+'</p>'); return; } openPanel('<h2>📅 Attendance PRO</h2>'+credentialsBlock('attendance')+'<button class="primary" onclick="showToast(\'Nasir ✅ Check-In - GPS At Shop ✅\')">👍 Mark Attendance</button>'); }
function openEffects(){ openPanel('<h2>✨ Effects PRO</h2>'+credentialsBlock('effects')+'<p>Clarendon / Juno / Lark / Moon</p><button onclick="showToast(\'Clarendon Applied\')">Clarendon</button> <button onclick="showToast(\'Juno Applied\')">Juno</button><br><br><button class="primary" onclick="showToast(\'Effects Saved\')">💾 Save</button>'); }
function openGPS(){ openPanel('<h2>📍 GPS Timestamp</h2><div class="gpsBox">'+getGPSLine()+'</div><button class="primary" onclick="refreshGPS()">🔄 Get GPS</button> <button onclick="gpsShare()">📍 Share</button>'); }
function openAntiFake(){ openPanel('<h2>🛡️ Anti-Fake GPS</h2><p>Status: '+(gpsFake?'❌ Fake - '+gpsFakeReason:'✅ Real GPS - Passed')+'</p><p>Fix: Uninstall Fake GPS App > Developer Options > Mock App > None > Restart</p><button class="primary" onclick="refreshGPS()">🔄 Check Again</button>'); }
function openDashboard(){ var pages=JSON.parse(localStorage.getItem('godeye_pages')||'[]'); var totalBill=getCount('god_bill_count'); openPanel('<h2>📊 Dashboard / History</h2><p>Total Pages: '+pages.length+' • Bills: '+totalBill+'</p>'+pages.map(p=>'<div style="background:#0B0E11;padding:10px;border-radius:10px;margin:6px 0">'+p.type+'<br><small>'+p.date+'<br>'+p.gps+'</small></div>').join('')+'<button class="primary" onclick="openExportHub()">📤 Open Export Hub</button>'); }
function openSystem(){ openPanel('<h2>⚙️ System</h2><p>GPS: '+getGPSLine()+'</p><button onclick="localStorage.clear();showToast(\'Cache Cleared\')">Clear Cache</button><br><br><p>External (PRO):</p><button onclick="checkProAndOpen(\'IPCam\')">📹 IP Cam</button> <button onclick="checkProAndOpen(\'Thermal\')">🌡️ Thermal</button> <button onclick="checkProAndOpen(\'USBCam\')">📷 USB Cam</button> <button onclick="checkProAndOpen(\'Bluetooth\')">🔵 Bluetooth</button> <button onclick="checkProAndOpen(\'Printer\')">🖨️ Printer</button> <button onclick="checkProAndOpen(\'CCTV\')">📡 CCTV</button>'); }
function openManual(){ openPanel('<h2>📖 Manual</h2><p>1. Tap CAM > Allow > Capture<br>2. Tap 🧰 Tools > Bill / Count / Face > Save<br>3. Tap Export Hub > TXT / PDF / WhatsApp<br>4. GPS: Tap Get GPS before Capture for proof.</p>'); }
function openPricing(f){ openPanel('<h2>💰 PRO Rs. 2,500 / Year</h2><p>'+(f?'Limit reached: '+f+'<br>':'')+'PRO: Thumb + Attendance + Effects + Full GPS + No Watermark + Unlimited</p><button class="primary" onclick="showToast(\'Contact WanaLab for PRO\')">💰 Buy PRO</button>'); }
function openAbout(){ openPanel('<h2>ℹ️ About</h2><p>By WanaLab • Nasir Khan • GodEye v3.1 FINAL</p>'); }
function openExportHub(){
  var pages=JSON.parse(localStorage.getItem('godeye_pages')||'[]');
  var list = pages.length ? pages.map((p,i)=>'<div style="background:#0B0E11;padding:10px;border-radius:10px;margin:6px 0"><b>'+(i+1)+'. '+p.type+'</b><br><small>'+p.date+'<br>'+p.gps+'</small>'+(p.img?'<br><img src="'+p.img+'" style="width:100%;border-radius:8px;margin-top:6px">':'')+'</div>').join('') : '<p>No pages yet. Tap CAM > Capture, or 🧰 Tools > Bill > Save Bill, then come back.</p>';
  openPanel('<h2>📤 Export Hub</h2><p><b>Pages: '+pages.length+'</b></p>'+list+'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" onclick="exportTXT()">📄 TXT</button><button onclick="exportWhatsApp()">💬 WhatsApp</button><button onclick="exportPrint()">🖨️ Print / PDF</button><button class="red" onclick="if(confirm(\'Clear all pages?\')){localStorage.setItem(\'godeye_pages\',\'[]\');openExportHub()}">🗑️ Clear</button></div>');
}
function exportTXT(){
  var pages=JSON.parse(localStorage.getItem('godeye_pages')||'[]'); if(!pages.length){ showToast('No pages to export'); return; }
  var txt='GodEye Export - '+new Date().toLocaleString('en-GB')+'\n\n'+pages.map((p,i)=>(i+1)+'. '+p.type+'\n'+p.date+'\n'+p.gps+'\n').join('\n');
  var blob=new Blob([txt],{type:'text/plain'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='godeye-export.txt'; a.click(); showToast('✅ TXT Downloaded');
}
function exportWhatsApp(){ var pages=JSON.parse(localStorage.getItem('godeye_pages')||'[]'); if(!pages.length){ showToast('No pages'); return; } var txt='GodEye Export\n'+pages.map(p=>p.type+' - '+p.date+' - '+p.gps).join('\n'); window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank'); }
function exportPrint(){ window.print(); }
function startVoice(){ document.getElementById('voiceOverlay').style.display='block'; }
function closeVoiceOverlay(){ document.getElementById('voiceOverlay').style.display='none'; }
function stopVoice(){ closeVoiceOverlay(); }
function voiceTap(a){ if(a==='capture') capturePhoto(); else if(a==='gps share') gpsShare(); else if(a==='bill') openBill(); else if(a==='count') openCount(); else showToast('Voice: '+a); closeVoiceOverlay(); }
function updateLimits(){
  var b=getCount('god_bill_count'), s=getCount('god_scan_count'), f=getCount('god_face_count');
  var map={'billLimit':b,'scanLimit':s,'faceLimit':f};
  for(var id in map){ var el=document.getElementById(id); if(!el) continue; var left = id==='faceLimit'? (2-map[id]) : (5-map[id]); el.textContent = isPro?'PRO ✅ Unlimited':'FREE: '+left+' / '+(id==='faceLimit'?'2':'5')+' Left'; }
}
updateBadge(); updateLimits();
</script>
