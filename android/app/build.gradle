apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace "com.wanalab.godeye"
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    applicationId "com.wanalab.godeye"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 22
    versionName "2.2"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
    debug {
      debuggable true
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_21
    targetCompatibility JavaVersion.VERSION_21
  }

  kotlinOptions {
    jvmTarget = '21'
  }

  buildFeatures {
    buildConfig true
  }
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])
  implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
  implementation "androidx.coordinatorlayout:coordinatorlayout:$rootProject.ext.androidxCoordinatorLayoutVersion"
  implementation "androidx.core:core-splashscreen:$rootProject.ext.coreSplashScreenVersion"
  implementation "androidx.webkit:webkit:$rootProject.ext.androidxWebkitVersion"
  implementation project(':capacitor-android')
  implementation project(':capacitor-app')
  implementation project(':capacitor-haptics')
  implementation project(':capacitor-keyboard')
  implementation project(':capacitor-status-bar')

  // Media3 - External Devices PRO - IP Cam / RTSP / HLS / CCTV
  implementation "androidx.media3:media3-exoplayer:1.4.1"
  implementation "androidx.media3:media3-ui:1.4.1"
  implementation "androidx.media3:media3-exoplayer-rtsp:1.4.1"
  implementation "androidx.media3:media3-exoplayer-hls:1.4.1"
  implementation "androidx.media3:media3-exoplayer-dash:1.4.1"
  // DELETED: media3-exoplayer-rtmp - DOES NOT EXIST in 1.4.1 - was failing build
}

apply from: 'capacitor.build.gradle'

try {
  def servicesJSON = file('google-services.json')
  if (servicesJSON.text) {
    apply plugin: 'com.google.gms.google-services'
  }
} catch(Exception e) {
  logger.info("google-services.json not found, skipping")
}
