name: Build GodEye APK + AAB - v2.2
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - name: Install Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Node deps
        run: npm install
      - name: Skip web build - DO NOT overwrite www/
        run: echo "www already exists, skipping web build"
      - run: npx cap sync android
      - name: FIX ALL - Manifest + Res + MainActivity + Gradle
        run: |
          python3 <<'PYEOF'
          import re, os
          from pathlib import Path
          base = Path('android/app/src/main/res')
          # --- A. Nuclear clean res ---
          import shutil
          if base.exists(): shutil.rmtree(base)
          for d in ['values','xml','drawable','layout','mipmap-mdpi','mipmap-hdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']:
              (base/d).mkdir(parents=True, exist_ok=True)
          # --- B. Complete values ---
          (base/'values/strings.xml').write_text('<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">GodEye</string><string name="title_activity_main">GodEye</string><string name="action_settings">Settings</string><string name="hello_world">Hello World!</string></resources>')
          (base/'values/colors.xml').write_text('<?xml version="1.0" encoding="utf-8"?><resources><color name="colorPrimary">#2563EB</color><color name="colorPrimaryDark">#1E40AF</color><color name="colorAccent">#2563EB</color><color name="colorPrimaryVariant">#1E40AF</color><color name="colorOnPrimary">#FFFFFF</color></resources>')
          (base/'values/styles.xml').write_text('''<?xml version="1.0" encoding="utf-8"?><resources>
          <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar"><item name="colorPrimary">@color/colorPrimary</item><item name="colorPrimaryDark">@color/colorPrimaryDark</item><item name="colorAccent">@color/colorAccent</item></style>
          <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar"><item name="colorPrimary">@color/colorPrimary</item><item name="colorPrimaryDark">@color/colorPrimaryDark</item><item name="colorAccent">@color/colorAccent</item></style>
          <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.Light.NoActionBar"><item name="colorPrimary">@color/colorPrimary</item><item name="colorPrimaryDark">@color/colorPrimaryDark</item><item name="colorAccent">@color/colorAccent</item><item name="android:windowBackground">@color/colorPrimary</item></style>
          <style name="AppTheme.NoActionBarLaunchSplash" parent="AppTheme.NoActionBarLaunch" />
          <style name="LaunchTheme" parent="AppTheme.NoActionBarLaunch" />
          <style name="SplashTheme" parent="AppTheme.NoActionBarLaunch" />
          </resources>''')
          (base/'xml/file_paths.xml').write_text('<?xml version="1.0" encoding="utf-8"?><paths><files-path name="files" path="." /><cache-path name="cache" path="." /><external-path name="external" path="." /></paths>')
          (base/'xml/data_extraction_rules.xml').write_text('<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup><exclude domain="root" path="." /></cloud-backup><device-transfer><exclude domain="root" path="." /></device-transfer></data-extraction-rules>')
          # --- C. MainActivity + delete omnicamera ---
          import shutil as sh
          sh.rmtree('android/app/src/main/java/com/wanalab/omnicamera', ignore_errors=True)
          Path('android/app/src/main/java/com/wanalab/godeye').mkdir(parents=True, exist_ok=True)
          Path('android/app/src/main/java/com/wanalab/godeye/MainActivity.java').write_text('package com.wanalab.godeye;\nimport com.getcapacitor.BridgeActivity;\npublic class MainActivity extends BridgeActivity {}')
          # --- D. Manifest fixes ---
          mp = 'android/app/src/main/AndroidManifest.xml'
          t = open(mp).read()
          t = t.replace('@string/title_activity_main', 'GodEye')
          t = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', t)
          t = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"', t)
          open(mp,'w').write(t)
          # --- E. AUTO-FIX any other @type/name in Manifest ---
          refs = set(re.findall(r'@([a-z]+)/([A-Za-z0-9_\.]+)', open(mp).read()))
          for typ, name in refs:
              if typ == 'style' and f'name="{name}"' not in (base/'values/styles.xml').read_text():
                  cur = (base/'values/styles.xml').read_text()
                  (base/'values/styles.xml').write_text(cur.replace('</resources>', f'  <style name="{name}" parent="AppTheme.NoActionBarLaunch" />\n</resources>'))
                  print(f"Added style {name}")
              if typ == 'string' and f'name="{name}"' not in (base/'values/strings.xml').read_text():
                  cur = (base/'values/strings.xml').read_text()
                  (base/'values/strings.xml').write_text(cur.replace('</resources>', f'    <string name="{name}">GodEye</string>\n</resources>'))
                  print(f"Added string {name}")
              if typ == 'color' and f'name="{name}"' not in (base/'values/colors.xml').read_text():
                  cur = (base/'values/colors.xml').read_text()
                  (base/'values/colors.xml').write_text(cur.replace('</resources>', f'<color name="{name}">#2563EB</color></resources>'))
                  print(f"Added color {name}")
          # --- F. build.gradle resValue injection ---
          bg = 'android/app/build.gradle'
          g = open(bg).read()
          if 'title_activity_main' not in g:
              g = g.replace('defaultConfig {', 'defaultConfig {\n        resValue "string", "title_activity_main", "GodEye"\n        resValue "string", "app_name", "GodEye"')
              open(bg,'w').write(g)
          print("✅ ALL FIXES APPLIED")
          PYEOF
      - name: Create icons with Pillow
        run: |
          pip3 install Pillow --break-system-packages -q
          python3 <<'PYEOF'
          import os
          from PIL import Image
          for d, size in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
              p = f'android/app/src/main/res/{d}'
              os.makedirs(p, exist_ok=True)
              img = Image.new('RGB', (size, size), color=(37, 99, 235))
              img.save(f'{p}/ic_launcher.png')
              img.save(f'{p}/ic_launcher_round.png')
          print('✅ Icons created')
          PYEOF
      - name: Generate gradlew if missing
        run: |
          if [ -f android/gradlew ]; then chmod +x android/gradlew; exit 0; fi
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          /tmp/gradle-8.11.1/bin/gradle -p $GITHUB_WORKSPACE/android wrapper --gradle-version 8.11.1
          chmod +x $GITHUB_WORKSPACE/android/gradlew
      - name: Build APK + AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: GodEye-APK-v2.2, path: android/app/build/outputs/apk/debug/*.apk }
      - uses: actions/upload-artifact@v4
        with: { name: GodEye-AAB-v2.2, path: android/app/build/outputs/bundle/debug/*.aab }
