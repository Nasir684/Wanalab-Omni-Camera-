# WanaLab God Eye v2.2 - build-apk.yml - FINAL - Capacitor Plugins Dynamic Fix
# Author: Nasir Khan - Dera Ismail Khan, Khyber Pakhtunkhwa - 2026-11-23
# PRO Rs. 2,500 / Year
name: Build GodEye APK + AAB - v2.2 - Thumb + Effects + Credentials + GPS + Anti-Fake

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  GODEYE_VERSION: "2.2"
  GODEYE_NAME: "GodEye - By WanaLab"
  PRO_PRICE: "Rs. 2,500 / Year"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo files - v2.2 Structure
        run: |
          ls -la
          echo "--- www/ - Main Camera ---"
          ls -la www/ || echo "www/ NOT FOUND"
          ls -lh www/index.html || echo "www/index.html MISSING"
          echo "--- ROOT - Shop / Export / About / Privacy ---"
          ls -lh shop.html || echo "shop.html MISSING in ROOT"
          ls -lh export.html || echo "export.html MISSING in ROOT"
          ls -lh about.html || echo "about.html MISSING in ROOT"
          ls -lh privacy.html || echo "privacy.html MISSING in ROOT"
          echo "Version: $GODEYE_VERSION - $GODEYE_NAME - PRO: $PRO_PRICE"
          echo "--- Android build files ---"
          ls -lh android/build.gradle android/build.gradle.kts 2>/dev/null || echo "Root build file check"
          ls -lh android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || echo "App build file check"
          ls -lh android/settings.gradle android/settings.gradle.kts 2>/dev/null || echo "Settings file check"

      - name: Ensure web assets exist
        run: |
          if [ ! -f www/index.html ]; then
            mkdir -p www
            echo '<html><body><h1>GodEye - By WanaLab - Please commit www/index.html</h1></body></html>' > www/index.html
          fi

      - name: Check Spec v4-v22-A in HTML - FAIL if old HTML
        run: |
          echo "Checking www/index.html for v4-v22-A spec..."
          grep -q "468 Dots" www/index.html || (echo "❌ FAIL: Face Mesh 468 Dots missing - See Spec v18" && exit 1)
          grep -q "MediaPipe\|mediapipe\|face_mesh" www/index.html || (echo "❌ FAIL: MediaPipe missing - See Spec v18" && exit 1)
          grep -q "External Devices" www/index.html || (echo "❌ FAIL: External Devices section missing - See Spec v19" && exit 1)
          grep -q "PRO Only" www/index.html || (echo "❌ FAIL: PRO Only label missing for External - See Spec v19" && exit 1)
          grep -q "2,500" www/index.html || (echo "❌ FAIL: PRO Price Rs. 2,500 missing - See Spec v8" && exit 1)
          grep -q "By WanaLab" www/index.html || (echo "❌ FAIL: WanaLab footer missing - See Spec v10" && exit 1)
          grep -q "Nasir Khan" www/index.html || (echo "❌ FAIL: Founded by Nasir Khan missing - See Spec v10" && exit 1)
          grep -q "Thumb Biometric" www/index.html || (echo "❌ FAIL: Thumb Biometric missing - See Spec v20" && exit 1)
          grep -q "Thumb.*PRO Only\|Thumb Biometric PRO" www/index.html || (echo "❌ FAIL: Thumb PRO Only missing - See Spec v20" && exit 1)
          grep -q "Attendance" www/index.html || (echo "❌ FAIL: Thumb Attendance missing - See Spec v20-A" && exit 1)
          grep -q "Liveness\|Move Thumb" www/index.html || (echo "❌ FAIL: Thumb Liveness Move Check missing - See Spec v20 - NADRA-Style" && exit 1)
          grep -q "Photo Effects" www/index.html || (echo "❌ FAIL: Photo Effects missing - See Spec v21" && exit 1)
          grep -q "Clarendon" www/index.html || (echo "❌ FAIL: Clarendon filter missing - See Spec v21" && exit 1)
          grep -q "Thumb Clear\|Doc Clear" www/index.html || (echo "❌ FAIL: Thumb Clear / Doc Clear missing - See Spec v21" && exit 1)
          grep -q "Credentials For This Page" www/index.html || (echo "❌ FAIL: Per-Feature Credentials missing - See Spec v22-A" && exit 1)
          grep -q "Profile Type" www/index.html || (echo "❌ FAIL: Profile Type Shop/Office/Department missing - See Spec v22-A" && exit 1)
          grep -q "Shop.*Office.*Department\|Office.*Department" www/index.html || (echo "❌ FAIL: Universal Profile Types Shop/Office/Department missing - See Spec v22-A" && exit 1)
          grep -q "WanaLab.*Watermark\|Made By WanaLab" www/index.html || (echo "❌ FAIL: WanaLab Watermark missing for FREE - See Spec v22" && exit 1)
          grep -q "GPS Timestamp" www/index.html || (echo "❌ FAIL: GPS Timestamp missing - See Spec v23" && exit 1)
          grep -q "GPS Share\|gpsShare" www/index.html || (echo "❌ FAIL: GPS Share missing - See Spec v23-A" && exit 1)
          grep -q "isFromMockProvider\|Anti-Fake GPS" www/index.html || (echo "❌ FAIL: Anti-Fake GPS missing - See Spec v23-B" && exit 1)
          grep -q "maps.google.com" www/index.html || (echo "❌ FAIL: Map Link missing for GPS Share - See Spec v23-A" && exit 1)
          grep -q "v2.2" www/index.html || (echo "❌ FAIL: Version v2.2 missing in www/index.html - Update version" && exit 1)
          grep -q "\.\./shop.html\|\.\./export.html" www/index.html || (echo "❌ FAIL: www/index.html links must be ../shop.html / ../export.html - Not shop.html alone - See Structure: index in www/, shop/export in ROOT" && exit 1)
          if grep -q "SHOP PRO" www/index.html; then echo "❌ FAIL: Old SHOP PRO Rs. 5,000 still in HTML - Delete it - See Spec v8" && exit 1; fi
          if grep -q "HARDWARE BUNDLE" www/index.html; then echo "❌ FAIL: Old HARDWARE BUNDLE still in HTML - Delete it" && exit 1; fi
          if grep -q "Simulated" www/index.html; then echo "❌ FAIL: 'Simulated' Thermal still in HTML - Delete it - See Spec v19" && exit 1; fi
          if grep -q "localStorage.clear()" www/index.html; then echo "❌ FAIL: Dangerous localStorage.clear() still in HTML - Delete Clear Data button from Main - See Spec v12" && exit 1; fi
          if grep -q "Browser cannot match faces" www/index.html; then echo "❌ FAIL: Old Face Tag Only text still in HTML - Replace with 468 Dots - See Spec v18" && exit 1; fi
          echo "✅ HTML Spec Check Passed - v4-v23-B - Thumb + Effects + Credentials + GPS + Anti-Fake"

      - name: Check ROOT Files - shop.html + export.html - FAIL if old
        run: |
          echo "Checking ROOT files..."
          if [ -f shop.html ]; then
            grep -q "GPS Timestamp" shop.html || (echo "❌ FAIL: GPS Timestamp missing in shop.html - See Spec v23" && exit 1)
            grep -q "Credentials" shop.html || (echo "❌ FAIL: Credentials missing in shop.html - See Spec v22-A" && exit 1)
            grep -q "Barcode" shop.html || (echo "❌ FAIL: Barcode missing in shop.html" && exit 1)
            grep -q "www/index.html" shop.html || (echo "❌ FAIL: shop.html link must be www/index.html - Not index.html alone - index is in www/" && exit 1)
            grep -q "v2.2" shop.html || (echo "❌ FAIL: Version v2.2 missing in shop.html" && exit 1)
            echo "✅ shop.html Passed"
          else
            echo "⚠️ shop.html not found in ROOT - Skipping Shop check - Commit shop.html in ROOT"
          fi
          if [ -f export.html ]; then
            grep -q "GPS Timestamp" export.html || (echo "❌ FAIL: GPS Timestamp missing in export.html - See Spec v23" && exit 1)
            grep -q "Credentials" export.html || (echo "❌ FAIL: Credentials missing in export.html - See Spec v22-A" && exit 1)
            grep -q "www/index.html" export.html || (echo "❌ FAIL: export.html link must be www/index.html - Not index.html alone" && exit 1)
            grep -q "v2.2" export.html || (echo "❌ FAIL: Version v2.2 missing in export.html" && exit 1)
            echo "✅ export.html Passed"
          else
            echo "⚠️ export.html not found in ROOT - Skipping Export check"
          fi
          if [ -f about.html ]; then
            grep -q "v2.2" about.html || (echo "❌ FAIL: Version v2.2 missing in about.html" && exit 1)
            grep -q "GPS" about.html || (echo "❌ FAIL: GPS missing in about.html - Privacy must mention GPS" && exit 1)
            echo "✅ about.html Passed"
          fi
          if [ -f privacy.html ]; then
            grep -q "v2.2" privacy.html || (echo "❌ FAIL: Version v2.2 missing in privacy.html" && exit 1)
            grep -q "GPS\|Location" privacy.html || (echo "❌ FAIL: GPS / Location missing in privacy.html - Must mention GPS for Play Store" && exit 1)
            grep -q "Thumb" privacy.html || (echo "❌ FAIL: Thumb missing in privacy.html - Must mention Thumb for Play Store" && exit 1)
            echo "✅ privacy.html Passed"
          fi
          echo "✅ ROOT Files Check Passed"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK - Use Preinstalled - NO setup-android Action
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          ls /usr/local/lib/android/sdk/
          echo "✅ Using preinstalled SDK - No obsolete tools package"

      - name: Install Android SDK Platform 35 - Modern Packages Only
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || echo "Licenses accepted"
          yes | sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          ls -lh $ANDROID_HOME/platforms/android-35/android.jar || (echo "❌ android-35 still missing" && exit 1)
          echo "✅ SDK Platform 35 installed"

      # FIXED - Install missing Capacitor plugins BEFORE cap sync - This was the :capacitor-app / :capacitor-status-bar fail
      - name: Install deps + Ensure Capacitor Plugins Exist
        run: |
          npm install
          echo "=== Check package.json for Capacitor plugins ==="
          cat package.json | grep -i capacitor || echo "No capacitor in package.json"
          echo "=== Install missing plugins if not present ==="
          npm list @capacitor/android || npm install @capacitor/android@7 || true
          npm list @capacitor/app || npm install @capacitor/app@7 || true
          npm list @capacitor/haptics || npm install @capacitor/haptics@7 || true
          npm list @capacitor/keyboard || npm install @capacitor/keyboard@7 || true
          npm list @capacitor/status-bar || npm install @capacitor/status-bar@7 || true
          npm list @capacitor/core || npm install @capacitor/core@7 || true
          npm list @capacitor/cli || npm install @capacitor/cli@7 || true
          echo "=== Verify node_modules Capacitor folders ==="
          ls -ld node_modules/@capacitor/android/capacitor || (echo "❌ @capacitor/android missing" && exit 1)
          ls -ld node_modules/@capacitor/app/android || (echo "❌ @capacitor/app missing" && exit 1)
          ls -ld node_modules/@capacitor/haptics/android || (echo "❌ @capacitor/haptics missing" && exit 1)
          ls -ld node_modules/@capacitor/keyboard/android || (echo "❌ @capacitor/keyboard missing" && exit 1)
          ls -ld node_modules/@capacitor/status-bar/android || (echo "❌ @capacitor/status-bar missing" && exit 1)
          echo "✅ All Capacitor plugin folders exist in node_modules"

      - name: Fix Android Project - Backup, Recreate Valid, Restore
        run: |
          rm -rf /tmp/godeye-backup
          mkdir -p /tmp/godeye-backup
          if [ -f android/app/src/main/AndroidManifest.xml ]; then cp android/app/src/main/AndroidManifest.xml /tmp/godeye-backup/AndroidManifest.xml && echo "✅ Backed up AndroidManifest.xml"; fi
          if [ -d android/app/src/main/java ]; then cp -r android/app/src/main/java /tmp/godeye-backup/java && echo "✅ Backed up java/"; fi
          if [ -d android/app/src/main/res ]; then cp -r android/app/src/main/res /tmp/godeye-backup/res && echo "✅ Backed up res/"; fi
          if [ -f android/app/build.gradle.kts ]; then cp android/app/build.gradle.kts /tmp/godeye-backup/app-build.gradle.kts && echo "✅ Backed up app/build.gradle.kts"; fi
          if [ -f android/app/build.gradle ]; then cp android/app/build.gradle /tmp/godeye-backup/app-build.gradle && echo "✅ Backed up app/build.gradle"; fi
          NEED_RECREATE=0
          if [ ! -f android/gradlew ]; then echo "❌ gradlew missing -> need recreate"; NEED_RECREATE=1; fi
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then echo "❌ settings.gradle missing -> need recreate"; NEED_RECREATE=1; fi
          if [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then echo "❌ gradle-wrapper.properties missing -> need recreate"; NEED_RECREATE=1; fi
          if [ "$NEED_RECREATE" = "1" ]; then
            echo "Recreating VALID android/ with Capacitor"
            rm -rf android
            npx cap add android
            echo "✅ Recreated android/"
          else
            echo "✅ android/ looks valid - keeping it"
          fi
          if [ -f /tmp/godeye-backup/AndroidManifest.xml ]; then cp /tmp/godeye-backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml && echo "✅ Restored AndroidManifest.xml"; fi
          if [ -d /tmp/godeye-backup/java ]; then mkdir -p android/app/src/main/java; cp -r /tmp/godeye-backup/java/* android/app/src/main/java/ && echo "✅ Restored java/"; fi
          if [ -d /tmp/godeye-backup/res ]; then cp -r /tmp/godeye-backup/res/* android/app/src/main/res/ 2>/dev/null || true; echo "✅ Restored res/"; fi
          if [ -f /tmp/godeye-backup/app-build.gradle.kts ]; then cp /tmp/godeye-backup/app-build.gradle.kts android/app/build.gradle.kts && echo "✅ Restored app/build.gradle.kts"; fi
          if [ -f /tmp/godeye-backup/app-build.gradle ]; then cp /tmp/godeye-backup/app-build.gradle android/app/build.gradle && echo "✅ Restored app/build.gradle"; fi
          ls -lh android/gradlew || (echo "❌ STILL NO gradlew" && exit 1)
          chmod +x android/gradlew
          echo "✅ Android project is now VALID"

      # FIXED - Dynamic Settings + App Build - Only include Capacitor plugins that EXIST
      - name: Fix All 3 Build Files - Dynamic Capacitor - Only Existing Plugins
        run: |
          echo "=== FILE 1 - ROOT android/build.gradle - NO allprojects ==="
          cat > android/build.gradle <<'EOF'
          // WanaLab God Eye v2.2 - build.gradle (ROOT) - FIXED Line 16
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.2'
                  classpath 'com.google.gms:google-services:4.4.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0"
              }
          }
          // NO allprojects block - DO NOT ADD IT BACK
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          rm -f android/build.gradle.kts
          echo "✅ FILE 1 - ROOT fixed"
          echo "=== FILE 2 - SETTINGS - DYNAMIC - Only plugins that exist in node_modules ==="
          {
            echo '// WanaLab God Eye v2.2 - settings.gradle.kts - DYNAMIC'
            echo '// FIX: Only include Capacitor plugins that EXIST - Prevents :capacitor-app / :capacitor-status-bar resolve fail'
            echo 'pluginManagement {'
            echo '    repositories { google(); mavenCentral(); gradlePluginPortal() }'
            echo '    plugins {'
            echo '        id("com.android.application") version "8.5.2" apply false'
            echo '        id("org.jetbrains.kotlin.android") version "2.0.0" apply false'
            echo '        id("com.google.devtools.ksp") version "2.0.0-1.0.24" apply false'
            echo '    }'
            echo '}'
            echo 'dependencyResolutionManagement {'
            echo '    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)'
            echo '    repositories { google(); mavenCentral() }'
            echo '}'
            echo 'rootProject.name = "android"'
            echo 'include(":app")'
            if [ -d "../node_modules/@capacitor/android/capacitor" ] || [ -d "node_modules/@capacitor/android/capacitor" ]; then echo 'include(":capacitor-android")'; echo 'project(":capacitor-android").projectDir = File("../node_modules/@capacitor/android/capacitor")'; echo "✅ Included capacitor-android"; else echo "// capacitor-android missing - skipped"; echo "⚠️ capacitor-android missing"; fi
            if [ -d "../node_modules/@capacitor/app/android" ] || [ -d "node_modules/@capacitor/app/android" ]; then echo 'include(":capacitor-app")'; echo 'project(":capacitor-app").projectDir = File("../node_modules/@capacitor/app/android")'; echo "✅ Included capacitor-app"; else echo "// capacitor-app missing - skipped"; echo "⚠️ capacitor-app missing - skipped"; fi
            if [ -d "../node_modules/@capacitor/haptics/android" ] || [ -d "node_modules/@capacitor/haptics/android" ]; then echo 'include(":capacitor-haptics")'; echo 'project(":capacitor-haptics").projectDir = File("../node_modules/@capacitor/haptics/android")'; echo "✅ Included capacitor-haptics"; else echo "// capacitor-haptics missing - skipped"; fi
            if [ -d "../node_modules/@capacitor/keyboard/android" ] || [ -d "node_modules/@capacitor/keyboard/android" ]; then echo 'include(":capacitor-keyboard")'; echo 'project(":capacitor-keyboard").projectDir = File("../node_modules/@capacitor/keyboard/android")'; echo "✅ Included capacitor-keyboard"; else echo "// capacitor-keyboard missing - skipped"; fi
            if [ -d "../node_modules/@capacitor/status-bar/android" ] || [ -d "node_modules/@capacitor/status-bar/android" ]; then echo 'include(":capacitor-status-bar")'; echo 'project(":capacitor-status-bar").projectDir = File("../node_modules/@capacitor/status-bar/android")'; echo "✅ Included capacitor-status-bar"; else echo "// capacitor-status-bar missing - skipped"; echo "⚠️ capacitor-status-bar missing - skipped"; fi
          } > android/settings.gradle.kts
          rm -f android/settings.gradle
          echo "✅ FILE 2 - settings DYNAMIC fixed"
          cat android/settings.gradle.kts
          echo "=== FILE 3 - APP - DYNAMIC - Only implementation() for existing plugins ==="
          {
            echo '// WanaLab God Eye v2.2 - build.gradle.kts (app) - DYNAMIC Capacitor'
            echo 'plugins { id("com.android.application"); id("org.jetbrains.kotlin.android"); id("com.google.devtools.ksp") version "2.0.0-1.0.24" }'
            echo 'android {'
            echo '    namespace = "com.wanalab.godeye"'
            echo '    compileSdk = 35'
            echo '    defaultConfig { applicationId = "com.wanalab.godeye"; minSdk = 24; targetSdk = 35; versionCode = 22; versionName = "2.2"; testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner" }'
            echo '    buildTypes { release { isMinifyEnabled = false; proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro") } }'
            echo '    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }'
            echo '    kotlinOptions { jvmTarget = "17" }'
            echo '    buildFeatures { viewBinding = true }'
            echo '}'
            echo 'dependencies {'
            echo '    implementation("androidx.core:core-ktx:1.13.1")'
            echo '    implementation("androidx.appcompat:appcompat:1.7.0")'
            echo '    implementation("com.google.android.material:material:1.12.0")'
            echo '    implementation("androidx.constraintlayout:constraintlayout:2.1.4")'
            echo '    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")'
            echo '    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.6.2")'
            echo '    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2")'
            echo '    implementation("androidx.camera:camera-core:1.3.4")'
            echo '    implementation("androidx.camera:camera-camera2:1.3.4")'
            echo '    implementation("androidx.camera:camera-lifecycle:1.3.4")'
            echo '    implementation("androidx.camera:camera-view:1.3.4")'
            echo '    implementation("androidx.media3:media3-exoplayer:1.4.1")'
            echo '    implementation("androidx.media3:media3-ui:1.4.1")'
            echo '    implementation("androidx.media3:media3-exoplayer-rtsp:1.4.1")'
            echo '    implementation("androidx.media3:media3-exoplayer-rtmp:1.4.1")'
            echo '    implementation("androidx.media3:media3-exoplayer-hls:1.4.1")'
            echo '    implementation("androidx.media3:media3-exoplayer-dash:1.4.1")'
            echo '    implementation("org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5")'
            echo '    implementation("org.java-websocket:Java-WebSocket:1.5.6")'
            echo '    implementation("com.google.mlkit:barcode-scanning:17.3.0")'
            echo '    implementation("com.journeyapps:zxing-android-embedded:4.3.0")'
            echo '    implementation("com.google.mediapipe:tasks-vision:0.10.14")'
            echo '    implementation("org.tensorflow:tensorflow-lite:2.14.0")'
            echo '    implementation("com.google.mlkit:face-detection:16.1.7")'
            echo '    implementation("com.rmtheis:tess-two:9.1.0")'
            echo '    implementation("com.itextpdf:itext7-core:8.0.5")'
            echo '    implementation("org.apache.poi:poi:5.2.5")'
            echo '    implementation("org.apache.poi:poi-ooxml:5.2.5")'
            echo '    implementation("androidx.room:room-runtime:2.6.1")'
            echo '    implementation("androidx.room:room-ktx:2.6.1")'
            echo '    ksp("androidx.room:room-compiler:2.6.1")'
            echo '    implementation("androidx.datastore:datastore-preferences:1.1.1")'
            echo '    implementation("androidx.work:work-runtime-ktx:2.9.0")'
            if [ -d "node_modules/@capacitor/android/capacitor" ]; then echo '    implementation(project(":capacitor-android"))'; echo "✅ Added capacitor-android dep"; fi
            if [ -d "node_modules/@capacitor/app/android" ]; then echo '    implementation(project(":capacitor-app"))'; echo "✅ Added capacitor-app dep"; fi
            if [ -d "node_modules/@capacitor/haptics/android" ]; then echo '    implementation(project(":capacitor-haptics"))'; echo "✅ Added capacitor-haptics dep"; fi
            if [ -d "node_modules/@capacitor/keyboard/android" ]; then echo '    implementation(project(":capacitor-keyboard"))'; echo "✅ Added capacitor-keyboard dep"; fi
            if [ -d "node_modules/@capacitor/status-bar/android" ]; then echo '    implementation(project(":capacitor-status-bar"))'; echo "✅ Added capacitor-status-bar dep"; fi
            echo '    testImplementation("junit:junit:4.13.2")'
            echo '    androidTestImplementation("androidx.test.ext:junit:1.1.5")'
            echo '    androidTestImplementation("androidx.test.espresso:espresso-core:3.5.1")'
            echo '}'
          } > android/app/build.gradle.kts
          rm -f android/app/build.gradle
          echo "✅ FILE 3 - app DYNAMIC fixed"
          cat android/app/build.gradle.kts
          echo "=== variables.gradle ==="
          if [ ! -f android/variables.gradle ]; then
            cat > android/variables.gradle <<'EOF'
          ext {
              minSdkVersion = 26
              compileSdkVersion = 35
              targetSdkVersion = 35
              androidxActivityVersion = '1.9.0'
              androidxAppCompatVersion = '1.7.0'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.13.1'
              androidxFragmentVersion = '1.8.2'
              androidxMaterialVersion = '1.12.0'
              androidxWebkitVersion = '1.12.1'
              coreSplashScreenVersion = '1.0.1'
              firebaseMessagingVersion = '23.4.0'
              playServicesLocationVersion = '21.3.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.2.1'
              androidxEspressoCoreVersion = '3.6.1'
              cordovaAndroidVersion = '10.1.1'
          }
          EOF
            echo "✅ Created variables.gradle"
          fi
          echo "✅ ALL 3 FILES FIXED - DYNAMIC"

      - name: Generate Icons & Splash - Keep WanaLab if exists
        run: |
          npm install -D @capacitor/assets
          if [ -f assets/icon.png ]; then echo "✅ Using existing WanaLab icon - Not overwriting"; else npx @capacitor/assets generate --iconBackgroundColor '#0B0E11' --splashBackgroundColor '#0B0E11' || echo "Icon generate skipped"; fi

      - name: Sync web assets - FIXED Check + Verify Capacitor Projects Resolve
        run: |
          npx cap sync android
          echo "=== FIXED Validation ==="
          test -d android/app && echo "✅ android/app exists" || (echo "❌ android/app missing" && exit 1)
          test -f android/gradlew && echo "✅ android/gradlew exists" || (echo "❌ android/gradlew missing" && exit 1)
          test -f android/settings.gradle.kts && echo "✅ android/settings.gradle.kts exists" || (echo "❌ settings missing" && exit 1)
          echo "=== Verify each included projectDir actually exists ==="
          grep "projectDir" android/settings.gradle.kts || echo "No projectDir lines"
          echo "=== Check node_modules Capacitor ==="
          ls -ld node_modules/@capacitor/android/capacitor node_modules/@capacitor/app/android node_modules/@capacitor/status-bar/android || echo "Check above - One missing will be skipped by DYNAMIC logic"
          echo "✅ Capacitor Sync Passed"

      - name: Verify Native Files - WARNING ONLY
        run: |
          ls android/app/src/main/AndroidManifest.xml || echo "⚠️ WARNING: Manifest missing"
          if grep -q "CameraActivity" android/app/src/main/AndroidManifest.xml; then echo "✅ CameraActivity in Manifest"; else echo "⚠️ WARNING: CameraActivity missing - Commit android/ folder from PC"; fi
          echo "✅ Verify done"

      - name: Fix Permissions - Camera + Mic + Bluetooth + USB + Storage + Network + GPS Location
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/CAMERA/d' $MANIFEST
          sed -i '/RECORD_AUDIO/d' $MANIFEST
          sed -i '/MODIFY_AUDIO_SETTINGS/d' $MANIFEST
          sed -i '/BLUETOOTH/d' $MANIFEST
          sed -i '/USB/d' $MANIFEST
          sed -i '/EXTERNAL_STORAGE/d' $MANIFEST
          sed -i '/READ_MEDIA/d' $MANIFEST
          sed -i '/INTERNET/d' $MANIFEST
          sed -i '/ACCESS_NETWORK_STATE/d' $MANIFEST
          sed -i '/FOREGROUND_SERVICE/d' $MANIFEST
          sed -i '/ACCESS_FINE_LOCATION/d' $MANIFEST
          sed -i '/ACCESS_COARSE_LOCATION/d' $MANIFEST
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_LOCATION_EXTRA_COMMANDS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.flash" android:required="false" />\n    <uses-feature android:name="android.hardware.bluetooth" android:required="false" />\n    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <application|' $MANIFEST
          grep -i "CAMERA\|RECORD_AUDIO\|BLUETOOTH\|USB\|EXTERNAL_STORAGE\|READ_MEDIA\|INTERNET\|FOREGROUND\|LOCATION" $MANIFEST || echo "Permission check failed"

      - name: Force Gradle 8.7 - AGP 8.5.2 needs Gradle 8.7, NOT 8.14
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "✅ Gradle forced to 8.7"

      - name: Ensure Gradle Wrapper Exists
        run: |
          ls -lh android/gradlew
          ls -lh android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew

      # NEW - After cap sync, re-apply DYNAMIC settings - cap sync overwrites settings!
      - name: Re-apply Dynamic Settings AFTER cap sync - cap sync overwrites settings.gradle.kts
        run: |
          echo "=== cap sync may have overwritten settings - Re-applying DYNAMIC fix ==="
          cat android/settings.gradle.kts
          echo "--- Checking if cap sync broke KSP / PREFER_SETTINGS ---"
          if ! grep -q "com.google.devtools.ksp" android/settings.gradle.kts; then
            echo "⚠️ cap sync removed KSP from settings - Re-adding pluginManagement"
            {
              echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } plugins { id("com.android.application") version "8.5.2" apply false; id("org.jetbrains.kotlin.android") version "2.0.0" apply false; id("com.google.devtools.ksp") version "2.0.0-1.0.24" apply false } }'
              cat android/settings.gradle.kts
            } > /tmp/new-settings.kts
            cp /tmp/new-settings.kts android/settings.gradle.kts
            echo "✅ Re-added KSP pluginManagement"
          fi
          if grep -q "FAIL_ON_PROJECT_REPOS" android/settings.gradle.kts; then
            sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_SETTINGS/g' android/settings.gradle.kts
            echo "✅ Fixed FAIL_ON_PROJECT_REPOS -> PREFER_SETTINGS"
          fi
          echo "=== Final settings ==="
          cat android/settings.gradle.kts
          echo "=== Final app build - check Capacitor deps ==="
          cat android/app/build.gradle.kts | grep -i capacitor || echo "No capacitor deps in app build - Will re-add if needed"
          # If cap sync removed capacitor deps from app build, re-add only existing ones
          if ! grep -q "capacitor-android" android/app/build.gradle.kts; then
            echo "⚠️ cap sync removed capacitor deps - Re-adding existing ones"
            # Insert before closing } of dependencies - simple append before last }
            # Backup and use python to insert safely
            python3 -c "
          import pathlib
          p = pathlib.Path('android/app/build.gradle.kts')
          t = p.read_text()
          import os
          adds = []
          if os.path.isdir('node_modules/@capacitor/android/capacitor'): adds.append('    implementation(project(\":capacitor-android\"))')
          if os.path.isdir('node_modules/@capacitor/app/android'): adds.append('    implementation(project(\":capacitor-app\"))')
          if os.path.isdir('node_modules/@capacitor/haptics/android'): adds.append('    implementation(project(\":capacitor-haptics\"))')
          if os.path.isdir('node_modules/@capacitor/keyboard/android'): adds.append('    implementation(project(\":capacitor-keyboard\"))')
          if os.path.isdir('node_modules/@capacitor/status-bar/android'): adds.append('    implementation(project(\":capacitor-status-bar\"))')
          if adds:
              # Insert before last closing brace of dependencies - find last '}' 
              idx = t.rfind('}')
              t = t[:idx] + '\n' + '\n'.join(adds) + '\n' + t[idx:]
              p.write_text(t)
              print('Added:', adds)
          "
            echo "✅ Re-added Capacitor deps"
          fi
          cat android/app/build.gradle.kts

      - name: Check Dependencies - Show exact unresolved dep
        run: |
          cd android
          ./gradlew :app:dependencies --configuration debugCompileClasspath --info 2>&1 | tail -n 100 || echo "Dependencies check done"
        continue-on-error: true

      - name: Build APK - Debug for Testing
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --info --stacktrace 2>&1 | tee /tmp/build.log; EXIT_CODE=${PIPESTATUS[0]}; if [ $EXIT_CODE -ne 0 ]; then echo "=== FULL ERROR - Last 200 lines ==="; tail -n 200 /tmp/build.log; echo "=== Search for FAILED / error: ==="; grep -i "error:\|FAILED\|Could not\|Unresolved\|missing" /tmp/build.log | head -n 100; exit $EXIT_CODE; fi

      - name: Build AAB - Debug for Play Store Test
        run: |
          cd android
          ./gradlew bundleDebug --stacktrace

      - name: Build AAB - Release if Keystore Exists
        run: |
          cd android
          if [ -f app/release.keystore ] || [ -n "$ANDROID_KEYSTORE" ]; then echo "Keystore found - Building Release AAB"; ./gradlew bundleRelease --stacktrace; else echo "⚠️ No keystore - Skipping Release AAB"; fi
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodEye-APK-v2.2
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: GodEye-AAB-v2.2
          path: android/app/build/outputs/bundle/debug/app-debug.aab

