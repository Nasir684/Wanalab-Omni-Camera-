name: Build GodEye APK + AAB - v2.2
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Node deps
        run: npm install
      - run: npm run build
      - run: npx cap sync android
      - name: Clean ALL bad resources - FIXES mergeDebugResources
        run: |
          rm -f android/app/src/main/res/xml/config.xml
          rm -rf android/app/src/main/java/com/wanalab/omnicamera
          rm -rf android/app/src/main/res/values/mipmap-anydpi-v26
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/values/ic_launcher_*.xml
          find android/app/src/main/res -name ".DS_Store" -delete || true
          rm -rf android/app/src/main/res/drawable-v24 || true
          mkdir -p android/app/src/main/java/com/wanalab/godeye
          cat > android/app/src/main/java/com/wanalab/godeye/MainActivity.java <<'EOF'
          package com.wanalab.godeye;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {}
          EOF
          echo "✅ Cleaned"
          find android/app/src/main/res -type f | sort || true
      - name: Create proper launcher icons
        run: |
          pip3 install Pillow --break-system-packages -q
          python3 <<'PYEOF'
          import os
          from PIL import Image
          for d, size in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
              p = f'android/app/src/main/res/{d}'
              os.makedirs(p, exist_ok=True)
              img = Image.new('RGB', (size, size), color=(37, 99, 235))
              img.save(f'{p}/ic_launcher.png')
              img.save(f'{p}/ic_launcher_round.png')
          print('✅ Icons created')
          PYEOF
          ls android/app/src/main/res/ | grep mipmap || true
      - name: Generate gradlew if missing
        run: |
          if [ -f android/gradlew ]; then chmod +x android/gradlew; exit 0; fi
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          /tmp/gradle-8.11.1/bin/gradle -p $GITHUB_WORKSPACE/android wrapper --gradle-version 8.11.1
          chmod +x $GITHUB_WORKSPACE/android/gradlew
      - name: Build APK + AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GodEye-APK-v2.2
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GodEye-AAB-v2.2
          path: android/app/build/outputs/bundle/debug/*.aab
