name: Build GodEye APK + AAB - v2.2
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Node deps
        run: npm install
      - run: npm run build
      - run: npx cap sync android
      - name: DEBUG - Show what files we actually have
        run: |
          echo "=== WORKFLOWS ==="
          ls -R .github/workflows/
          echo "=== MANIFEST SOURCE ==="
          cat android/app/src/main/AndroidManifest.xml
          echo "=== ALL MANIFESTS ==="
          find android -name "AndroidManifest.xml" | xargs grep -l "title_activity_main" || echo "No manifest has title_activity_main"
          echo "=== STRINGS ==="
          cat android/app/src/main/res/values/strings.xml || echo "NO STRINGS FILE"
      - name: FIX - Inject string via build.gradle + Manifest - CANNOT FAIL
        run: |
          python3 <<'PYEOF'
          import re
          # 1. Fix Manifest - replace reference with plain text
          mp = 'android/app/src/main/AndroidManifest.xml'
          t = open(mp).read()
          t = t.replace('@string/title_activity_main', 'GodEye')
          t = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', t)
          t = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"', t)
          open(mp,'w').write(t)
          print("Manifest fixed, title_activity_main left?", 'title_activity_main' in open(mp).read())
          # 2. Inject via build.gradle - this creates the string at build time even if res/ is wiped
          bg = 'android/app/build.gradle'
          g = open(bg).read()
          print("=== BUILD.GRADLE BEFORE ===")
          print(g)
          if 'title_activity_main' not in g:
              # Insert resValue inside defaultConfig { ... }
              g = g.replace('defaultConfig {', 'defaultConfig {\n        resValue "string", "title_activity_main", "GodEye"\n        resValue "string", "app_name", "GodEye"')
          open(bg,'w').write(g)
          print("=== BUILD.GRADLE AFTER ===")
          print(open(bg).read())
          # 3. Also create strings.xml
          import os
          os.makedirs('android/app/src/main/res/values', exist_ok=True)
          open('android/app/src/main/res/values/strings.xml','w').write('<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">GodEye</string><string name="title_activity_main">GodEye</string></resources>')
          print("strings.xml written")
          PYEOF
          echo "=== VERIFY - If this still shows title_activity_main, fix did NOT run ==="
          grep -r "title_activity_main" android/app/src/main/AndroidManifest.xml || echo "✅ GOOD - No reference left in Manifest"
          grep -r "title_activity_main" android/app/build.gradle || echo "❌ BAD - build.gradle injection missing"
          cat android/app/src/main/res/values/strings.xml
      - name: Clean bad resources + MainActivity + Colors + Styles
        run: |
          rm -f android/app/src/main/res/xml/config.xml
          rm -rf android/app/src/main/java/com/wanalab/omnicamera
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/values/ic_launcher_*.xml
          mkdir -p android/app/src/main/java/com/wanalab/godeye
          cat > android/app/src/main/java/com/wanalab/godeye/MainActivity.java <<'EOF'
          package com.wanalab.godeye;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {}
          EOF
          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="colorPrimary">#2563EB</color><color name="colorPrimaryDark">#1E40AF</color><color name="colorAccent">#2563EB</color></resources>
          EOF
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar"><item name="colorPrimary">@color/colorPrimary</item><item name="colorPrimaryDark">@color/colorPrimaryDark</item><item name="colorAccent">@color/colorAccent</item></style>
            <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar"><item name="colorPrimary">@color/colorPrimary</item><item name="colorPrimaryDark">@color/colorPrimaryDark</item><item name="colorAccent">@color/colorAccent</item></style>
          </resources>
          EOF
          cat > android/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths><files-path name="files" path="." /><cache-path name="cache" path="." /><external-path name="external" path="." /></paths>
          EOF
      - name: Create proper launcher icons
        run: |
          pip3 install Pillow --break-system-packages -q
          python3 <<'PYEOF'
          import os
          from PIL import Image
          for d, size in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
              p = f'android/app/src/main/res/{d}'
              os.makedirs(p, exist_ok=True)
              img = Image.new('RGB', (size, size), color=(37, 99, 235))
              img.save(f'{p}/ic_launcher.png')
              img.save(f'{p}/ic_launcher_round.png')
          print('✅ Icons created')
          PYEOF
      - name: Generate gradlew if missing
        run: |
          if [ -f android/gradlew ]; then chmod +x android/gradlew; exit 0; fi
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          /tmp/gradle-8.11.1/bin/gradle -p $GITHUB_WORKSPACE/android wrapper --gradle-version 8.11.1
          chmod +x $GITHUB_WORKSPACE/android/gradlew
      - name: Build APK + AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GodEye-APK-v2.2
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GodEye-AAB-v2.2
          path: android/app/build/outputs/bundle/debug/*.aab
