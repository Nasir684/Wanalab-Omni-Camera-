name: Build GodEye APK + AAB - v2.2
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Node deps
        run: npm install
      - run: npm run build
      - run: npx cap sync android
      - name: FIX - All missing resources - Styles + Strings + Colors
        run: |
          python3 <<'PYEOF'
          import re, os
          from pathlib import Path
          base = Path('android/app/src/main/res')
          base.joinpath('values').mkdir(parents=True, exist_ok=True)
          base.joinpath('xml').mkdir(parents=True, exist_ok=True)
          # 1. Write COMPLETE styles.xml - includes the missing one
          (base/'values/styles.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
              <item name="colorPrimary">@color/colorPrimary</item>
              <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
              <item name="colorAccent">@color/colorAccent</item>
            </style>
            <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
              <item name="colorPrimary">@color/colorPrimary</item>
              <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
              <item name="colorAccent">@color/colorAccent</item>
            </style>
            <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.Light.NoActionBar">
              <item name="colorPrimary">@color/colorPrimary</item>
              <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
              <item name="colorAccent">@color/colorAccent</item>
              <item name="android:windowBackground">@color/colorPrimary</item>
            </style>
            <style name="AppTheme.NoActionBarLaunchSplash" parent="AppTheme.NoActionBarLaunch" />
            <style name="LaunchTheme" parent="AppTheme.NoActionBarLaunch" />
            <style name="SplashTheme" parent="AppTheme.NoActionBarLaunch" />
          </resources>
          ''')
          # 2. Strings
          (base/'values/strings.xml').write_text('<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">GodEye</string><string name="title_activity_main">GodEye</string><string name="action_settings">Settings</string><string name="hello_world">Hello World!</string></resources>')
          # 3. Colors
          (base/'values/colors.xml').write_text('<?xml version="1.0" encoding="utf-8"?><resources><color name="colorPrimary">#2563EB</color><color name="colorPrimaryDark">#1E40AF</color><color name="colorAccent">#2563EB</color><color name="colorPrimaryVariant">#1E40AF</color><color name="colorOnPrimary">#FFFFFF</color></resources>')
          # 4. file_paths
          (base/'xml/file_paths.xml').write_text('<?xml version="1.0" encoding="utf-8"?><paths><files-path name="files" path="." /><cache-path name="cache" path="." /><external-path name="external" path="." /></paths>')
          (base/'xml/data_extraction_rules.xml').write_text('<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup><exclude domain="root" path="." /></cloud-backup><device-transfer><exclude domain="root" path="." /></device-transfer></data-extraction-rules>')
          # 5. AUTO-FIX: Scan Manifest for ANY @style / @string / @color / @drawable / @xml / @layout and create if missing
          manifest = open('android/app/src/main/AndroidManifest.xml').read()
          print("MANIFEST:")
          print(manifest)
          # Fix known bad refs first
          manifest = manifest.replace('@string/title_activity_main', 'GodEye')
          open('android/app/src/main/AndroidManifest.xml','w').write(manifest)
          refs = set(re.findall(r'@([a-z]+)/([A-Za-z0-9_\.]+)', manifest))
          print(f"Refs found: {refs}")
          for typ, name in refs:
              if typ == 'style':
                  t = (base/'values/styles.xml').read_text()
                  if f'name="{name}"' not in t:
                      t = t.replace('</resources>', f'  <style name="{name}" parent="AppTheme.NoActionBarLaunch" />\n</resources>')
                      (base/'values/styles.xml').write_text(t)
                      print(f"✅ Auto-added style {name}")
              elif typ == 'string':
                  t = (base/'values/strings.xml').read_text()
                  if f'name="{name}"' not in t:
                      t = t.replace('</resources>', f'    <string name="{name}">GodEye</string>\n</resources>')
                      (base/'values/strings.xml').write_text(t)
                      print(f"✅ Auto-added string {name}")
              elif typ == 'color':
                  t = (base/'values/colors.xml').read_text()
                  if f'name="{name}"' not in t:
                      t = t.replace('</resources>', f'<color name="{name}">#2563EB</color></resources>')
                      (base/'values/colors.xml').write_text(t)
                      print(f"✅ Auto-added color {name}")
          print("=== FINAL styles.xml ===")
          print((base/'values/styles.xml').read_text())
          PYEOF
          # MainActivity + clean
          rm -f android/app/src/main/res/xml/config.xml
          rm -rf android/app/src/main/java/com/wanalab/omnicamera
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/values/ic_launcher_*.xml
          mkdir -p android/app/src/main/java/com/wanalab/godeye
          cat > android/app/src/main/java/com/wanalab/godeye/MainActivity.java <<'EOF'
          package com.wanalab.godeye;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {}
          EOF
      - name: Create proper launcher icons
        run: |
          pip3 install Pillow --break-system-packages -q
          python3 <<'PYEOF'
          import os
          from PIL import Image
          for d, size in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
              p = f'android/app/src/main/res/{d}'
              os.makedirs(p, exist_ok=True)
              img = Image.new('RGB', (size, size), color=(37, 99, 235))
              img.save(f'{p}/ic_launcher.png')
              img.save(f'{p}/ic_launcher_round.png')
          print('✅ Icons created')
          PYEOF
          python3 <<'PYEOF'
          import re
          t = open('android/app/src/main/AndroidManifest.xml').read()
          t = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', t)
          t = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"', t)
          open('android/app/src/main/AndroidManifest.xml','w').write(t)
          PYEOF
      - name: Generate gradlew if missing
        run: |
          if [ -f android/gradlew ]; then chmod +x android/gradlew; exit 0; fi
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          /tmp/gradle-8.11.1/bin/gradle -p $GITHUB_WORKSPACE/android wrapper --gradle-version 8.11.1
          chmod +x $GITHUB_WORKSPACE/android/gradlew
      - name: Build APK + AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GodEye-APK-v2.2
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GodEye-AAB-v2.2
          path: android/app/build/outputs/bundle/debug/*.aab
