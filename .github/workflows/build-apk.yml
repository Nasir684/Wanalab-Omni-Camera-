name: Build God Eye APK v99.4 PRO FINAL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v99.4 PRO
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17 for Bubblewrap
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Killer - Force v99.4
        run: |
          echo "WanaLab God Eye v99.4 PRO FINAL - $(date)"
          echo "Manifest: https://nasir684.github.io/Wanalab-Omni-Camera-/manifest.json?v=994"
          rm -rf ./app || true

      - name: Install Bubblewrap CLI Latest
        run: npm install -g @bubblewrap/cli

      - name: Init TWA v99.4 PRO
        run: |
          bubblewrap init --manifest https://nasir684.github.io/Wanalab-Omni-Camera-/manifest.json?v=994 --directory ./app -- --packageId=com.wanalab.godeye994 --name="God Eye v99.4 PRO" --launcherName="God Eye PRO" --themeColor="#00ff88" --backgroundColor="#000000" --startUrl="/?v=19&force=99&v=994" --display=standalone --enableNotifications --shortcuts --enableSiteSettingsShortcut

      - name: Build APK v99.4 PRO
        run: |
          cd app
          bubblewrap build --skipPwaValidation

      - name: Upload APK v99.4 PRO FINAL
        uses: actions/upload-artifact@v4
        with:
          name: GodEye-v99.4-PRO-FINAL-APK
          path: |
            app/build/outputs/**/*.apk
            app/build/outputs/**/*.aab
            app/app/build/outputs/**/*.apk
          if-no-files-found: warn

      - name: Summary v99.4 PRO
        run: |
          echo "### ✅ God Eye v99.4 PRO FINAL Built" >> $GITHUB_STEP_SUMMARY
          echo "- All 5 Devices Active" >> $GITHUB_STEP_SUMMARY
          echo "- All 13 Buttons Working" >> $GITHUB_STEP_SUMMARY
          echo "- All Protocols Positioned" >> $GITHUB_STEP_SUMMARY
          echo "- Live: https://nasir684.github.io/Wanalab-Omni-Camera-/?v=19&force=99&v=994" >> $GITHUB_STEP_SUMMARY
