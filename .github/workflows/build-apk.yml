name: Build God Eye APK v1.6.9

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Web Deps
        run: npm ci || npm install

      - name: Build Web
        run: npm run build || echo "No build script - using www/"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        # FIX: Do NOT request 'tools' - deleted in SDK 16.0
        # Only request supported packages
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: 25.2.9519653
          cmake: 3.22.1

      - name: Accept Licenses + Install SDK Packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Sync Capacitor
        run: npx cap sync android || echo "Cap sync skipped"

      - name: Build APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: God-Eye-v1.6.9-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
