      - name: DIAGNOSE - Print all files
        run: |
          echo "=== JAVA ==="
          find android/app/src/main/java -type f | sort
          echo "=== RES VALUES ==="
          ls -R android/app/src/main/res/values/
          echo "=== RES XML ==="
          ls -R android/app/src/main/res/xml/
          echo "=== RES MIPMAP ==="
          ls android/app/src/main/res/ | grep mipmap
          echo "=== MainActivity ==="
          cat android/app/src/main/java/com/wanalab/godeye/MainActivity.java || echo "MISSING!"
          echo "=== Namespace ==="
          grep -n "namespace\|applicationId" android/app/build.gradle
          echo "=== WWW ==="
          ls -l www/ | head -20
          ls www/index.html || echo "NO INDEX.HTML - THIS IS CRASH!"
