name: Build God Eye APK v1.6.9

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Capacitor + Sync
        run: |
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android || true
          npx cap sync android || true

      - name: Make Icons From Your PNG v1.6.9
        run: |
          python3 -c "
          from PIL import Image
          import os
          src = 'wanalab-god-eye-v1-1-icon.png'
          img = Image.open(src).convert('RGBA')
          img2 = img.resize((432, 432), Image.LANCZOS)
          for d in ['mipmap-mdpi','mipmap-hdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']:
              p = f'android/app/src/main/res/{d}'
              os.makedirs(p, exist_ok=True)
              img2.save(f'{p}/ic_launcher_foreground.png')
              img2.save(f'{p}/ic_launcher.png')
              img2.save(f'{p}/ic_launcher_round.png')
          print('Icons done - God Eye 432x432')
          "

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK - v1.6.9
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Rename APK to God Eye v1.6.9
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk God-Eye-v1.6.9-Debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: God-Eye-v1.6.9-APK
          path: God-Eye-v1.6.9-Debug.apk
          retention-days: 30
