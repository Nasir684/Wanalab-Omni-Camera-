name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo files
        run: |
          ls -la
          ls -la www/ || echo "www/ NOT FOUND"
          ls -lh www/index.html || echo "www/index.html MISSING"

      - name: Ensure web assets exist
        run: |
          if [ ! -f www/index.html ]; then
            mkdir -p www
            echo '<html><body><h1>God Eye - Please commit www/index.html</h1></body></html>' > www/index.html
          else
            echo "OK: www/index.html found"
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # CORRECT FOR CAPACITOR 7.4.0 - DO NOT CHANGE TO 21
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install deps
        run: npm install

      - name: Create Android project
        run: |
          if [ -d android ]; then rm -rf android; fi
          npx cap add android
          ls -la android/
          ls -lh android/gradlew

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodEye-v1.6.9-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
