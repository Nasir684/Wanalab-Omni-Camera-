# GodEye v2.2 FINAL - Author: Nasir Khan - Wana, South Waziristan - PRO Rs. 2,500 / Year
name: Build GodEye APK + AAB - v2.2
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Node deps
        run: npm install
      - run: npm run build
      - run: npx cap sync android
      - name: Sync www files - Copy root HTML to www/
        run: |
          for f in shop.html export.html privacy.html about.html; do
            if [ -f "$f" ] && [ ! -f "www/$f" ]; then echo "Copying $f -> www/$f"; cp "$f" "www/$f"; fi
          done
          ls -l www/
      - name: Verify - NOT mutate
        run: |
          for f in android/settings.gradle android/variables.gradle android/build.gradle android/capacitor.settings.gradle android/app/build.gradle www/index.html www/shop.html www/export.html www/privacy.html www/about.html; do
            if [ -f "$f" ]; then echo "✅ $f"; else echo "❌ MISSING: $f"; exit 1; fi
          done
          if [ -f android/gradlew ]; then echo "✅ android/gradlew"; else echo "⚠️ gradlew missing - CI will generate it"; fi
          head -n 1 android/app/src/main/AndroidManifest.xml | grep -q '<?xml'
          echo "✅ OK - Wana, South Waziristan"
      - name: Restore Android resources if missing
        run: |
          RES=android/app/src/main/res
          # FIX 1: Delete broken adaptive icon - causes mergeDebugResources Index -1
          rm -rf $RES/mipmap-anydpi-v26
          # FIX 2: Delete ALL old corrupt icons - force regenerate
          rm -rf $RES/mipmap-hdpi $RES/mipmap-mdpi $RES/mipmap-xhdpi $RES/mipmap-xxhdpi $RES/mipmap-xxxhdpi
          mkdir -p $RES/values $RES/xml $RES/mipmap-hdpi $RES/mipmap-mdpi $RES/mipmap-xhdpi $RES/mipmap-xxhdpi $RES/mipmap-xxxhdpi
          if [ ! -f $RES/values/strings.xml ]; then cat > $RES/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">GodEye</string>
              <string name="title_activity_main">GodEye</string>
              <string name="package_name">com.wanalab.godeye</string>
              <string name="custom_url_scheme">com.wanalab.godeye</string>
          </resources>
          EOF
          echo "✅ Created strings.xml"; fi
          cat > $RES/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#000000</color>
              <color name="colorPrimaryDark">#000000</color>
              <color name="colorAccent">#00E676</color>
          </resources>
          EOF
          echo "✅ Created colors.xml - fixes crash"
          cat > $RES/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
                  <item name="android:windowBackground">@color/colorPrimary</item>
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme">
                  <item name="android:background">@color/colorPrimary</item>
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>
          </resources>
          EOF
          echo "✅ Fixed styles.xml - Capacitor 7 NoActionBar - fixes crash"
          if [ ! -f $RES/xml/file_paths.xml ]; then cat > $RES/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="external_files" path="." />
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
          </paths>
          EOF
          echo "✅ Created file_paths.xml"; fi
          python3 -c "
          import zlib, struct, os
          def png(path, r, g, b):
              def chunk(t, d):
                  c = t + d
                  return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              ihdr = struct.pack('>IIBBBBB', 48, 48, 8, 2, 0, 0, 0)
              raw = b''.join(b'\x00' + bytes([r,g,b])*48 for _ in range(48))
              data = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
              open(path,'wb').write(data)
              print(f'Created {path}')
          for folder in ['mipmap-hdpi','mipmap-mdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']:
              for name in ['ic_launcher.png','ic_launcher_round.png']:
                  p = f'android/app/src/main/res/{folder}/{name}'
                  png(p, 0, 230, 118)
          "
          ls -l $RES/values/ $RES/xml/ $RES/mipmap-xxxhdpi/
          echo "✅ All Android resources restored"
      - name: Generate gradlew if missing
        run: |
          if [ -f android/gradlew ]; then echo "✅ gradlew exists"; chmod +x android/gradlew; exit 0; fi
          echo "❌ gradlew missing - generating..."
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          /tmp/gradle-8.11.1/bin/gradle -p $GITHUB_WORKSPACE/android wrapper --gradle-version 8.11.1
          chmod +x $GITHUB_WORKSPACE/android/gradlew
          echo "✅ gradlew generated"
      - name: Build APK + AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GodEye-APK-v2.2
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GodEye-AAB-v2.2
          path: android/app/build/outputs/bundle/debug/*.aab
