name: Build GodEye APK + AAB - v2.2
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }

      # FIX: No setup-android@v3 - it asks for dead 'tools' package
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Verify - NOT mutate
        run: |
          test -f android/settings.gradle
          test -f android/variables.gradle
          test -f android/build.gradle
          test -f android/capacitor.settings.gradle
          test -f android/app/build.gradle
          head -n 1 android/app/src/main/AndroidManifest.xml | grep -q '<?xml'
          echo "✅ Layout OK - Wana, South Waziristan"

      - name: Build APK + AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with: { name: GodEye-APK-v2.2, path: android/app/build/outputs/apk/debug/*.apk }
      - uses: actions/upload-artifact@v4
        with: { name: GodEye-AAB-v2.2, path: android/app/build/outputs/bundle/debug/*.aab }
