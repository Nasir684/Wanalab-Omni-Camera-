name: Build God Eye APK v1.6.9

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Manually
        run: |
          echo "ANDROID_HOME=$HOME/Android/Sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $GITHUB_ENV
          echo "$HOME/Android/Sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/Android/Sdk/platform-tools" >> $GITHUB_PATH
          mkdir -p $HOME/Android/Sdk/cmdline-tools
          cd $HOME/Android/Sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Web Assets - www folder
        run: |
          mkdir -p www
          # Copy root web files into www/ - Capacitor needs www/
          cp -r *.html www/ 2>/dev/null || true
          cp -r *.css www/ 2>/dev/null || true
          cp -r *.js www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true
          cp -r js www/ 2>/dev/null || true
          cp -r css www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true
          cp -r img www/ 2>/dev/null || true
          # If no index.html in www, use root index.html
          ls -la www/
          test -f www/index.html || cp index.html www/index.html

      - name: Install Capacitor 7 + TypeScript + Sync
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm install --save-dev typescript@5.6.3
          npx cap sync android

      - name: Build Debug APK - v1.6.9
        run: cd android && ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: God-Eye-v1.6.9-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
