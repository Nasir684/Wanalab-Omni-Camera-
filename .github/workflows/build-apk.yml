name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo files
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== WWW ==="
          ls -la www/ || echo "www/ NOT FOUND"
          ls -lh www/index.html || echo "www/index.html MISSING"

      - name: Ensure web assets exist
        run: |
          if [ ! -f www/index.html ]; then
            echo "WARNING: www/index.html missing - creating placeholder"
            mkdir -p www
            echo '<html><body><h1>God Eye - Please commit www/index.html</h1></body></html>' > www/index.html
          else
            echo "OK: www/index.html found"
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # FIXED: No setup-android@v3 here - it was trying to install obsolete 'tools' package
      # Gradle + Android Gradle Plugin will download SDK itself

      - name: Install deps
        run: npm install

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodEye-v1.6.9-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
