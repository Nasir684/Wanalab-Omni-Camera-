      - name: Check Dependencies
        run: |
          cd android
          ./gradlew :app:dependencies --configuration debugCompileClasspath --info 2>&1 | tail -n 100 || echo "Dependencies check done"
        continue-on-error: true

      - name: Build APK - Debug for Testing
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --info --stacktrace 2>&1 | tee /tmp/build.log; EXIT_CODE=${PIPESTATUS[0]}; if [ $EXIT_CODE -ne 0 ]; then echo "=== FULL ERROR - Last 200 lines ==="; tail -n 200 /tmp/build.log; grep -i "error:\|FAILED\|Could not\|Unresolved\|missing" /tmp/build.log | head -n 100; exit $EXIT_CODE; fi

      - name: Build AAB - Debug for Play Store Test
        run: |
          cd android
          ./gradlew bundleDebug --stacktrace

      - name: Build AAB - Release if Keystore Exists
        run: |
          cd android
          if [ -f app/release.keystore ] || [ -n "$ANDROID_KEYSTORE" ]; then echo "Keystore found - Building Release AAB"; ./gradlew bundleRelease --stacktrace; else echo "⚠️ No keystore - Skipping Release AAB"; fi
        continue-on-error: true

