name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo files
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== WWW ==="
          ls -la www/ || echo "www/ NOT FOUND - will create it"
          echo "=== GITHUB ==="
          ls -la .github/workflows/ || true

      - name: Ensure web assets exist
        run: |
          if [ ! -f www/index.html ]; then
            echo "WARNING: www/index.html missing in repo!"
            echo "Creating placeholder so build does not crash."
            echo "You MUST commit your real www/index.html for the real app."
            mkdir -p www
            echo '<html><body><h1>God Eye - Please commit www/index.html</h1></body></html>' > www/index.html
          else
            echo "OK: www/index.html found"
            ls -lh www/index.html
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm install

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodEye-v1.6.9-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
