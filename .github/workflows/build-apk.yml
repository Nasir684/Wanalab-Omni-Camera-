name: Build God Eye APK v1.6.7

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK - v1.6.7
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK - v1.6.7
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APKs to God Eye v1.6.7
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk God-Eye-v1.6.7-Debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk God-Eye-v1.6.7-Release.apk || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: God-Eye-v1.6.7-APKs
          path: |
            God-Eye-v1.6.7-Debug.apk
            God-Eye-v1.6.7-Release.apk
          retention-days: 30
