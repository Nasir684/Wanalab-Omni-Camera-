# GodEye v2.2 - CLEAN - 8 steps only - No rewrites
# Capacitor 8 = AGP 8.7.3 + Gradle 8.11.1 + Kotlin 2.0.21 + KSP 2.0.21-1.0.28
name: Build GodEye APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup - Node + JDK + SDK
      - name: Setup Node 22 + JDK 21 + SDK 35
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK 35
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-35" "build-tools;35.0.0" < /dev/null
          ls $ANDROID_HOME/platforms/android-35/android.jar

      # 3. Install locked deps - No npm install fallback
      - name: Install deps
        run: |
          if [ ! -f package-lock.json ]; then echo "❌ package-lock.json missing - Run Step 3 below" && exit 1; fi
          npm ci
          ls node_modules/@capacitor/app/android node_modules/@capacitor/status-bar/android node_modules/@capacitor/haptics/android node_modules/@capacitor/keyboard/android

      # 4. Wrapper - Copy from ROOT if still there + Ensure jar exists
      - name: Fix Wrapper Path - ROOT to android/
        run: |
          echo "=== Where is wrapper? ==="
          find . -name "gradle-wrapper.properties" -not -path "./node_modules/*"
          mkdir -p android/gradle/wrapper
          # If still at ROOT, copy to android/
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then cp gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties && echo "✅ Copied properties ROOT -> android/"; fi
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then cp gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar && echo "✅ Copied jar ROOT -> android/"; fi
          if [ -f gradlew ]; then cp gradlew android/gradlew && echo "✅ Copied gradlew ROOT -> android/"; fi
          if [ -f gradlew.bat ]; then cp gradlew.bat android/gradlew.bat && echo "✅ Copied gradlew.bat ROOT -> android/"; fi
          # Force 8.11.1
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
          # If jar still missing, generate it in CI - No PC needed
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || [ ! -f android/gradlew ]; then
            echo "⚠️ Jar or gradlew missing - Generating in CI"
            cd /tmp && curl -sL -o g.zip https://services.gradle.org/distributions/gradle-8.11.1-all.zip && unzip -q g.zip
            cd $GITHUB_WORKSPACE/android && /tmp/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1
            cd $GITHUB_WORKSPACE && rm -rf /tmp/gradle-8.11.1 /tmp/g.zip
          fi
          ls -lh android/gradlew android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew

      # 5. Sync Capacitor - Do NOT rewrite Gradle files after this
      - name: Sync Capacitor
        run: |
          npx cap sync android
          cat android/settings.gradle.kts
          cd android && ./gradlew help --stacktrace

      # 6. Build
      - name: Build APK + AAB
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleDebug --stacktrace

      # 7. Upload
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodEye-APK-v2.2
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: GodEye-AAB-v2.2
          path: android/app/build/outputs/bundle/debug/app-debug.aab
