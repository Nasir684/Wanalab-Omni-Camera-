name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo files
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== WWW ==="
          ls -la www/ || echo "www/ NOT FOUND"
          echo "=== ANDROID ==="
          ls -la android/ || echo "android/ NOT FOUND - will be created by cap add"

      - name: Ensure web assets exist
        run: |
          if [ ! -f www/index.html ]; then
            echo "WARNING: www/index.html missing - creating placeholder"
            mkdir -p www
            echo '<html><body><h1>God Eye - Please commit www/index.html</h1></body></html>' > www/index.html
          else
            echo "OK: www/index.html found"
            ls -lh www/index.html
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm install

      - name: Create Android project
        run: |
          # Always create fresh android/ on runner - do NOT rely on committed android/
          # Your .gitignore probably ignores android/ - that is normal
          if [ -d android ]; then
            echo "android/ exists, removing to recreate clean"
            rm -rf android
          fi
          npx cap add android
          echo "=== AFTER cap add ==="
          ls -la android/
          ls -lh android/gradlew || echo "ERROR: gradlew still missing after cap add"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          # FIXED: chmod from repo root with correct path, then cd
          ls -la android/gradlew
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodEye-v1.6.9-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
