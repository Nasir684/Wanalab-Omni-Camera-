# GodEye v2.2 - COMPLETE - FIXED - Do NOT delete /tmp Gradle early
# Author: Nasir Khan - Dera Ismail Khan, Khyber Pakhtunkhwa
# PRO Rs. 2,500 / Year
# Capacitor 8 = AGP 8.7.3 + Gradle 8.11.1 + Kotlin 2.0.21 + KSP 2.0.21-1.0.28
name: Build GodEye APK + AAB - v2.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  GODEYE_VERSION: "2.2"
  GODEYE_NAME: "GodEye - By WanaLab"
  PRO_PRICE: "Rs. 2,500 / Year"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if www/index.html missing
        run: |
          if [ ! -f www/index.html ]; then echo "❌ FAIL: www/index.html missing" && exit 1; fi
          ls -lh www/index.html shop.html export.html about.html privacy.html || echo "Check ROOT files"
          echo "✅ www/index.html exists"

      - name: Check Spec in HTML
        run: |
          grep -q "468 Dots" www/index.html || (echo "❌ FAIL: Face Mesh 468 Dots missing" && exit 1)
          grep -q "MediaPipe\|mediapipe\|face_mesh" www/index.html || (echo "❌ FAIL: MediaPipe missing" && exit 1)
          grep -q "External Devices" www/index.html || (echo "❌ FAIL: External Devices missing" && exit 1)
          grep -q "PRO Only" www/index.html || (echo "❌ FAIL: PRO Only missing" && exit 1)
          grep -q "2,500" www/index.html || (echo "❌ FAIL: PRO Price Rs. 2,500 missing" && exit 1)
          grep -q "By WanaLab" www/index.html || (echo "❌ FAIL: WanaLab footer missing" && exit 1)
          grep -q "Nasir Khan" www/index.html || (echo "❌ FAIL: Founded by Nasir Khan missing" && exit 1)
          grep -q "Thumb Biometric" www/index.html || (echo "❌ FAIL: Thumb Biometric missing" && exit 1)
          grep -q "Attendance" www/index.html || (echo "❌ FAIL: Thumb Attendance missing" && exit 1)
          grep -q "Liveness\|Move Thumb" www/index.html || (echo "❌ FAIL: Thumb Liveness missing" && exit 1)
          grep -q "Photo Effects" www/index.html || (echo "❌ FAIL: Photo Effects missing" && exit 1)
          grep -q "Clarendon" www/index.html || (echo "❌ FAIL: Clarendon missing" && exit 1)
          grep -q "Credentials For This Page" www/index.html || (echo "❌ FAIL: Credentials missing" && exit 1)
          grep -q "Profile Type" www/index.html || (echo "❌ FAIL: Profile Type missing" && exit 1)
          grep -q "WanaLab.*Watermark\|Made By WanaLab" www/index.html || (echo "❌ FAIL: WanaLab Watermark missing" && exit 1)
          grep -q "GPS Timestamp" www/index.html || (echo "❌ FAIL: GPS Timestamp missing" && exit 1)
          grep -q "GPS Share\|gpsShare" www/index.html || (echo "❌ FAIL: GPS Share missing" && exit 1)
          grep -q "isFromMockProvider\|Anti-Fake GPS" www/index.html || (echo "❌ FAIL: Anti-Fake GPS missing" && exit 1)
          grep -q "maps.google.com" www/index.html || (echo "❌ FAIL: Map Link missing" && exit 1)
          grep -q "v2.2" www/index.html || (echo "❌ FAIL: Version v2.2 missing" && exit 1)
          echo "✅ HTML Spec Check Passed"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK - Use Preinstalled
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          ls /usr/local/lib/android/sdk/

      - name: Install Android SDK Platform 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || echo "Licenses accepted"
          yes | sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          ls -lh $ANDROID_HOME/platforms/android-35/android.jar || (echo "❌ android-35 still missing" && exit 1)
          echo "✅ SDK Platform 35 installed"

      - name: Install deps - Auto-generate lockfile if missing
        run: |
          if [ -f package-lock.json ]; then
            echo "✅ package-lock.json found - Using npm ci"
            npm ci
          else
            echo "⚠️ package-lock.json missing - Generating it now in CI"
            npm install
            ls -lh package-lock.json
          fi
          npm list @capacitor/android @capacitor/app @capacitor/haptics @capacitor/keyboard @capacitor/status-bar @capacitor/core @capacitor/cli
          ls -ld node_modules/@capacitor/android/capacitor || (echo "❌ @capacitor/android missing" && exit 1)
          ls -ld node_modules/@capacitor/app/android || (echo "❌ @capacitor/app missing" && exit 1)
          ls -ld node_modules/@capacitor/haptics/android || (echo "❌ @capacitor/haptics missing" && exit 1)
          ls -ld node_modules/@capacitor/keyboard/android || (echo "❌ @capacitor/keyboard missing" && exit 1)
          ls -ld node_modules/@capacitor/status-bar/android || (echo "❌ @capacitor/status-bar missing" && exit 1)
          echo "✅ All Capacitor 8 plugins exist"

      - name: Commit package-lock.json back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package-lock.json || echo "No lockfile to add"
          if git diff --cached --quiet; then
            echo "✅ package-lock.json already committed"
          else
            git commit -m "Add package-lock.json - Generated in CI"
            git push
            echo "✅ Committed package-lock.json"
          fi

      - name: Verify Committed Gradle Versions
        run: |
          grep -E "com.android.tools.build:gradle|kotlin-gradle-plugin" android/build.gradle || (echo "❌ android/build.gradle missing AGP/Kotlin" && exit 1)
          grep -E "com.android.application|org.jetbrains.kotlin.android|com.google.devtools.ksp" android/settings.gradle.kts || (echo "❌ settings.gradle.kts missing pluginManagement" && exit 1)
          grep -E "com.google.devtools.ksp" android/app/build.gradle.kts || (echo "❌ app/build.gradle.kts missing KSP" && exit 1)
          if grep -q "8.7.3" android/build.gradle && grep -q "8.7.3" android/settings.gradle.kts; then echo "✅ AGP 8.7.3 consistent"; else echo "❌ FAIL: AGP mismatch" && exit 1; fi
          if grep -q "2.0.21" android/build.gradle && grep -q "2.0.21" android/settings.gradle.kts && grep -q "2.0.21" android/app/build.gradle.kts; then echo "✅ Kotlin/KSP 2.0.21 consistent"; else echo "❌ FAIL: Kotlin/KSP mismatch" && exit 1; fi
          echo "✅ Versions consistent"

      - name: Fix Wrapper Path - ROOT to android + Generate jar if missing
        run: |
          echo "=== Search wrapper ==="
          find . -name "gradle-wrapper.properties" -not -path "./node_modules/*"
          mkdir -p android/gradle/wrapper
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then cp gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties && echo "✅ Copied properties ROOT -> android/"; fi
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then cp gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar && echo "✅ Copied jar ROOT -> android/"; fi
          if [ -f gradlew ]; then cp gradlew android/gradlew && echo "✅ Copied gradlew ROOT -> android/"; fi
          if [ -f gradlew.bat ]; then cp gradlew.bat android/gradlew.bat && echo "✅ Copied gradlew.bat ROOT -> android/"; fi
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || [ ! -f android/gradlew ]; then
            echo "⚠️ Jar or gradlew missing - Generating in CI - KEEP /tmp Gradle, DO NOT DELETE YET"
            cd /tmp && curl -sL -o g.zip https://services.gradle.org/distributions/gradle-8.11.1-all.zip && unzip -q -o g.zip
            cd $GITHUB_WORKSPACE/android && /tmp/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1 --no-daemon
            cd $GITHUB_WORKSPACE
            echo "✅ Generated wrapper - /tmp/gradle-8.11.1 KEPT for later steps"
          fi
          ls -lh android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.jar || (echo "❌ Wrapper still missing" && exit 1)
          chmod +x android/gradlew
          grep "gradle-8.11.1" android/gradle/wrapper/gradle-wrapper.properties || (echo "❌ Wrapper must be 8.11.1" && exit 1)
          echo "✅ Wrapper ready - Gradle 8.11.1"

      - name: Validate settings.gradle.kts - No duplicate Gradle files
        run: |
          cat android/settings.gradle.kts
          if grep -Eq '^[[:space:]]*includeBuild[[:space:]]*\(' android/settings.gradle.kts; then echo "❌ Unexpected includeBuild" && exit 1; fi
          echo "✅ No includeBuild() - OK"
          if [ -f android/settings.gradle ]; then echo "❌ FAIL: Both settings.gradle AND settings.gradle.kts exist - Delete settings.gradle" && exit 1; fi
          if [ -f android/build.gradle.kts ]; then echo "❌ FAIL: Both build.gradle AND build.gradle.kts exist in android/ - Delete build.gradle.kts" && exit 1; fi
          if [ -f android/app/build.gradle ]; then echo "❌ FAIL: Both app/build.gradle AND app/build.gradle.kts exist - Delete app/build.gradle" && exit 1; fi
          echo "✅ No duplicate Gradle files"

      - name: Sync web assets - npx cap sync android
        run: |
          npx cap sync android
          test -d android/app || (echo "❌ android/app missing after sync" && exit 1)
          test -f android/gradlew || (echo "❌ android/gradlew missing after sync" && exit 1)
          echo "✅ Capacitor Sync Passed"
          cat android/settings.gradle.kts
          if grep -Eq '^[[:space:]]*includeBuild[[:space:]]*\(' android/settings.gradle.kts; then echo "❌ cap sync added includeBuild" && exit 1; fi
          if ! grep -q "com.google.devtools.ksp" android/settings.gradle.kts; then echo "⚠️ cap sync removed KSP" && exit 1; fi
          echo "✅ Settings still valid after sync"

      - name: FIX - AndroidX + Media3 1.4.1 -> 1.3.1 - AFTER SYNC
        run: |
          echo "=== BEFORE ==="
          cat android/gradle.properties || echo "no gradle.properties"
          echo "--- app/build.gradle.kts media3 lines ---"
          grep -n "media3" android/app/build.gradle.kts || echo "no media3 in app/build.gradle.kts"
          grep -rn "media3" android/app/build.gradle* || true

          # 1. AndroidX - MUST be in android/gradle.properties, not root
          touch android/gradle.properties
          grep -q "android.useAndroidX=true" android/gradle.properties || echo "android.useAndroidX=true" >> android/gradle.properties
          grep -q "android.enableJetifier=true" android/gradle.properties || echo "android.enableJetifier=true" >> android/gradle.properties
          grep -q "org.gradle.jvmargs" android/gradle.properties || echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> android/gradle.properties

          # 2. Media3 FIX - Python, NOT sed. Sed failed before because of escaping / pattern.
          # This replaces ALL 1.4.1 -> 1.3.1 in the app file, covers rtmp + hls + dash
          python3 -c "
          import pathlib, re
          for p in [pathlib.Path('android/app/build.gradle.kts'), pathlib.Path('android/app/build.gradle')]:
              if not p.exists():
                  continue
              t = p.read_text()
              t2 = t.replace('1.4.1', '1.3.1')
              # Also fix if version is defined as variable: media3Version = \"1.4.1\"
              t2 = re.sub(r'(media3[^=]*=\s*[\"\\'])1\.4\.1', r'\g<1>1.3.1', t2)
              p.write_text(t2)
              print(f'Fixed {p}')
          "

          # 3. If still no media3 lines, force-add the 3 correct ones
          if ! grep -q "media3-exoplayer-rtmp:1.3.1" android/app/build.gradle.kts; then
            echo "⚠️ rtmp 1.3.1 still missing - appending correct deps"
            python3 -c "
          import pathlib
          p = pathlib.Path('android/app/build.gradle.kts')
          t = p.read_text()
          # Remove any remaining 1.4.1 media3 lines
          lines = [l for l in t.splitlines() if 'media3' not in l or '1.4.1' not in l]
          t = '\n'.join(lines)
          # Insert before last closing brace of dependencies block, or just append
          t += '\n// Fixed by CI - Media3 1.3.1\n'
          # We append inside dependencies if possible - simplest: add at end, Gradle will still pick it if inside dependencies is needed, so insert before final }
          # Instead, ensure they are inside dependencies block:
          if 'media3-exoplayer-rtmp' not in t:
              t = t.replace('dependencies {', 'dependencies {\n    implementation(\"androidx.media3:media3-exoplayer-rtmp:1.3.1\")\n    implementation(\"androidx.media3:media3-exoplayer-hls:1.3.1\")\n    implementation(\"androidx.media3:media3-exoplayer-dash:1.3.1\")', 1)
          p.write_text(t)
          print('Appended media3 1.3.1')
          "
          fi

          echo "=== AFTER ==="
          cat android/gradle.properties
          grep -n "media3" android/app/build.gradle.kts

          # 4. FINAL VERIFY - Must fail if any 1.4.1 remains in media3
          if grep -q "media3.*1\.4\.1" android/app/build.gradle.kts; then
            echo "❌ FAIL: Still found media3 1.4.1"
            grep -n "media3" android/app/build.gradle.kts
            exit 1
          fi
          grep -q "media3-exoplayer-rtmp:1.3.1" android/app/build.gradle.kts || (echo "❌ FAIL: rtmp 1.3.1 missing" && exit 1)
          grep -q "media3-exoplayer-hls:1.3.1" android/app/build.gradle.kts || (echo "❌ FAIL: hls 1.3.1 missing" && exit 1)
          grep -q "media3-exoplayer-dash:1.3.1" android/app/build.gradle.kts || (echo "❌ FAIL: dash 1.3.1 missing" && exit 1)
          grep -q "android.useAndroidX=true" android/gradle.properties || (echo "❌ FAIL: useAndroidX missing" && exit 1)
          echo "✅ AndroidX + Media3 1.3.1 FIXED"

      - name: Gradle Help - Validate Gradle can configure project
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --stop || echo "No daemon to stop - OK"
          rm -rf ~/.gradle/caches/8.11.1 || echo "No stale cache"
          ./gradlew help --no-daemon --stacktrace

      - name: Verify Manifest Activities Exist in android/app
        run: |
          grep -o 'android:name="[^"]*Activity"' android/app/src/main/AndroidManifest.xml || echo "No activities found in Manifest"
          find android/app/src/main/java -name "*.kt" | head -n 20 || echo "No Kotlin files in android/app/src/main/java"
          if grep -q "CameraActivity" android/app/src/main/AndroidManifest.xml; then
            if find android/app/src/main/java -name "CameraActivity.kt" | grep -q .; then echo "✅ CameraActivity.kt exists in android/app"; else echo "⚠️ WARNING: Manifest declares CameraActivity but CameraActivity.kt NOT in android/app/src/main/java"; fi
          else
            echo "⚠️ CameraActivity not in Manifest - OK if you use only Capacitor WebView"
          fi

      - name: Build APK - Debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build AAB - Debug
        run: |
          cd android
          ./gradlew bundleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodEye-APK-v2.2
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: GodEye-AAB-v2.2
          path: android/app/build/outputs/bundle/debug/app-debug.aab

      - name: Build Summary
        run: |
          echo "✅ GodEye v2.2 Build Done"
          echo "Version: $GODEYE_VERSION"
          echo "PRO: $PRO_PRICE"
          echo "By WanaLab - Founded by Nasir Khan"
          rm -rf /tmp/gradle-8.11.1 /tmp/g.zip || echo "Cleanup done"
