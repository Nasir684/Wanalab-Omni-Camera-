# WanaLab God Eye v2.2 - gradle.properties
# Founder Nasir Khan - Dera Ismail Khan, Khyber Pakhtunkhwa - 2026-11-23

# --- WanaLab Version ---
wanalabVersion=2.2
wanalabVersionCode=22
wanalabAppName=WanaLab God Eye

# --- JVM / Build Performance ---
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true

# --- Android ---
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=true
android.defaults.buildfeatures.renderscript=true
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=true

# --- WanaLab v2.2 - Features ---
# FLIR ONE + OpenCV + Media3 + RTSP + MQTT + WebSocket
android.enableR8.fullMode=false
android.nonFinalResIds=false
