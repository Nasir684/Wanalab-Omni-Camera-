<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export Hub v1.9 FINAL</title>
<link rel="manifest" href="./manifest.json?v=19">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head><body style="background:#000;color:#0f8;font-family:system-ui;padding:20px">
<h2>📘 Export Hub v1.9 FINAL v99</h2>
<p>Pages: <span id="pc">0</span> | <a href="https://nasir684.github.io/Wanalab-Omni-Camera-/?v=19&force=99" style="color:#0f8">Back to Camera v99</a></p>
<div id="list" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px"></div>
<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
<button onclick="exportAllPDF()" style="padding:12px;background:#00aaff;color:#fff;border:none;border-radius:10px;font-weight:800">📄 IMG PDF</button>
<button onclick="exportAllSearchable()" style="padding:12px;background:#00ff88;color:#000;border:none;border-radius:10px;font-weight:800">🔍 SEARCH PDF</button>
<button onclick="exportAllDOCX()" style="padding:12px;background:#2b579a;color:#fff;border:none;border-radius:10px;font-weight:800">📘 DOCX+IMG</button>
<button onclick="clearAll()" style="padding:12px;background:#300;color:#f55;border:none;border-radius:10px">🗑️ CLEAR ALL</button>
</div>
<script>
let pages=JSON.parse(localStorage.getItem('wanaScannedPages')||'[]');
document.getElementById('pc').innerText=pages.length;
let list=document.getElementById('list');
pages.forEach((p,i)=>{let img=document.createElement('img');img.src=p;img.style.width='100%';img.style.borderRadius='10px';img.style.border='1px solid #0f8';list.appendChild(img);});
async function exportAllPDF(){const {jsPDF}=window.jspdf;let doc=new jsPDF();pages.forEach((img,i)=>{if(i>0)doc.addPage();doc.addImage(img,'JPEG',0,0,210,297);});doc.save(`GodEye-v99-${Date.now()}.pdf`);}
async function exportAllSearchable(){const {jsPDF}=window.jspdf;let doc=new jsPDF();for(let i=0;i<pages.length;i++){if(i>0)doc.addPage();doc.addImage(pages[i],'JPEG',0,0,210,297);try{const w=await Tesseract.createWorker('eng');const r=await w.recognize(pages[i]);await w.terminate();doc.setFontSize(1);doc.setTextColor(255,255,255);doc.text(doc.splitTextToSize(r.data.text,190),5,5);}catch{}}doc.save(`GodEye-Searchable-v99-${Date.now()}.pdf`);}
async function exportAllDOCX(){let children=[new docx.Paragraph({children:[new docx.TextRun({text:`God Eye v1.9 FINAL v99 ${new Date().toLocaleString()}`,bold:true})]})];for(let i=0;i<pages.length;i++){children.push(new docx.Paragraph({text:`Page ${i+1}`,heading:docx.HeadingLevel.HEADING_1}));try{const w=await Tesseract.createWorker('eng');const r=await w.recognize(pages[i]);await w.terminate();r.data.text.split('\n').forEach(l=>{if(l.trim())children.push(new docx.Paragraph({children:[new docx.TextRun(l)]}));});}catch{}try{let b64=pages[i].split(',')[1];let bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));children.push(new docx.Paragraph({children:[new docx.ImageRun({data:bytes,[STRIPPED]}));}catch{}}let doc=new docx.Document({sections:[{children}]});const blob=await docx.Packer.toBlob(doc);let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`GodEye-FINAL-v99-${Date.now()}.docx`;a.click();}
function clearAll(){if(confirm('Clear all pages?')){localStorage.removeItem('wanaScannedPages');location.reload();}}
</script>
</body></html>
