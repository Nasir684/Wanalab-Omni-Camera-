<script>
let pages=JSON.parse(localStorage.getItem('wanaScannedPages')||'[]');
let billItems=JSON.parse(localStorage.getItem('god_bill')||'[]');
let faceLog=JSON.parse(localStorage.getItem('god_face_log')||'[]');
let faceAlerts=JSON.parse(localStorage.getItem('god_face_alerts')||'[]');
let knownFaces=JSON.parse(localStorage.getItem('god_faces')||'[]');
let scanHistory=JSON.parse(localStorage.getItem('god_scans')||'[]');
document.getElementById('pc').innerText=pages.length;
function setStatus(m){ document.getElementById('status').innerText=m; }
function getT(id){ return document.getElementById(id).checked; }
function updateNet(){ document.getElementById('net').innerText=navigator.onLine?'🟢 Online':'🟡 Offline - PDF/DOCX/XLSX/CSV/ZIP OK'; }
window.addEventListener('online',updateNet); window.addEventListener('offline',updateNet); updateNet();
let list=document.getElementById('list');
if(!pages.length) list.innerHTML='<p style="color:#888;grid-column:1/4">No pages yet. Go to Camera > Scan > Doc Scan, then come back.</p>';
pages.forEach((p,i)=>{
  let wrap=document.createElement('div');
  let img=document.createElement('img');img.src=p;img.style.width='100%';img.style.borderRadius='10px';img.style.border='1px solid #0f8';
  let btn=document.createElement('button');btn.innerText='🗑 Delete Page '+(i+1);btn.style.cssText='width:100%;margin-top:4px;background:#300;color:#f55;border:none;padding:8px;border-radius:8px';
  btn.onclick=()=>{ pages.splice(i,1); localStorage.setItem('wanaScannedPages',JSON.stringify(pages)); location.reload(); };
  wrap.appendChild(img); wrap.appendChild(btn); list.appendChild(wrap);
});

// ===== IMAGE ENHANCE - Browser Only, No Server =====
function enhanceImage(src, quality){
  if(!getT('t_enhance')) return src;
  try{
    let img=new Image(); img.src=src;
    let c=document.createElement('canvas'); c.width=img.naturalWidth||1280; c.height=img.naturalHeight||1700;
    let ctx=c.getContext('2d'); ctx.filter='grayscale(1) contrast(1.4) brightness(1.05)'; ctx.drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg', parseFloat(quality));
  }catch(e){ return src; }
}
function getQuality(){ return document.getElementById('pdf_q').value; }

// ===== OCR - 1 Worker, Multi-Language =====
let _worker=null, _workerLang='';
async function getWorker(){
  let lang=document.getElementById('ocr_lang').value;
  if(_worker && _workerLang===lang) return _worker;
  if(_worker){ try{ await _worker.terminate(); }catch(e){} _worker=null; }
  _worker=await Tesseract.createWorker(lang);
  _workerLang=lang;
  return _worker;
}
async function ocrPage(img){
  if(!getT('t_ocr')) return '';
  try{ const w=await getWorker(); const r=await w.recognize(img); return r.data.text||''; }catch(e){ return ''; }
}
async function cleanupWorker(){ try{ if(_worker){ await _worker.terminate(); _worker=null; } }catch(e){} }
function watermark(doc){
  if(!getT('t_timestamp')) return;
  doc.setFontSize(8); doc.setTextColor(150,150,150);
  doc.text(`God Eye v1.6.7 - WanaLab - ${new Date().toLocaleString('en-PK')}`,10,292);
}
async function maybeShare(blob, name, type){
  if(!getT('t_share')) return;
  try{
    let file=new File([blob], name, {type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'God Eye Export', text:'God Eye v1.6.7 Export'});
      setStatus('✅ Shared via Web Share');
    }
  }catch(e){}
}

// ===== PDF / DOCX / XLSX / CSV / JSON / TXT / HTML / ZIP =====
async function exportAllPDF(){
  if(!pages.length) return setStatus('No pages');
  setStatus('Creating IMG PDF...');
  const {jsPDF}=window.jspdf; let doc=new jsPDF({format:document.getElementById('page_size').value});
  for(let i=0;i<pages.length;i++){ if(i>0)doc.addPage(); let img=enhanceImage(pages[i], getQuality()); doc.addImage(img,'JPEG',0,0,210,297); }
  watermark(doc); doc.save(`GodEye-v167-${Date.now()}.pdf`); setStatus('✅ IMG PDF Saved');
}
async function exportAllSearchable(){
  if(!pages.length) return setStatus('No pages');
  setStatus('OCR running...');
  const {jsPDF}=window.jspdf; let doc=new jsPDF({format:document.getElementById('page_size').value});
  for(let i=0;i<pages.length;i++){ if(i>0)doc.addPage(); doc.addImage(pages[i],'JPEG',0,0,210,297); setStatus('OCR Page '+(i+1)+' / '+pages.length+'...'); let text=await ocrPage(pages[i]); if(text){ doc.setFontSize(1); doc.setTextColor(255,255,255); try{ doc.text(doc.splitTextToSize(text,190),5,5); }catch(e){} } }
  await cleanupWorker(); watermark(doc); doc.save(`GodEye-Searchable-v167-${Date.now()}.pdf`); setStatus('✅ Searchable PDF Saved');
}
async function exportAllDOCX(){
  if(!pages.length) return setStatus('No pages');
  setStatus('Creating DOCX...');
  let children=[new docx.Paragraph({children:[new docx.TextRun({text:`God Eye v1.6.7 - Export v2.0 - ${new Date().toLocaleString('en-PK')}`,bold:true})]})];
  if(getT('t_face')){ children.push(new docx.Paragraph({text:'Known Faces',heading:docx.HeadingLevel.HEADING_1})); knownFaces.forEach(f=>children.push(new docx.Paragraph({text:'- '+f.name}))); }
  if(getT('t_bill')){ children.push(new docx.Paragraph({text:'Bill',heading:docx.HeadingLevel.HEADING_1})); billItems.forEach(b=>children.push(new docx.Paragraph({text:`${b.name} - Rs. ${b.price}`}))); }
  for(let i=0;i<pages.length;i++){
    children.push(new docx.Paragraph({text:`Page ${i+1}`,heading:docx.HeadingLevel.HEADING_1}));
    let text=await ocrPage(pages[i]);
    if(text) text.split('\n').forEach(l=>{ if(l.trim()) children.push(new docx.Paragraph({children:[new docx.TextRun(l)]})); });
    try{ let b64=pages[i].split(',')[1]; let bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)); children.push(new docx.Paragraph({children:[new docx.ImageRun({data:bytes, transformation:{width:500,height:700}, type:'jpg'})]})); }catch(e){}
  }
  await cleanupWorker();
  let doc=new docx.Document({sections:[{children}]});
  const blob=await docx.Packer.toBlob(doc);
  let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`GodEye-v167-${Date.now()}.docx`;a.click();
  maybeShare(blob, a.download, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
  setStatus('✅ DOCX Saved');
}
function exportXLSX(){
  setStatus('Creating XLSX...');
  let billRows=billItems.map(b=>({Product:b.name, Price:b.price, Date:new Date().toLocaleDateString('en-PK')}));
  let logRows=faceLog.map(l=>({Log:l}));
  let scanRows=scanHistory.map(s=>({Barcode:s}));
  let wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(billRows.length?billRows:[{Product:'No bill',Price:0}]), 'Bill');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(logRows.length?logRows:[{Log:'No log'}]), 'Face Log');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(scanRows.length?scanRows:[{Barcode:'No scans'}]), 'Scans');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(knownFaces.map(f=>({Name:f.name}))), 'Known Faces');
  XLSX.writeFile(wb, `GodEye-v167-${Date.now()}.xlsx`);
  setStatus('✅ XLSX Saved - Bill + Face Log + Scans + Faces in 4 sheets');
}
function exportCSV(){
  let csv='Product,Price,Date\n'+billItems.map(b=>`${b.name},${b.price},${new Date().toLocaleDateString('en-PK')}`).join('\n')+'\n\nFace Log\n'+faceLog.join('\n');
  let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`GodEye-v167-${Date.now()}.csv`;a.click(); setStatus('✅ CSV Saved');
}
function exportJSON(){
  let data={app:'God Eye v1.6.7', export:'v2.0', date:new Date().toISOString(), pages:pages.length, bill:billItems, faceLog, knownFaces, scans:scanHistory, alertsCount:faceAlerts.length};
  let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`GodEye-v167-${Date.now()}.json`;a.click(); setStatus('✅ JSON Saved - For developers / backup');
}
async function exportTXT(){
  let txt=`God Eye v1.6.7 Export\n${new Date().toLocaleString('en-PK')}\n\nBILL:\n`+billItems.map(b=>`${b.name} - Rs. ${b.price}`).join('\n')+`\n\nFACE LOG:\n`+faceLog.join('\n')+`\n\nOCR:\n`;
  for(let i=0;i<pages.length;i++){ txt+=`\n--- Page ${i+1} ---\n`+await ocrPage(pages[i]); }
  await cleanupWorker();
  let blob=new Blob([txt],{type:'text/plain'}); let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`GodEye-v167-${Date.now()}.txt`;a.click(); setStatus('✅ TXT Saved');
}
function exportHTML(){
  let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>God Eye Export</title></head><body style="font-family:Arial;padding:20px"><h1>God Eye v1.6.7 Export</h1><p>${new Date().toLocaleString('en-PK')}</p><h2>Bill</h2>${billItems.map(b=>`<p>${b.name} - Rs. ${b.price}</p>`).join('')}<h2>Face Log</h2>${faceLog.map(l=>`<p>${l}</p>`).join('')}<h2>Pages</h2>${pages.map(p=>`<img src="${p}" style="width:100%;margin:10px 0">`).join('')}</body></html>`;
  let blob=new Blob([html],{type:'text/html'}); let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`GodEye-v167-${Date.now()}.html`;a.click(); setStatus('✅ HTML Saved - Open in any browser');
}
async function exportZIP(){
  setStatus('Creating ZIP...');
  let zip=new JSZip();
  pages.forEach((p,i)=>{ let b64=p.split(',')[1]; zip.file(`Page-${i+1}.jpg`, b64, {base64:true}); });
  zip.file('bill.json', JSON.stringify(billItems,null,2));
  zip.file('face-log.txt', faceLog.join('\n'));
  let blob=await zip.generateAsync({type:'blob'});
  let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`GodEye-v167-${Date.now()}.zip`;a.click(); setStatus('✅ ZIP Saved - All JPG + JSON + Log');
}
async function exportFullReport(){
  setStatus('Creating Full Report...');
  const {jsPDF}=window.jspdf; let doc=new jsPDF();
  doc.setFontSize(18); doc.text('God Eye v1.6.7 - Full Report',10,15);
  doc.setFontSize(11); doc.text(`Date: ${new Date().toLocaleString('en-PK')} | Pages: ${pages.length} | Bill: Rs. ${billItems.reduce((s,i)=>s+i.price,0)} | Faces: ${knownFaces.length} | Alerts: ${faceAlerts.length}`,10,25);
  let y=40;
  if(getT('t_face')){ doc.setFontSize(13); doc.text('Known Faces:',10,y); y+=8; doc.setFontSize(10); knownFaces.forEach(f=>{ doc.text('- '+f.name,14,y); y+=6; if(y>280){doc.addPage();y=15;} }); }
  if(getT('t_bill')){ y+=4; doc.setFontSize(13); doc.text('Bill:',10,y); y+=8; doc.setFontSize(10); billItems.forEach(b=>{ doc.text(`- ${b.name} - Rs. ${b.price}`,14,y); y+=6; if(y>280){doc.addPage();y=15;} }); }
  y+=4; doc.setFontSize(13); doc.text('Face Log:',10,y); y+=8; doc.setFontSize(9); faceLog.slice(0,80).forEach(l=>{ doc.text(doc.splitTextToSize(l,180),14,y); y+=6; if(y>280){doc.addPage();y=15;} });
  pages.forEach((img,i)=>{ doc.addPage(); doc.addImage(enhanceImage(img,getQuality()),'JPEG',0,0,210,297); });
  watermark(doc); doc.save(`GodEye-Full-Report-v167-${Date.now()}.pdf`); setStatus('✅ Full Report Saved');
}

// ===== ALL FREE PROTOCOLS =====
async function shareViaWebShare(){
  if(!pages.length) return setStatus('No pages to share');
  // Web Share API - Free, Built-in, WhatsApp / Gmail / Drive / Bluetooth
  try{
    const {jsPDF}=window.jspdf; let doc=new jsPDF(); pages.forEach((img,i)=>{ if(i>0)doc.addPage(); doc.addImage(img,'JPEG',0,0,210,297); });
    let blob=doc.output('blob'); let file=new File([blob], 'GodEye.pdf', {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'God Eye Export', text:'God Eye v1.6.7 - Scanned Pages'}); setStatus('✅ Shared'); }
    else setStatus('Web Share not supported - Use Download + WhatsApp button');
  }catch(e){ setStatus('Share cancelled / not supported'); }
}
function sendWhatsApp(){
  let text=`Assalam-o-Alaikum! God Eye v1.6.7 Export\nPages: ${pages.length}\nBill: Rs. ${billItems.reduce((s,i)=>s+i.price,0)}\nFaces: ${knownFaces.length}\nDate: ${new Date().toLocaleString('en-PK')}\n\nDownload PDF from Export Hub and attach here.`;
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
  setStatus('✅ WhatsApp opened - Attach downloaded PDF');
}
function sendEmail(){
  let subject=encodeURIComponent('God Eye v1.6.7 Export - '+new Date().toLocaleDateString());
  let body=encodeURIComponent(`Pages: ${pages.length}\nBill: Rs. ${billItems.reduce((s,i)=>s+i.price,0)}\nFace Log:\n${faceLog.slice(0,20).join('\n')}\n\nAttach PDF from Export Hub.`);
  window.location.href=`mailto:?subject=${subject}&body=${body}`;
  setStatus('✅ Email opened');
}
async function copyToClipboard(){
  let txt=`God Eye Export - ${new Date().toLocaleString('en-PK')}\nBill: Rs. ${billItems.reduce((s,i)=>s+i.price,0)}\nFace Log:\n${faceLog.join('\n')}`;
  try{ await navigator.clipboard.writeText(txt); setStatus('✅ Copied to clipboard - Paste anywhere'); }catch(e){ setStatus('Clipboard blocked - Allow clipboard'); }
}
function sendMQTT(){
  // MQTT over WebSocket - Free, EMQX Public Broker, No Server Needed
  let url=document.getElementById('mqtt_url').value.trim()||'wss://broker.emqx.io:8084/mqtt';
  try{
    let client=mqtt.connect(url);
    client.on('connect', ()=>{
      let payload=JSON.stringify({app:'GodEye v1.6.7', date:new Date().toISOString(), pages:pages.length, bill:billItems, faceLog:faceLog.slice(0,20)});
      client.publish('godeye/export/v167', payload);
      setStatus('✅ MQTT Sent to '+url+' - Topic: godeye/export/v167');
      setTimeout(()=>client.end(),1000);
    });
    client.on('error', ()=>{ setStatus('MQTT failed - Check URL / Internet'); client.end(); });
  }catch(e){ setStatus('MQTT error: '+e.message); }
}
function sendWebSocket(){
  // WebSocket - Free, LAN / Cloud, No Server Needed for Test
  let url=document.getElementById('ws_url').value.trim()||'ws://192.168.1.100:8080';
  try{
    let ws=new WebSocket(url);
    ws.onopen=()=>{ ws.send(JSON.stringify({type:'godeye_export', pages:pages.length, bill:billItems, faceLog})); setStatus('✅ WebSocket Sent to '+url); ws.close(); };
    ws.onerror=()=>setStatus('WebSocket failed - Is server running at '+url+' ? For LAN, run Node / Python WS server on PC.');
  }catch(e){ setStatus('WebSocket error: '+e.message); }
}
function sendWebRTC(){
  // WebRTC - Free P2P, No Server, DataChannel
  setStatus('WebRTC P2P: Copy this page URL and open on 2nd phone on same WiFi, then use Web Share. Full P2P DataChannel needs signaling server - Use MQTT / WebSocket above as signaling for free.');
  // Note: True WebRTC needs signaling - we use MQTT as free signaling, no paid server
  sendMQTT();
}
function printNow(){
  // Print API - Free, Browser -> Bluetooth / WiFi / USB Printer
  window.print();
